<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gedcom-relationships.js"></script><style>:root{--bg:#f7f1e7;--card:#fffdf9;--ink:#2f2418;--muted:#756a5e;--accent:#6b4f2f;--gold:#c99d3b;--line:#e2d7c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:13px 16px}.bar{max-width:1200px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid #ffffff35;background:#ffffff14;color:inherit;border-radius:10px;padding:8px 12px;cursor:pointer}.btn.active,.btn:hover{background:#ffffff25}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.login{max-width:520px;margin:55px auto}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.status{color:var(--muted);font-size:13px;margin-top:8px}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.active,.primary{background:var(--accent);color:#fff}.tree{display:grid;gap:14px}.branch{border-left:3px solid var(--gold);padding:0 0 4px 14px}.head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.title{font-weight:800}.person{display:inline-flex;vertical-align:top;flex-direction:column;gap:5px;width:220px;min-height:112px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;margin:4px}.person:hover{box-shadow:0 7px 18px #0001}.avatar{width:48px;height:48px;border-radius:50%;background:#eee2cf;display:grid;place-items:center;font-size:21px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{color:var(--muted);font-size:12px}.children{margin:6px 0 8px 18px;padding:8px 0 0 14px;border-left:2px dashed var(--line);display:grid;gap:10px}.spouses{font-size:12px;color:var(--muted);margin:4px 0 7px 6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid .person{width:auto;margin:0}.empty{text-align:center;padding:30px;color:var(--muted)}.modal{position:fixed;inset:0;background:#24170b99;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px;position:relative}.x{position:absolute;right:15px;top:10px;border:0;background:none;font-size:25px;cursor:pointer}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}@media(max-width:700px){.wrap{padding:10px}.person{width:100%;margin:3px 0}.children{margin-left:8px;padding-left:10px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots <span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="signOut()" id="logout" style="display:none">Logout</button></div></header><main class="wrap"><section id="login" class="panel login hidden"><h2>🔐 Family Login</h2><p class="meta">Sign in to access the shared family database.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="actions"><button class="btn primary" onclick="signIn()">🔑 Sign In</button></div><div id="authStatus" class="status"></div></section><section id="app"><div class="panel"><div class="tabs"><button class="btn tab active" id="treeTab" onclick="setView('tree')">🌳 Tree View</button><button class="btn tab" id="listTab" onclick="setView('list')">📋 List View</button></div><input id="search" class="search" placeholder="🔍 Search family member…" oninput="render()"><div id="status" class="status">🔄 Opening Family Tree…</div></div><div id="content"></div></section></main><div id="modal" class="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>(function(){'use strict';const URL='https://umbhqintywwsyduzrtai.supabase.co',KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K';let db,people=[],user=null,view='tree',open=new Set(),byKey=new Map();const GP=window.GEDCOM_PARENTS||{},GS=window.GEDCOM_SPOUSES||{};const canon=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase();const m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const vals=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(vals);if(typeof v==='object')return Object.values(v).flatMap(vals);let s=String(v).trim();try{let j=JSON.parse(s);if(j!==s)return vals(j)}catch{}return s.split(/[,;|\s]+/).map(x=>x.replace(/^[\[\]{}"']+|[\[\]{}"']+$/g,'')).filter(Boolean)};function mapPeople(){byKey=new Map(people.map(p=>[canon(p.external_id),p]));}function ged(map,id){const k=canon(id);return map[id]||map[k]||map['@'+k+'@']||map['@'+k]||[]}function rel(p,field,map){const dbids=vals(p[field]).map(canon).map(k=>byKey.get(k)).filter(Boolean);if(dbids.length)return dbids;return ged(map,p.external_id).map(canon).map(k=>byKey.get(k)).filter(Boolean)}function parents(p){return rel(p,'parent_ids',GP)}function spouses(p){return rel(p,'spouse_ids',GS)}function children(p){const k=canon(p.external_id);return people.filter(c=>parents(c).some(x=>canon(x.external_id)===k))}function roots(){const childIds=new Set();people.forEach(p=>parents(p).forEach(()=>childIds.add(canon(p.external_id))));const rs=people.filter(p=>!childIds.has(canon(p.external_id)));const out=[];for(const p of rs){const sk=spouses(p).map(x=>canon(x.external_id));if(!out.some(x=>canon(x.external_id)===canon(p.external_id)||sk.includes(canon(x.external_id))))out.push(p)}return out}function card(p){return '<article class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div class="avatar">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'">':'👤')+'</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></article>'}function branch(p,seen=new Set()){const k=canon(p.external_id);if(seen.has(k))return'';const n=new Set(seen);n.add(k);const sp=spouses(p),kids=children(p),isOpen=open.has(k);let h='<div class="branch"><div class="head"><button class="btn" onclick="event.stopPropagation();toggle(\''+esc(p.external_id)+'\')">'+(isOpen?'−':'＋')+'</button><span class="title">Family branch</span></div>'+card(p);if(sp.length)h+='<div class="spouses">💍 '+sp.map(x=>esc(x.full_name||'Unnamed')).join(' · ')+'</div>';if(isOpen&&kids.length)h+='<div class="children">'+kids.map(x=>branch(x,n)).join('')+'</div>';return h+'</div>'}function render(){const c=document.getElementById('content');if(view==='list'||document.getElementById('search').value.trim()){const q=document.getElementById('search').value.trim().toLowerCase(),a=people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q));c.innerHTML=a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<div class="panel empty">No family member found.</div>';return}const rs=roots();c.innerHTML='<div class="tree">'+rs.map(p=>branch(p)).join('')+'</div>'}function toggle(id){const k=canon(id);open.has(k)?open.delete(k):open.add(k);render()}function expandAll(){people.forEach(p=>open.add(canon(p.external_id)));render()}function collapseAll(){open.clear();render()}function setView(v){view=v;treeTab.classList.toggle('active',v==='tree');listTab.classList.toggle('active',v==='list');render()}function profile(id){const p=byKey.get(canon(id));if(!p)return;document.getElementById('modalBody').innerHTML='<h2>'+esc(p.full_name||'Unnamed')+'</h2><p class="meta">Parents: '+(parents(p).map(x=>esc(x.full_name)).join(', ')||'—')+'<br>Spouse: '+(spouses(p).map(x=>esc(x.full_name)).join(', ')||'—')+'<br>Children: '+(children(p).map(x=>esc(x.full_name)).join(', ')||'—')+'</p><label>Full name</label><input id="en" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="eb" value="'+esc(p.birth_date)+'"><label>Place</label><input id="ep" value="'+esc(p.place||p.address)+'"><label>Occupation</label><input id="eo" value="'+esc(p.occupation)+'"><label>Bio / Notes</label><textarea id="ex">'+esc(p.bio)+'</textarea><div class="actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="save(\''+esc(id)+'\')">💾 Save Edit</button></div>';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function save(id){const r=await db.from('family_members').update({full_name:en.value.trim()||'Unnamed',birth_date:eb.value||null,place:ep.value||null,occupation:eo.value||null,bio:ex.value||null}).eq('external_id',id);if(r.error){alert(r.error.message);return}closeModal();await load()}async function signIn(){authStatus.textContent='Login is intentionally bypassed for this test.'}async function signOut(){await db.auth.signOut()}async function load(){status.textContent='🔄 Loading family data from Supabase…';const r=await db.from('family_members').select('*').order('full_name');if(r.error){status.textContent='❌ Supabase data access: '+r.error.message;return}people=r.data||[];mapPeople();people.forEach(p=>open.add(canon(p.external_id)));const links=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active · '+roots().length+' family roots';render()}async function boot(){db=window.supabase.createClient(URL,KEY);login.classList.add('hidden');app.classList.remove('hidden');await load()}window.setView=setView;window.expandAll=expandAll;window.collapseAll=collapseAll;window.toggle=toggle;window.profile=profile;window.closeModal=closeModal;window.save=save;window.signIn=signIn;window.signOut=signOut;boot()})();</script></body></html>
