emplate-columns:1fr}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Edit Family Relationships</span></div><button class="btn" onclick="goTree()">🌳 Tree</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><h2>✏️ Correct Your Family Roots</h2><div class="meta">Search a person, open Edit, correct Parents / Spouse / name, then Save.</div><input id="search" class="search" placeholder="🔍 Search family member…" autocomplete="off"><div id="status" class="status">Connecting to family database…</div></section><section class="panel"><div id="people" class="people"></div></section></main><div id="edit" class="edit"><div class="box"><div class="head"><div><div class="meta">EDIT FAMILY MEMBER</div><h2 id="title"></h2></div><button class="btn close" onclick="closeEdit()">✕</button></div><div class="grid"><div><label>Full name</label><input id="name"></div><div><label>Birth date</label><input id="birth"></div><div><label>Place</label><input id="place"></div><div><label>Occupation</label><input id="job"></div></div><label>Parent 1</label><select id="p1"></select><label>Parent 2</label><select id="p2"></select><label>Spouse 1</label><select id="s1"></select><label>Spouse 2</label><select id="s2"></select><div class="meta">Leave — None — when a relationship is unknown. GEDCOM IDs are shown to avoid guessing.</div><div id="msg" class="status"></div><div class="actions"><button class="btn" onclick="closeEdit()">Cancel</button><button class="btn primary" onclick="saveEdit()">💾 Save</button></div></div></div><script>const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SK='mfr_session_v1';let people=[],current=null;const $=id=>document.getElementById(id),key=x=>String(x||'').trim().replace(/^@|@$/g,'').toLowerCase(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const vals=v=>Array.isArray(v)?v:(v?String(v).split(/[,;|\s]+/).filter(Boolean):[]);function showPeople(){let q=$('search').value.trim().toLowerCase(),a=people.filter(p=>(p.full_name+' '+p.external_id+' '+(p.place||'')).toLowerCase().includes(q));$('people').innerHTML=a.length?a.map(p=>'<div class="person" onclick="openEdit(\''+esc(p.external_id)+'\')"><div class="name">👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.external_id||'')+(p.birth_date?' · '+esc(p.birth_date):'')+'</div></div>').join(''):'<div class="meta">No family member found.</div>'}function options(id,chosen){let h='<option value="">— None —</option>';h+=people.map(p=>'<option value="'+esc(p.external_id)+'" '+(key(p.external_id)===key(chosen)?'selected':'')+'>'+esc(p.full_name||'Unnamed')+' ['+esc(p.external_id)+']</option>').join('');$(id).innerHTML=h}function openEdit(id){current=people.find(p=>key(p.external_id)===key(id));if(!current)return;$('title').textContent=current.full_name||'Unnamed';$('name').value=current.full_name||'';$('birth').value=current.birth_date||'';$('place').value=current.place||'';$('job').value=current.occupation||'';let p=vals(current.parent_ids),s=vals(current.spouse_ids);options('p1',p[0]);options('p2',p[1]);options('s1',s[0]);options('s2',s[1]);$('msg').textContent='';$('edit').classList.add('open')}function closeEdit(){$('edit').classList.remove('open');current=null}async function api(path,opt={}){let s=JSON.parse(localStorage.getItem(SK)||'null');if(!s?.access_token)throw Error('No login session. Please sign in again.');let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{let r=await fetch(U+path,{...opt,signal:ctl.signal,headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json',...(opt.headers||{})}});if(r.status===401&&s.refresh_token){let rr=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});let ns=await rr.json().catch(()=>null);if(rr.ok&&ns?.access_token){localStorage.setItem(SK,JSON.stringify(ns));return api(path,opt)}throw Error('Session expired. Please sign in again.')}if(!r.ok)throw Error((await r.text())||('Database HTTP '+r.status));return r}catch(e){if(e.name==='AbortError')throw Error('Database connection timed out. Please reload once.');throw e}finally{clearTimeout(timer)}}async function load(){try{$('status').textContent='🔄 Loading family members…';let d=await api('/rest/v1/family_members?select=*&order=full_name.asc');people=Array.isArray(d)?d:[];$('status').innerHTML='<span class="ok">✅ '+people.length+' family members loaded · Search and Edit are ready.</span>';showPeople()}catch(e){$('status').innerHTML='<span class="err">❌ '+esc(e.message)+'</span><br><span class="meta">If it says session expired, use Login again.</span>'}}async function saveEdit(){if(!current)return;let ps=[$('p1').value,$('p2').value].filter(Boolean).filter((x,i,a)=>a.findIndex(y=>key(y)===key(x))===i),ss=[$('s1').value,$('s2').value].filter(Boolean).filter((x,i,a)=>a.findIndex(y=>key(y)===key(x))===i);$('msg').textContent='💾 Saving…';try{await api('/rest/v1/family_members?external_id=eq.'+encodeURIComponent(current.external_id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({full_name:$('name').value.trim()||'Unnamed',birth_date:$('birth').value||null,place:$('place').value.trim()||null,occupation:$('job').value.trim()||null,parent_ids:ps,spouse_ids:ss})});$('msg').innerHTML='<span class="ok">✅ Saved successfully.</span>';setTimeout(()=>{closeEdit();load()},500)}catch(e){$('msg').innerHTML='<span class="err">❌ '+esc(e.message)+'</span>'}}function goTree(){location.replace('family-roots-production.html?v=20260911-tree')}function logout(){localStorage.removeItem(SK);location.replace('login.html?v=20260911-3')}$('search').addEventListener('input',showPeople);window.openEdit=openEdit;
