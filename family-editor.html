<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots — Edit</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f1e7;--card:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1000px;margin:auto}.bar{display:flex;gap:8px;align-items:center}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 13px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:var(--accent)!important;color:#fff!important}.wrap{padding:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.search,select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.people{display:grid;gap:7px;margin-top:12px}.person{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer}.name{font-weight:800}.meta{font-size:12px;color:var(--muted)}.edit{display:none;position:fixed;inset:0;background:#24170bcc;z-index:10;overflow:auto;padding:12px}.edit.open{display:block}.box{max-width:700px;margin:auto;background:var(--card);border-radius:18px;padding:18px}.head{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}.head h2{margin:0}.close{margin-left:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{margin-top:10px;color:var(--muted)}.ok{color:#176b35;font-weight:700}.err{color:#a33;font-weight:700}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}.actions .btn{flex:1}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Edit Family Relationships</span></div><button class="btn" onclick="goTree()">🌳 Tree</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><h2>✏️ Correct Your Family Roots</h2><p class="meta">Search a person, open Edit, correct Parents / Spouse / name, then Save.</p><input id="search" class="search" placeholder="🔍 Search by name or ID…"></section><section class="panel"><div id="status">Connecting to family database…</div><div id="people" class="people"></div></section></main><div id="edit" class="edit"><div class="box"><div class="head"><div><div class="meta">EDIT FAMILY MEMBER</div><h2 id="title"></h2></div><button class="btn close" onclick="closeEdit()">✕</button></div><div class="grid"><div><label>Full name</label><input id="name"></div><div><label>Birth date</label><input id="birth"></div><div><label>Place</label><input id="place"></div><div><label>Occupation</label><input id="job"></div></div><label>Parent 1</label><select id="p1"></select><label>Parent 2</label><select id="p2"></select><label>Spouse 1</label><select id="s1"></select><label>Spouse 2</label><select id="s2"></select><div class="meta" style="margin-top:10px">Leave — None — when unknown. GEDCOM IDs are shown.</div><div id="msg" class="status"></div><div class="actions"><button class="btn" onclick="closeEdit()">Cancel</button><button class="btn active" onclick="saveEdit()">💾 Save</button></div></div></div><script>const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8',SK='mfr_session_v1';const sb=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:true}});let people=[],current=null,session=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=x=>String(x??'').trim().replace(/^@|@$/g,'').toLowerCase();const vals=v=>Array.isArray(v)?v:(v==null||v===''?[]:String(v).split(/[,;|\s]+/).map(x=>x.replace(/^@|@$/g,'')).filter(Boolean));function options(sel,chosen){let h='<option value="">— None —</option>';h+=people.map(p=>'<option value="'+esc(p.external_id)+'" '+(key(p.external_id)===key(chosen)?'selected':'')+'>'+esc(p.full_name||'Unnamed')+' ['+esc(p.external_id)+']</option>').join('');$(sel).innerHTML=h}function showPeople(){const q=$('search').value.trim().toLowerCase();const a=people.filter(p=>[p.full_name,p.external_id,p.place].join(' ').toLowerCase().includes(q));$('people').innerHTML=a.map(p=>'<div class="person" onclick="openEdit(\''+esc(p.external_id)+'\')"><div>👤</div><div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.external_id||'')+(p.birth_date?' · '+esc(p.birth_date):'')+'</div></div></div>').join('')||'<div class="meta">No person found.</div>'}function openEdit(id){current=people.find(p=>key(p.external_id)===key(id));if(!current)return;$('title').textContent=current.full_name||'Unnamed';$('name').value=current.full_name||'';$('birth').value=current.birth_date||'';$('place').value=current.place||'';$('job').value=current.occupation||'';const ps=vals(current.parent_ids),ss=vals(current.spouse_ids);options('p1',ps[0]||'');options('p2',ps[1]||'');options('s1',ss[0]||'');options('s2',ss[1]||'');$('msg').textContent='';$('edit').classList.add('open')}function closeEdit(){$('edit').classList.remove('open');current=null}async function getSession(){let s=null;try{s=JSON.parse(localStorage.getItem(SK)||'null')}catch{}if(!s?.access_token)return null;if(s.refresh_token){const r=await sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});if(r.data?.session){session=r.data.session;localStorage.setItem(SK,JSON.stringify(r.data.session));return session}}session=s;return s}async function load(){try{session=await getSession();if(!session)throw Error('No login session');let r=await sb.from('family_members').select('*').order('full_name');if(r.error)throw r.error;people=r.data||[];$('status').innerHTML='✅ '+people.length+' family members loaded · Search and Edit are ready.';showPeople();if(!people.length)$('status').innerHTML='⚠️ Database returned 0 family members. The login works, but the database access policy needs checking.'}catch(e){$('status').innerHTML='<span class="err">❌ '+esc(e.message||String(e))+'</span>'}}async function saveEdit(){if(!current)return;const ps=[$('p1').value,$('p2').value].filter(Boolean).filter((x,i,a)=>a.findIndex(y=>key(y)===key(x))===i),ss=[$('s1').value,$('s2').value].filter(Boolean).filter((x,i,a)=>a.findIndex(y=>key(y)===key(x))===i);$('msg').textContent='Saving…';try{const r=await sb.from('family_members').update({full_name:$('name').value.trim()||'Unnamed',birth_date:$('birth').value||null,place:$('place').value.trim()||null,occupation:$('job').value.trim()||null,parent_ids:ps,spouse_ids:ss}).eq('external_id',current.external_id);if(r.error)throw r.error;current.full_name=$('name').value.trim()||'Unnamed';current.birth_date=$('birth').value||null;current.place=$('place').value.trim()||null;current.occupation=$('job').value.trim()||null;current.parent_ids=ps;current.spouse_ids=ss;for(const id of ss){const other=people.find(p=>key(p.external_id)===key(id));if(other){const a=vals(other.spouse_ids);if(!a.some(x=>key(x)===key(current.external_id)))a.push(current.external_id);const z=await sb.from('family_members').update({spouse_ids:a}).eq('external_id',other.external_id);if(z.error)throw z.error;other.spouse_ids=a}}$('msg').innerHTML='<span class="ok">✅ Saved successfully.</span>';showPeople()}catch(e){$('msg').innerHTML='<span class="err">❌ '+esc(e.message||String(e))+'</span>'}}function goTree(){location.replace('family-roots10.html?v=20260911-4')}async function logout(){await sb.auth.signOut();localStorage.removeItem(SK);location.replace('login.html?v=20260911-4')}$('search').addEventListener('input',showPeople);Object.assign(window,{openEdit,closeEdit,saveEdit,goTree,logout});load()</script></body></html>
