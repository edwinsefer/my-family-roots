<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><style>:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b;--ok:#2e7d32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:13px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:var(--accent)!important;color:#fff!important}.wrap{padding:12px}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 20px #4d35140b}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:10px}.status{margin-top:9px;color:var(--muted)}.tree{overflow:auto;padding:4px 0 25px}.family{min-width:700px;text-align:center;margin:0 auto 42px}.couple{display:flex;justify-content:center;align-items:center;gap:8px}.person,.kidcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}.person{min-width:220px}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.marry{font-size:18px}.down{width:70%;max-width:900px;margin:auto;height:25px;border:2px solid var(--gold);border-bottom:0}.kids{display:flex;justify-content:center;gap:12px;align-items:flex-start}.kid{min-width:180px;max-width:245px;position:relative}.kid:before{content:"";position:absolute;top:-25px;left:50%;height:25px;border-left:2px solid var(--gold)}.spousehint{font-size:11px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:10px}.overlay.open{display:block}.modal{max-width:760px;margin:15px auto;background:var(--paper);border-radius:20px;padding:17px}.head{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}.head h2{margin:0}.close{margin-left:auto}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}.relbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:10px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.chip{border:1px solid var(--line);background:#faf6ef;border-radius:999px;padding:6px 9px;cursor:pointer}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.primary{background:var(--accent);color:#fff;border:0}.danger{background:#fff3f0;color:#a33;border-color:#e2b7ad}.hint{font-size:12px;color:var(--muted)}.ok{color:var(--ok);font-weight:700}@media(max-width:700px){.bar{flex-wrap:wrap}.brand{width:100%}.family{min-width:650px}.person{min-width:195px}.kids{gap:8px}}
</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button id="treeBtn" class="btn active" onclick="setView('tree')">🌳 Tree</button><button id="listBtn" class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><button id="treeBtn2" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="listBtn2" class="btn" onclick="setView('list')">📋 All People</button><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="modal"><div class="head"><div><div class="meta">PERSON</div><h2 id="modalTitle">Family Member</h2></div><button class="btn close" onclick="closeModal()">✕ Close</button></div><div id="modalBody"></div></div></div><script src="gedcom-relationships.js?v=20260911-1"></script><script>const SUPA='https://umbhqintywwsyduzrtai.supabase.co',KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8',SESSION='mfr_session_v1';let people=[],view='tree',editing=null;const norm=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toUpperCase();return s?('@'+s.replace(/^I/i,'I')+'@'):''};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sess=()=>{try{return JSON.parse(localStorage.getItem(SESSION)||'null')}catch{return null}};const token=()=>sess()?.access_token||'';const showStatus=s=>document.getElementById('status').textContent=s;function byId(id){const n=norm(id);return people.find(p=>norm(p.external_id)===n)||null}function idsFromDb(a){if(!Array.isArray(a))return[];return a.map(x=>people.find(p=>String(p.id)===String(x))?.external_id).filter(Boolean).map(norm)}function relMap(map,id){const n=norm(id);return (map[n]||map[id]||[]).map(norm).filter(Boolean)}function parents(p){return relMap(window.GEDCOM_PARENTS,p.external_id)}function spouses(p){return relMap(window.GEDCOM_SPOUSES,p.external_id)}function roots(){const child=new Set();people.forEach(p=>parents(p).forEach(x=>child.add(x)));return people.filter(p=>!child.has(norm(p.external_id)))}function childrenOf(p){const n=norm(p.external_id);return people.filter(c=>parents(c).includes(n))}function label(p){return p?.name||'Unnamed'}function card(p,cls='person'){const sp=spouses(p).map(byId).filter(Boolean);return '<div class="'+cls+'" onclick="openPerson(\''+esc(p.external_id)+'\')"><div class="name">👤 '+esc(label(p))+'</div><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+'</div>'+(sp.length?' <div class="spousehint">💍 '+esc(label(sp[0]))+'</div>':'')+'</div>'}function familyBlock(p){const sp=spouses(p).map(byId).filter(Boolean);const kids=childrenOf(p);if(!kids.length)return '<div class="family"><div class="couple">'+card(p)+(sp.length?'<div class="marry">💍</div>'+card(sp[0]):'')+'</div></div>';return '<div class="family"><div class="couple">'+card(p)+(sp.length?'<div class="marry">💍</div>'+card(sp[0]):'')+'</div><div class="down"></div><div class="kids">'+kids.map(c=>'<div class="kid">'+card(c,'kidcard')+'</div>').join('')+'</div></div>'}function renderTree(){document.getElementById('content').innerHTML='<div class="card"><div class="hint">🔒 GEDCOM is the relationship baseline. Use <b>Edit & Save</b> to correct family relationships; saves use the real database row IDs resolved from each person’s external ID.</div><div class="tree">'+roots().map(familyBlock).join('')+'</div></div>'}function renderList(){document.getElementById('content').innerHTML='<div class="card"><div class="grid">'+people.map(p=>card(p)).join('')+'</div></div>'}function render(){view==='tree'?renderTree():renderList()}function setView(v){view=v;document.getElementById('treeBtn').classList.toggle('active',v==='tree');document.getElementById('listBtn').classList.toggle('active',v==='list');document.getElementById('treeBtn2').classList.toggle('active',v==='tree');document.getElementById('listBtn2').classList.toggle('active',v==='list');render()}document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){render();return}const found=people.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.external_id||'').toLowerCase().includes(q));document.getElementById('content').innerHTML='<div class="card"><div class="grid">'+found.map(p=>card(p)).join('')+'</div></div>'});function openPerson(id){const p=byId(id);if(!p)return;editing=p;document.getElementById('modalTitle').textContent=label(p);const ps=parents(p).map(byId).filter(Boolean),ss=spouses(p).map(byId).filter(Boolean),cs=childrenOf(p);document.getElementById('modalBody').innerHTML='<div class="field"><label>Name</label><input id="e_name" value="'+esc(p.name||'')+'"></div><div class="field"><label>Sex</label><select id="e_sex"><option value="">—</option><option value="M" '+(p.sex==='M'?'selected':'')+'>Male</option><option value="F" '+(p.sex==='F'?'selected':'')+'>Female</option></select></div><div class="field"><label>Birth date</label><input id="e_birth" value="'+esc(p.birth_date||'')+'" placeholder="YYYY-MM-DD"></div><div class="field"><label>Place</label><input id="e_place" value="'+esc(p.place||'')+'"></div><div class="relbox"><b>👨‍👩‍👧 Parents</b><div class="chips">'+(ps.length?ps.map(x=>'<span class="chip" onclick="openPerson(\''+esc(x.external_id)+'\')">'+esc(label(x))+'</span>').join(''):'<span class="hint">No parents recorded</span>')+'</div><button class="btn" style="margin-top:8px" onclick="chooseRel(\'parents\')">✏️ Edit parents</button></div><div class="relbox"><b>💍 Spouse</b><div class="chips">'+(ss.length?ss.map(x=>'<span class="chip" onclick="openPerson(\''+esc(x.external_id)+'\')">'+esc(label(x))+'</span>').join(''):'<span class="hint">No spouse recorded</span>')+'</div><button class="btn" style="margin-top:8px" onclick="chooseRel(\'spouse\')">✏️ Edit spouse</button></div><div class="relbox"><b>👶 Children</b><div class="chips">'+(cs.length?cs.map(x=>'<span class="chip" onclick="openPerson(\''+esc(x.external_id)+'\')">'+esc(label(x))+'</span>').join(''):'<span class="hint">No children recorded</span>')+'</div></div><div id="relChooser"></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePerson()">💾 Save</button></div>';document.getElementById('overlay').classList.add('open')}function closeModal(){document.getElementById('overlay').classList.remove('open');editing=null}function chooseRel(type){if(!editing)return;const current=type==='spouse'?spouses(editing):parents(editing);const max=type==='spouse'?1:2;const options=people.filter(x=>norm(x.external_id)!==norm(editing.external_id));document.getElementById('relChooser').innerHTML='<div class="relbox"><b>Choose '+(type==='spouse'?'spouse':'parents')+'</b><div class="hint">Tap a name to select. '+(type==='spouse'?'One spouse can be saved here.':'Select up to two parents.')+'</div><input id="relSearch" class="search" placeholder="Search name or ID…"><div id="relOptions" class="grid" style="margin-top:8px"></div><div class="actions"><button class="btn" onclick="document.getElementById(\'relChooser\').innerHTML=\'\'">Done</button></div></div>';const renderOpts=()=>{const q=(document.getElementById('relSearch').value||'').toLowerCase();document.getElementById('relOptions').innerHTML=options.filter(x=>!q||(x.name||'').toLowerCase().includes(q)||(x.external_id||'').toLowerCase().includes(q)).slice(0,80).map(x=>'<button class="btn" onclick="pickRel(\''+esc(x.external_id)+'\',\''+type+'\')">'+esc(label(x))+' <span class="hint">'+esc(x.external_id)+'</span></button>').join('')};document.getElementById('relSearch').addEventListener('input',renderOpts);renderOpts()}function pickRel(id,type){if(!editing)return;const n=norm(id);if(type==='spouse'){editing._editSpouse=n}else{editing._editParents=editing._editParents||[];if(editing._editParents.includes(n))editing._editParents=editing._editParents.filter(x=>x!==n);else if(editing._editParents.length<2)editing._editParents.push(n)}document.getElementById('relChooser').insertAdjacentHTML('beforeend','<div class="ok">✓ Selected '+esc(label(byId(n)))+'</div>')}function dbIdsFromExternal(ids){return ids.map(n=>people.find(p=>norm(p.external_id)===norm(n))?.id).filter(x=>x!==undefined).map(Number)}async function patchPerson(p,body){const r=await fetch(SUPA+'/rest/v1/family_members?external_id=eq.'+encodeURIComponent(p.external_id),{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+token(),'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text())}async function savePerson(){if(!editing)return;const p=editing;const body={name:document.getElementById('e_name').value.trim(),sex:document.getElementById('e_sex').value||null,birth_date:document.getElementById('e_birth').value.trim()||null,place:document.getElementById('e_place').value.trim()||null};if(p._editParents)body.parent_ids=dbIdsFromExternal(p._editParents);if(p._editSpouse!==undefined)body.spouse_ids=dbIdsFromExternal([p._editSpouse]);try{showStatus('Saving '+label(p)+'…');await patchPerson(p,body);Object.assign(p,body);if(body.parent_ids!==undefined){window.GEDCOM_PARENTS[norm(p.external_id)]=p._editParents.slice()}if(body.spouse_ids!==undefined){window.GEDCOM_SPOUSES[norm(p.external_id)]=[p._editSpouse];const s=byId(p._editSpouse);if(s)window.GEDCOM_SPOUSES[norm(s.external_id)]=[norm(p.external_id)]}delete p._editParents;delete p._editSpouse;closeModal();showStatus('✅ Saved. Relationship changes use external IDs and resolved database IDs.');render()}catch(e){showStatus('❌ Save failed: '+(e.message||e));}}async function load(){try{const r=await fetch(SUPA+'/rest/v1/family_members?select=*',{headers:{apikey:KEY,Authorization:'Bearer '+token()}});if(!r.ok)throw Error('Database load failed ('+r.status+')');people=await r.json();showStatus('✅ '+people.length+' family members loaded · GEDCOM relationships active · Edit & Save enabled');render()}catch(e){showStatus('❌ '+(e.message||e))}}function logout(){localStorage.removeItem(SESSION);location.replace('login.html?v=20260911-11')}if(!token()){location.replace('login.html?v=20260911-11')}else load();</script></body></html>
