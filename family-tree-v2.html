<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f8f4ec;--card:#fffdf8;--ink:#2f2418;--muted:#756a5e;--accent:#6b4f2f;--gold:#c99d3b;--line:#e2d7c6;--green:#4d795b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px 18px;box-shadow:0 4px 18px #0002}.bar{max-width:1200px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{font-size:11px;opacity:.8;display:block}.btn{border:1px solid #ffffff35;background:#ffffff14;color:inherit;border-radius:10px;padding:9px 13px;cursor:pointer}.btn:hover{background:#ffffff25}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.login{max-width:520px;margin:60px auto}.hidden{display:none!important}.status{color:var(--muted);font-size:13px;margin-top:8px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.active,.primary{background:var(--accent);color:#fff}.treeRoot{display:grid;gap:12px}.family{border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px}.familyHead{display:flex;align-items:center;gap:8px;cursor:pointer}.branch{margin-left:20px;padding-left:18px;border-left:2px solid #d8c8ae;margin-top:10px;display:grid;gap:10px}.couple{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.person{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fffdf9;cursor:pointer;min-width:180px;max-width:260px}.person:hover{box-shadow:0 6px 16px #00000012;transform:translateY(-1px)}.avatar{width:44px;height:44px;border-radius:50%;background:#eee2cf;display:grid;place-items:center;font-size:20px;overflow:hidden;float:left;margin-right:9px}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{color:var(--muted);font-size:12px}.clear{clear:both}.kids{display:grid;gap:8px}.kidLabel{font-size:12px;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.modal{position:fixed;inset:0;background:#24170b99;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px;position:relative}.x{position:absolute;right:15px;top:10px;border:0;background:none;font-size:25px;cursor:pointer}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:700px){.wrap{padding:10px}.person{min-width:0;max-width:none}.branch{margin-left:8px;padding-left:10px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots <span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="signOut()" id="logout" style="display:none">Logout</button></div></header><main class="wrap"><section id="login" class="panel login"><h2>🔐 Family Login</h2><p class="meta">Sign in to access the shared family database.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="btn primary" onclick="signIn()">🔑 Sign In</button></div><div id="authStatus" class="status"></div></section><section id="app" class="hidden"><div class="panel"><div class="tabs"><button class="btn tab active" id="treeTab" onclick="setView('tree')">🌳 Tree View</button><button class="btn tab" id="listTab" onclick="setView('list')">📋 List View</button></div><input id="search" class="search" placeholder="🔍 Search family member…" oninput="render()"><div id="status" class="status"></div></div><div id="content"></div></section></main><div id="modal" class="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>(function(){'use strict';const SUPABASE_URL='https://umbhqintywwsyduzrtai.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K';let supabaseClient=null,people=[],user=null,view='tree',expanded=new Set(),children=new Map(),parents=new Map(),spouses=new Map();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ids(v){if(!v)return[];if(Array.isArray(v))return v.flatMap(ids);if(typeof v==='object')return Object.values(v).flatMap(ids);let s=String(v).trim();if(!s)return[];try{let j=JSON.parse(s);if(j!==v)return ids(j)}catch{}s=s.replace(/[{}\[\]"']/g,' ');return s.split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean)}function build(){children=new Map();parents=new Map();spouses=new Map();const known=new Set(people.map(p=>String(p.external_id)));people.forEach(p=>{const id=String(p.external_id),ps=ids(p.parent_ids).filter(x=>known.has(String(x)));parents.set(id,ps);ps.forEach(pid=>{if(!children.has(pid))children.set(pid,[]);if(!children.get(pid).includes(id))children.get(pid).push(id)});const ss=ids(p.spouse_ids).filter(x=>known.has(String(x)));spouses.set(id,ss)});people.forEach(p=>{const id=String(p.external_id);(spouses.get(id)||[]).forEach(s=>{if(!spouses.has(s))spouses.set(s,[]);if(!spouses.get(s).includes(id))spouses.get(s).push(id)})})}function initClient(){try{if(!window.supabase?.createClient)throw new Error('Supabase library did not load.');supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return true}catch(e){document.getElementById('authStatus').textContent='❌ '+e.message;return false}}async function boot(){if(!initClient())return;try{const r=await supabaseClient.auth.getSession();user=r.data?.session?.user||null;await authUI();supabaseClient.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;authUI()})}catch(e){document.getElementById('authStatus').textContent='❌ Connection error: '+e.message}}async function authUI(){document.getElementById('login').classList.toggle('hidden',!!user);document.getElementById('app').classList.toggle('hidden',!user);document.getElementById('logout').style.display=user?'block':'none';if(user)await load()}async function signIn(){if(!supabaseClient)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,status=document.getElementById('authStatus');if(!email||!password){status.textContent='❌ Please enter email and password.';return}status.textContent='Signing in…';try{const r=await Promise.race([supabaseClient.auth.signInWithPassword({email,password}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Login timed out. Please refresh and try again.')),15000))]);if(r.error)status.textContent='❌ '+r.error.message;else status.textContent='✅ Signed in.'}catch(e){status.textContent='❌ '+e.message}}async function signOut(){if(supabaseClient)await supabaseClient.auth.signOut()}async function load(){const status=document.getElementById('status');status.textContent='🔄 Loading family data…';try{const r=await Promise.race([supabaseClient.from('family_members').select('*').order('full_name',{ascending:true}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Database request timed out after 15 seconds.')),15000))]);if(r.error){status.textContent='❌ Database read failed: '+r.error.message;return}people=r.data||[];build();expanded.clear();people.forEach(p=>expanded.add(String(p.external_id)));status.textContent='✅ '+people.length+' family members loaded from Supabase · relationship tree ready';render()}catch(e){status.textContent='❌ '+e.message}}function setView(v){view=v;document.getElementById('treeTab').classList.toggle('active',v==='tree');document.getElementById('listTab').classList.toggle('active',v==='list');render()}function match(p,q){return !q||[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q)}function card(p){const photo=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'👤';return '<article class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div class="avatar">'+photo+'</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+'</div><div class="meta">'+(p.occupation?esc(p.occupation):'')+'</div><div class="clear"></div></article>'}function name(id){const p=people.find(x=>String(x.external_id)===String(id));return p?.full_name||'Unnamed'}function coupleIds(id){const out=[id,...(spouses.get(id)||[])];return [...new Set(out)].filter(x=>people.some(p=>String(p.external_id)===String(x)))}function familyBlock(id,seen=new Set(),depth=0){id=String(id);if(seen.has(id)||depth>12)return'';const p=people.find(x=>String(x.external_id)===id);if(!p)return'';const pair=coupleIds(id),kids=[...(children.get(id)||[])];pair.slice(1).forEach(s=>(children.get(s)||[]).forEach(k=>{if(!kids.includes(k))kids.push(k)}));const key=pair.slice().sort().join('|');const opened=expanded.has(id);const childHtml=kids.length&&opened?'<div class="branch"><div class="kidLabel">👨‍👩‍👧‍👦 Children ('+kids.length+')</div><div class="kids">'+kids.map(k=>familyBlock(k,new Set([...seen,...pair]),depth+1)).join('')+'</div></div>':'';return '<div class="family"><div class="familyHead" onclick="toggleFamily(\''+esc(id)+'\')"><span>'+(opened?'▾':'▸')+'</span><span class="meta">Family branch</span></div><div class="couple">'+pair.map(x=>card(people.find(p=>String(p.external_id)===String(x)))).join('<span class="meta">＋</span>')+'</div>'+childHtml+'</div>'}function roots(){const all=new Set(people.map(p=>String(p.external_id)));people.forEach(p=>(parents.get(String(p.external_id))||[]).forEach(x=>all.delete(String(p.external_id))));return [...all]}function renderTree(){const q=document.getElementById('search').value.trim().toLowerCase();if(q){const arr=people.filter(p=>match(p,q));return arr.length?'<div class="panel"><div class="name">🔎 Search results</div><div class="grid" style="margin-top:12px">'+arr.map(card).join('')+'</div></div>':'<div class="panel empty">No family member found.</div>'}const rs=roots();return '<div class="treeRoot">'+rs.map(r=>familyBlock(r)).join('')+'</div>'}function render(){if(!document.getElementById('search'))return;if(view==='list'){const q=document.getElementById('search').value.trim().toLowerCase(),arr=people.filter(p=>match(p,q));document.getElementById('content').innerHTML=arr.length?'<div class="grid">'+arr.map(card).join('')+'</div>':'<div class="panel empty">No family member found.</div>';return}document.getElementById('content').innerHTML=renderTree()}function toggleFamily(id){if(expanded.has(id))expanded.delete(id);else expanded.add(id);render()}function expandAll(){people.forEach(p=>expanded.add(String(p.external_id)));render()}function collapseAll(){expanded.clear();render()}function profile(id){const p=people.find(x=>String(x.external_id)===String(id));if(!p)return;const ps=parents.get(String(id))||[],ss=spouses.get(String(id))||[],cs=children.get(String(id))||[];document.getElementById('modalBody').innerHTML='<h2>'+esc(p.full_name||'Unnamed')+'</h2><p class="meta">ID: '+esc(p.external_id)+'</p><p class="meta">Parents: '+(ps.length?ps.map(name).join(', '):'—')+'</p><p class="meta">Spouse: '+(ss.length?ss.map(name).join(', '):'—')+'</p><p class="meta">Children: '+(cs.length?cs.map(name).join(', '):'—')+'</p><label>Full name</label><input id="e_name" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="e_birth" value="'+esc(p.birth_date)+'"><label>Place</label><input id="e_place" value="'+esc(p.place||p.address)+'"><label>Occupation</label><input id="e_occ" value="'+esc(p.occupation)+'"><label>Bio / Notes</label><textarea id="e_bio">'+esc(p.bio)+'</textarea><div class="actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="save(\''+esc(id)+'\')">💾 Save Edit</button></div>';document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}async function save(id){const patch={full_name:document.getElementById('e_name').value.trim()||'Unnamed',birth_date:document.getElementById('e_birth').value||null,place:document.getElementById('e_place').value||null,occupation:document.getElementById('e_occ').value||null,bio:document.getElementById('e_bio').value||null};const r=await supabaseClient.from('family_members').update(patch).eq('external_id',id);if(r.error){alert('Save failed: '+r.error.message);return}closeModal();await load()}window.setView=setView;window.signIn=signIn;window.signOut=signOut;window.expandAll=expandAll;window.collapseAll=collapseAll;window.toggleFamily=toggleFamily;window.profile=profile;window.closeModal=closeModal;window.save=save;boot()})();</script></body></html>
