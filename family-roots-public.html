<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><style>body{margin:0;background:#f7f1e7;color:#30251b;font:16px system-ui,sans-serif}.top{background:#6b4f2f;color:#fff;padding:18px}.top b{font-size:24px}.wrap{max-width:1050px;margin:auto;padding:14px}.panel{background:#fffdf9;border:1px solid #dfd2bf;border-radius:18px;padding:15px;margin-bottom:14px}.login{max-width:460px;margin:60px auto}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8ccb9;border-radius:11px;font:inherit;margin:6px 0 10px}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#6b4f2f;color:#fff;font-weight:800;font-size:15px}.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfd2bf;border-radius:12px;font:inherit}.tabs{display:flex;gap:8px;margin-top:10px}.tab{flex:1;padding:12px;border:0;border-radius:12px;background:#efe6d8;color:#5c4934;font-weight:800}.active{background:#6b4f2f;color:white}.status{color:#756a5e;margin:10px 0}.notice{padding:12px;background:#f4ecdf;border-radius:12px;color:#5c4934}.roots{display:grid;gap:14px}.branch{border:1px solid #dfd2bf;border-radius:16px;padding:12px}.couple{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.person{background:#fff;border:1px solid #dfd2bf;border-radius:13px;padding:11px;cursor:pointer;min-width:190px}.name{font-weight:800}.meta{font-size:12px;color:#756a5e;margin-top:4px}.children{margin-top:12px;padding-top:12px;border-top:1px dashed #dfd2bf;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.children .person{min-width:0}.toggle{margin:8px 0;border:0;border-radius:10px;padding:8px 11px;background:#efe6d8;color:#5c4934;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}.back{border:0;border-radius:10px;padding:10px 13px;background:#efe6d8;color:#5c4934;font-weight:800}.rel{margin-top:18px}.rel h3{margin:0 0 8px}.empty{text-align:center;color:#756a5e;padding:20px}.profile{text-align:center}.avatar{width:82px;height:82px;border-radius:50%;background:#eadfce;margin:auto;display:grid;place-items:center;font-size:35px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}@media(max-width:600px){.person{min-width:0;width:100%}.top b{font-size:21px}}</style></head><body><header class="top"><b>🌳 My Family Roots</b><div>Keelapavoor Family Heritage</div></header><main class="wrap"><section id="login" class="panel login"><h2>🔐 Family Login</h2><div class="status">Sign in to open your family tree.</div><label>Email</label><input id="email" class="input" type="email" autocomplete="username"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password"><button id="signin" class="btn">🔑 Sign In</button><div id="loginStatus" class="status"></div></section><section id="family" style="display:none"><div class="panel"><input id="q" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Loading family tree…</div><div class="tabs"><button id="tree" class="tab active">🌳 Tree</button><button id="list" class="tab">📋 List</button></div></div><div id="app"></div></section></main><script src="gedcom-relationships.js?v=20260911-4"></script><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K';let token='',people=[],by=new Map(),P={},S={},mode='tree',open=new Set();const $=x=>document.getElementById(x),id=x=>String(x??'').replace(/@/g,'').toLowerCase(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rel(g){let o={};Object.entries(g||{}).forEach(([k,v])=>o[id(k)]=(Array.isArray(v)?v:String(v||'').split(/[,;|\s]+/).filter(Boolean)).map(id));return o}function parents(p){return(P[id(p.gedcom_id)]||[]).map(x=>by.get(x)).filter(Boolean)}function spouses(p){return(S[id(p.gedcom_id)]||[]).map(x=>by.get(x)).filter(Boolean)}function children(p){return people.filter(c=>parents(c).some(x=>id(x.gedcom_id)===id(p.gedcom_id)))}function card(p){return '<div class="person" data-id="'+esc(p.gedcom_id)+'"><div class="name">👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.gedcom_id||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div>'}function roots(){let cs=new Set(people.flatMap(p=>parents(p).map(x=>id(p.gedcom_id))));return people.filter(p=>!cs.has(id(p.gedcom_id))&&!spouses(p).some(s=>cs.has(id(s.gedcom_id))))}function branch(p,n=1,seen=new Set()){let k=id(p.gedcom_id);if(seen.has(k))return '';let z=new Set(seen);z.add(k);let ss=spouses(p),ks=[...new Map([...children(p),...ss.flatMap(children)].map(x=>[id(x.gedcom_id),x])).values()],o=open.has(k);return '<div class="branch"><div><b>Generation '+n+'</b>'+(ks.length?' <button class="toggle" data-open="'+esc(k)+'">'+(o?'−':'＋')+' '+ks.length+'</button>':'')+'</div><div class="couple">'+card(p)+ss.map(s=>'💍'+card(s)).join('')+'</div>'+(o&&ks.length?'<div class="children">'+ks.map(c=>branch(c,n+1,z)).join('')+'</div>':'')+'</div>'}function profile(p){let pa=parents(p),ss=spouses(p),ch=children(p);$('app').innerHTML='<section class="panel profile"><button class="back" id="back">← Back</button><div class="avatar">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'">':'👤')+'</div><h2>'+esc(p.full_name||'Unnamed')+'</h2><div class="status">'+esc(p.gedcom_id||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+(p.death_date?' · ✝ '+esc(p.death_date):'')+'</div><div class="notice">🔒 Read-only. No family data is being changed.</div><div class="rel"><h3>👨‍👩‍👧 Parents</h3><div class="grid">'+(pa.length?pa.map(card).join(''):'<div class="empty">No parent relationship recorded.</div>')+'</div></div><div class="rel"><h3>💍 Spouse</h3><div class="grid">'+(ss.length?ss.map(card).join(''):'<div class="empty">No spouse relationship recorded.</div>')+'</div></div><div class="rel"><h3>👶 Children</h3><div class="grid">'+(ch.length?ch.map(card).join(''):'<div class="empty">No children recorded.</div>')+'</div></div></section>';bind();$('back').onclick=render}function render(){let q=$('q').value.trim().toLowerCase();if(q){let a=people.filter(p=>(p.full_name+' '+p.gedcom_id).toLowerCase().includes(q));$('app').innerHTML='<section class="panel"><div class="status">'+a.length+' matching member'+(a.length===1?'':'s')+'</div><div class="grid">'+a.map(card).join('')+'</div></section>';bind();return}if(mode==='list'){$('app').innerHTML='<section class="panel"><div class="grid">'+people.map(card).join('')+'</div></section>';bind();return}$('app').innerHTML='<section class="panel"><div class="notice">🌳 Tap a person for profile. Use ＋ to expand the next generation.</div><div class="roots">'+roots().map(r=>branch(r,1,new Set())).join('')+'</div></section>';bind();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();let k=id(b.dataset.open);open.has(k)?open.delete(k):open.add(k);render()})}function bind(){document.querySelectorAll('.person').forEach(e=>e.onclick=()=>{let p=by.get(id(e.dataset.id));if(p)profile(p)})}async function load(){let r=await fetch(U+'/rest/v1/family_members?select=*&order=full_name.asc',{headers:{apikey:K,Authorization:'Bearer '+token,Accept:'application/json'}}),d=await r.json().catch(()=>null);if(!r.ok)throw Error('Database HTTP '+r.status+(d?.message?': '+d.message:''));people=(d||[]).map(p=>({...p,gedcom_id:p.external_id||p.gedcom_id})).filter(p=>p.gedcom_id);by=new Map(people.map(p=>[id(p.gedcom_id),p]));P=rel(window.GEDCOM_PARENTS);S=rel(window.GEDCOM_SPOUSES);$('status').textContent='✅ '+people.length+' family members loaded · '+people.reduce((n,p)=>n+parents(p).length,0)+' GEDCOM parent links · '+roots().length+' family roots';render()}async function login(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginStatus').textContent='❌ Enter email and password.';return}$('signin').disabled=true;$('signin').textContent='Signing in…';$('loginStatus').textContent='Connecting securely…';try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error_description||d?.msg||d?.message||('Auth HTTP '+r.status));if(!d?.access_token)throw Error('Supabase did not return an access token.');token=d.access_token;$('login').style.display='none';$('family').style.display='block';$('loginStatus').textContent='';await load()}catch(e){$('loginStatus').textContent='❌ '+e.message;$('signin').disabled=false;$('signin').textContent='🔑 Sign In'}}$('signin').onclick=login;document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('signin').disabled&&$('login').style.display!=='none')login()});$('q').oninput=render;$('tree').onclick=()=>{mode='tree';$('tree').classList.add('active');$('list').classList.remove('active');render()};$('list').onclick=()=>{mode='list';$('list').classList.add('active');$('tree').classList.remove('active');render()}})()</script></body></html>
