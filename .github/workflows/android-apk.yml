name: Build My Family Roots Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'family-roots10.html'
      - 'family-roots-gallery.html'
      - 'tree-photo-preview.js'
      - 'photo-gallery-v3.js'
      - 'photo-gallery-fix.js'
      - 'photo-gallery-button-fix.js'
      - 'family-members-static.js'
      - 'gedcom-relationships.js'
      - 'relationship-overrides.js'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-family-roots-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "My Family Roots Android APK ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}. This release includes the latest verified tree photo preview fix."