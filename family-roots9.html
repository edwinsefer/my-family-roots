<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><style>:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b;--ok:#3d7c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:var(--accent)!important;color:#fff!important}.wrap{padding:16px}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:12px}.status{margin-top:10px;color:var(--muted);white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person,.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer}.person:hover,.mini:hover{border-color:var(--gold)}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.tree{overflow:auto;padding:12px 4px 30px}.family{min-width:760px;text-align:center;margin:0 auto 48px}.parents{display:inline-flex;align-items:center;justify-content:center}.coupleline{display:flex;align-items:center;gap:6px}.heart{font-size:16px}.down{width:70%;max-width:900px;margin:auto;height:28px;border:2px solid var(--gold);border-bottom:0}.kids{display:flex;justify-content:center;gap:14px;align-items:flex-start}.kid{min-width:185px;max-width:240px;position:relative}.kid:before{content:"";position:absolute;top:-28px;left:50%;height:28px;border-left:2px solid var(--gold)}.kidcard{background:#fffdf9;border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer}.kidcard:hover{border-color:var(--gold)}.spousehint{font-size:11px;color:var(--muted);margin-top:5px}.rootnote{text-align:center;margin-bottom:12px}.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:12px}.overlay.open{display:block}.focus{max-width:1050px;margin:auto;background:var(--paper);border-radius:20px;padding:18px;min-height:calc(100vh - 24px)}.head{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.head h2{margin:0}.close{margin-left:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.rel{display:block;width:100%;text-align:left;background:#faf6ef;border:1px solid #eadfce;border-radius:9px;padding:8px;margin:5px 0;cursor:pointer}.readonly{background:#f3eee5;border-radius:10px;padding:10px;margin-top:12px;color:var(--muted);font-size:13px}@media(max-width:700px){.wrap{padding:10px}.family{min-width:680px}.cols{grid-template-columns:1fr}.overlay{padding:7px}.focus{padding:12px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button class="btn active" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><div><button id="tb" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="lb" class="btn" onclick="setView('list')">📋 All People</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="focus"><div class="head"><div><div class="meta">PERSON FOCUS</div><h2 id="title">Family Member</h2></div><button class="btn close" onclick="closeFocus()">✕ Close</button></div><div id="body"></div></div></div><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SK='mfr_session_v1';let people=[],map=new Map(),GP={},GS={},view='tree';const $=id=>document.getElementById(id),status=$('status');const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/);return m?m[0]:s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(arr);if(typeof v==='object')return Object.values(v).flatMap(arr);try{const j=JSON.parse(v);if(j!==v)return arr(j)}catch(e){}return String(v).split(/[,;|\s]+/).filter(Boolean)};const sess=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}};async function req(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{...opt,signal:c.signal});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){d=text}if(!r.ok)throw Error('HTTP '+r.status+(d?.message?': '+d.message:''));return d}finally{clearTimeout(t)}}async function api(path,opt={}){const s=sess();if(!s?.access_token)throw Error('Login session missing. Please sign in again.');return req(U+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json',...(opt.headers||{})}})}function relFromMap(p,g){const id=p?.external_id;const candidates=[id,key(id),'@'+key(id)+'@','@'+key(id)];let raw=[];for(const c of candidates){if(Object.prototype.hasOwnProperty.call(g,c)){raw=g[c];break}}return arr(raw).map(key).map(k=>map.get(k)).filter(Boolean)}const parents=p=>relFromMap(p,GP),spouses=p=>relFromMap(p,GS),children=p=>people.filter(c=>parents(c).some(x=>key(x.external_id)===key(p.external_id)));function setView(v){view=v;render()}function personCard(p,cls='person'){return '<div class="'+cls+'" onclick="openFocus(\''+esc(p.external_id)+'\')">👤 <span class="name">'+esc(p.full_name||'Unnamed')+'</span><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+(p.place?' · 📍 '+esc(p.place):'')+'</div></div>'}function parentCouple(p){const ss=spouses(p).filter(x=>key(x.external_id)!==key(p.external_id));return '<div class="parents"><div class="coupleline">'+personCard(p)+(ss.length?' <span class="heart">💍</span> '+ss.map(x=>personCard(x)).join(''):'')+'</div></div>'}function familyUnit(p){let kids=children(p);const ss=spouses(p);ss.forEach(s=>children(s).forEach(c=>{if(!kids.some(x=>key(x.external_id)===key(c.external_id)))kids.push(c)}));return '<section class="family">'+parentCouple(p)+(kids.length?'<div class="down"></div><div class="kids">'+kids.map(c=>{const cs=spouses(c);return '<div class="kid"><div class="kidcard" onclick="openFocus(\''+esc(c.external_id)+'\')">👤 <span class="name">'+esc(c.full_name||'Unnamed')+'</span><div class="meta">'+(c.birth_date?'🎂 '+esc(c.birth_date):'')+'</div>'+(cs.length?'<div class="spousehint">💍 Spouse: '+esc(cs.map(x=>x.full_name||'Unnamed').join(', '))+'</div>':'')+'</div></div>'}).join('')+'</div>':'')+'</section>'}function roots(){const childIds=new Set();people.forEach(p=>parents(p).forEach(x=>childIds.add(key(p.external_id))));const out=[];for(const p of people){const k=key(p.external_id);if(childIds.has(k))continue;const ss=spouses(p).map(x=>key(x.external_id));if(!out.some(r=>key(r.external_id)===k||ss.includes(key(r.external_id))))out.push(p)}return out}function render(){const q=$('search').value.trim().toLowerCase();$('tb').classList.toggle('active',view==='tree');$('lb').classList.toggle('active',view==='list');const a=q?people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q)):people;if(view==='list'||q){$('content').innerHTML='<div class="card"><div class="grid">'+a.map(p=>personCard(p)).join('')+'</div></div>'}else{$('content').innerHTML='<div class="card"><div class="rootnote meta">GEDCOM is the only relationship source · spouse is not treated as a child</div><div class="tree">'+roots().map(familyUnit).join('')+'</div></div>'}}function list(items){return items.length?items.map(x=>'<button class="rel" onclick="openFocus(\''+esc(x.external_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</button>').join(''):'<div class="meta">—</div>'}function openFocus(id){const p=map.get(key(id));if(!p)return;$('title').textContent=p.full_name||'Family Member';$('body').innerHTML='<div class="cols"><div class="box"><h3>👤 '+esc(p.full_name||'Unnamed')+'</h3><div class="meta">ID: '+esc(p.external_id||'—')+'</div><p><b>Birth:</b> '+esc(p.birth_date||'—')+'</p><p><b>Place:</b> '+esc(p.place||'—')+'</p><p><b>Occupation:</b> '+esc(p.occupation||'—')+'</p><p><b>Generation:</b> '+esc(p.generation||'—')+'</p></div><div class="box"><h4>👨‍👩‍👧 Parents</h4>'+list(parents(p))+'<h4>💍 Spouse</h4>'+list(spouses(p))+'<h4>👶 Children</h4>'+list(children(p))+'<div class="readonly">🔒 Relationships are read from the GEDCOM master. This screen does not use database relationship fields.</div></div></div>';$('overlay').classList.add('open')}function closeFocus(){$('overlay').classList.remove('open')}async function load(){status.textContent='🔄 Connecting to family database…';try{const d=await api('/rest/v1/family_members?select=*&order=full_name.asc');if(!Array.isArray(d))throw Error('Unexpected database response.');people=d;map=new Map(people.map(p=>[key(p.external_id),p]));status.textContent='🔄 Loading GEDCOM relationship master…';await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='gedcom-relationships.js?v=20260910-1';s.onload=()=>{GP=window.GEDCOM_PARENTS||{};GS=window.GEDCOM_SPOUSES||{};resolve()};s.onerror=()=>reject(Error('GEDCOM relationship master failed to load.'));document.head.appendChild(s)});const pl=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+pl+' GEDCOM parent links · '+roots().length+' family roots';render()}catch(e){status.innerHTML='<span style="color:#a33;font-weight:700">❌ '+esc(e.message||String(e))+'</span><br><span class="meta">The app stopped safely. Your family data was not changed.</span>';console.error(e)}}window.setView=setView;window.openFocus=openFocus;window.closeFocus=closeFocus;window.logout=()=>{localStorage.removeItem(SK);location.replace('login.html?v=20260910-4')};$('search').addEventListener('input',render);window.addEventListener('error',e=>{status.innerHTML='<span style="color:#a33;font-weight:700">❌ App error: '+esc(e.message||'JavaScript error')+'</span>'});load()})()</script></body></html>
