<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><script src="gedcom-relationships.js"></script><style>:root{--bg:#f7f1e7;--card:#fffdf9;--ink:#2f2418;--muted:#756a5e;--accent:#6b4f2f;--gold:#c99d3b;--line:#e2d7c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px 16px}.bar{max-width:1200px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid #ffffff35;background:#ffffff14;color:inherit;border-radius:10px;padding:8px 12px;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.status{color:var(--muted);font-size:13px;margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:12px}.active{background:var(--accent)!important;color:#fff!important}.tree{display:grid;gap:14px}.branch{border-left:3px solid var(--gold);padding:0 0 5px 14px}.head{display:flex;align-items:center;gap:8px;margin-bottom:7px}.person{display:inline-flex;vertical-align:top;flex-direction:column;gap:5px;width:220px;min-height:112px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;margin:4px}.avatar{width:48px;height:48px;border-radius:50%;background:#eee2cf;display:grid;place-items:center;font-size:21px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{color:var(--muted);font-size:12px}.children{margin:6px 0 8px 18px;padding:8px 0 0 14px;border-left:2px dashed var(--line);display:grid;gap:10px}.spouses{font-size:12px;color:var(--muted);margin:4px 0 7px 6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid .person{width:auto;margin:0}.empty{text-align:center;padding:30px;color:var(--muted)}.modal{position:fixed;inset:0;background:#24170b99;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px;position:relative}.x{position:absolute;right:15px;top:10px;border:0;background:none;font-size:25px;cursor:pointer}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}@media(max-width:700px){.wrap{padding:10px}.person{width:100%;margin:3px 0}.children{margin-left:8px;padding-left:10px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots <span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="view='tree';render()">🌳 Tree</button><button class="btn" onclick="view='list';render()">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><div class="tabs"><button id="tb" class="btn active" onclick="view='tree';render()">🌳 Tree View</button><button id="lb" class="btn" onclick="view='list';render()">📋 List View</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="modal" class="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>(()=>{const URL='https://umbhqintywwsyduzrtai.supabase.co',KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8',SK='mfr_session_v1';let people=[],byKey=new Map,view='tree',open=new Set;const GP=window.GEDCOM_PARENTS||{},GS=window.GEDCOM_SPOUSES||{};const canon=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const vals=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(vals);if(typeof v==='object')return Object.values(v).flatMap(vals);let s=String(v).trim();try{let j=JSON.parse(s);if(j!==s)return vals(j)}catch{}return s.split(/[,;|\s]+/).map(x=>x.replace(/^[\[\]{}"']+|[\[\]{}"']+$/g,'')).filter(Boolean)};const getS=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}};const putS=s=>localStorage.setItem(SK,JSON.stringify(s));async function refresh(){const s=getS();if(!s?.refresh_token)throw Error('Your login session has expired. Please sign in again.');const r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const d=await r.json().catch(()=>null);if(!r.ok||!d?.access_token)throw Error('Session refresh failed. Please sign in again.');putS({...s,...d,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600)});return d.access_token}async function api(path,opt={}){let s=getS();if(!s?.access_token){location.replace('login.html?v=20260909-final-login');return}let token=s.access_token;if(s.expires_at&&s.expires_at<Math.floor(Date.now()/1000)+30)token=await refresh();const run=()=>fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})},signal:AbortSignal.timeout(12000)});let r=await run();if(r.status===401){token=await refresh();r=await run()}const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.error_description||d?.hint||('Database request failed ('+r.status+')'));return d}function map(){byKey=new Map(people.map(p=>[canon(p.external_id),p]))}function ged(m,id){let k=canon(id);return m[id]||m[k]||m['@'+k+'@']||m['@'+k]||[]}function rel(p,f,m){let a=vals(p[f]).map(canon).map(k=>byKey.get(k)).filter(Boolean);return a.length?a:ged(m,p.external_id).map(canon).map(k=>byKey.get(k)).filter(Boolean)}const parents=p=>rel(p,'parent_ids',GP),spouses=p=>rel(p,'spouse_ids',GS);function children(p){let k=canon(p.external_id);return people.filter(c=>parents(c).some(x=>canon(x.external_id)===k))}function roots(){let child=new Set;people.forEach(p=>parents(p).forEach(()=>child.add(canon(p.external_id))));let rs=people.filter(p=>!child.has(canon(p.external_id))),out=[];rs.forEach(p=>{let sk=spouses(p).map(x=>canon(x.external_id));if(!out.some(x=>canon(x.external_id)===canon(p.external_id)||sk.includes(canon(x.external_id))))out.push(p)});return out}function card(p){return '<article class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div class="avatar">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'">':'👤')+'</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></article>'}function branch(p,seen=new Set){let k=canon(p.external_id);if(seen.has(k))return'';let n=new Set(seen);n.add(k),sp=spouses(p),kids=children(p),o=open.has(k),h='<div class="branch"><div class="head"><button class="btn" style="color:#2f2418;border-color:#e2d7c6;background:#fff" onclick="event.stopPropagation();toggle(\''+esc(p.external_id)+'\')">'+(o?'−':'＋')+'</button><strong>Family branch</strong></div>'+card(p);if(sp.length)h+='<div class="spouses">💍 '+sp.map(x=>esc(x.full_name||'Unnamed')).join(' · ')+'</div>';if(o&&kids.length)h+='<div class="children">'+kids.map(x=>branch(x,n)).join('')+'</div>';return h+'</div>'}function render(){let q=document.getElementById('search').value.trim().toLowerCase(),c=document.getElementById('content');document.getElementById('tb').classList.toggle('active',view==='tree');document.getElementById('lb').classList.toggle('active',view==='list');if(view==='list'||q){let a=people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q));c.innerHTML=a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<div class="panel empty">No family member found.</div>'}else c.innerHTML='<div class="tree">'+roots().map(p=>branch(p)).join('')+'</div>'}function toggle(id){let k=canon(id);open.has(k)?open.delete(k):open.add(k);render()}function expandAll(){people.forEach(p=>open.add(canon(p.external_id)));render()}function collapseAll(){open.clear();render()}async function load(){let st=document.getElementById('status');st.textContent='🔄 Loading family data from Supabase…';try{people=await api('/rest/v1/family_members?select=*&order=full_name.asc');people=Array.isArray(people)?people:[];map();let links=people.reduce((n,p)=>n+parents(p).length,0);st.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active · '+roots().length+' family roots';render()}catch(e){st.textContent='❌ '+e.message}}function profile(id){let p=byKey.get(canon(id));if(!p)return;document.getElementById('modalBody').innerHTML='<h2>'+esc(p.full_name||'Unnamed')+'</h2><p class="meta">Parents: '+(parents(p).map(x=>esc(x.full_name)).join(', ')||'—')+'<br>Spouse: '+(spouses(p).map(x=>esc(x.full_name)).join(', ')||'—')+'<br>Children: '+(children(p).map(x=>esc(x.full_name)).join(', ')||'—')+'</p><label>Full name</label><input id="en" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="eb" value="'+esc(p.birth_date)+'"><label>Place</label><input id="ep" value="'+esc(p.place||p.address)+'"><label>Occupation</label><input id="eo" value="'+esc(p.occupation)+'"><label>Bio / Notes</label><textarea id="ex">'+esc(p.bio)+'</textarea><div class="actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn active" onclick="save(\''+esc(id)+'\')">💾 Save Edit</button></div>';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function save(id){try{await api('/rest/v1/family_members?external_id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({full_name:en.value.trim()||'Unnamed',birth_date:eb.value||null,place:ep.value||null,occupation:eo.value||null,bio:ex.value||null})});closeModal();load()}catch(e){alert(e.message)}}async function logout(){try{await api('/auth/v1/logout',{method:'POST'})}catch{}localStorage.removeItem(SK);location.replace('login.html?v=20260909-logout')}window.render=render;window.toggle=toggle;window.expandAll=expandAll;window.collapseAll=collapseAll;window.profile=profile;window.closeModal=closeModal;window.save=save;window.logout=logout;document.getElementById('search').addEventListener('input',render);load()})()</script></body></html>
