<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Family Roots — Family Tree</title>
<style>
:root{--ink:#2e1c0a;--brown:#5c3d1e;--deep:#3b2410;--gold:#c49a2a;--gold2:#e2c060;--green:#4a7c59;--paper:#f8f1e7;--panel:#fffdf9;--line:#ddcdb7;--muted:#806e5d}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink)}
.shell{height:100%;display:flex;flex-direction:column}.topbar{z-index:20;display:flex;align-items:center;gap:14px;padding:11px 16px;background:linear-gradient(135deg,var(--deep),var(--brown));color:#fff;box-shadow:0 4px 20px #0003}.brand{font-family:Georgia,serif;font-weight:700;font-size:1.08rem;color:var(--gold2);white-space:nowrap}.brand span{color:#fff;font-weight:400;font-style:italic}.hint{font-size:.75rem;color:#eadfcf;flex:1}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #ffffff30;background:#ffffff10;color:#fff;border-radius:999px;padding:7px 11px;font-size:.76rem;font-weight:700;cursor:pointer;transition:.18s}.btn:hover,.btn.active{background:#ffffff20;border-color:var(--gold2);color:#ffe9a1}.btn.primary{background:var(--green);border-color:#6aab7a}
.frame{position:relative;flex:1;min-height:0}.frame iframe{border:0;width:100%;height:100%;display:block;background:var(--paper)}.status{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#2b1a0deF;color:#fff;padding:8px 14px;border-radius:999px;font-size:.74rem;box-shadow:0 5px 18px #0003;opacity:0;pointer-events:none;transition:opacity .2s}.status.show{opacity:1}
@media(max-width:760px){.hint{display:none}.topbar{padding:8px 9px;gap:8px}.brand{font-size:.96rem}.controls{justify-content:flex-end}.btn{padding:6px 8px;font-size:.69rem}.btn[data-action="fullscreen"]{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
<div class="brand">🌳 My Family <span>Roots</span></div>
<div class="hint">A calm, simple way to explore your family branches</div>
<div class="controls">
<button class="btn primary" data-action="tree">🌳 Tree</button>
<button class="btn" data-action="expand">＋ Expand</button>
<button class="btn" data-action="collapse">− Collapse</button>
<button class="btn" data-action="search">🔍 Search</button>
<button class="btn" data-action="list">📋 List</button>
<button class="btn" data-action="fullscreen">⛶</button>
</div>
</header>
<main class="frame"><iframe id="familyFrame" src="family-tree.html" title="My Family Roots family tree"></iframe><div id="status" class="status"></div></main>
</div>
<script>
const frame=document.getElementById('familyFrame'),status=document.getElementById('status');
function say(t){status.textContent=t;status.classList.add('show');clearTimeout(window.__st);window.__st=setTimeout(()=>status.classList.remove('show'),1400)}
function doc(){return frame.contentDocument||frame.contentWindow.document}
function showTree(){const d=doc();const a=d.querySelector('a[onclick*="showSection(\'tree\')"]');if(a){a.click();return}const tree=d.getElementById('tree');if(tree){d.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));tree.classList.add('active')}}
function installTreeUX(){try{const d=doc();showTree();let style=d.getElementById('mfr-tree-ux');if(!style){style=d.createElement('style');style.id='mfr-tree-ux';style.textContent=`
body{background:#f8f1e7!important}.section#tree{max-width:1320px!important;margin:auto!important}.section#tree .section-header{margin-bottom:14px!important}.section#tree .section-header h2{font-size:1.75rem!important}.generation-block{position:relative!important;margin:0 0 14px!important;padding:0!important;background:#fffdf9!important;border:1px solid #ddcdb7!important;border-radius:18px!important;box-shadow:0 4px 18px rgba(60,35,10,.07)!important;overflow:hidden!important}.generation-label{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;margin:0!important;padding:15px 17px!important;cursor:pointer!important;background:linear-gradient(180deg,#fffdf9,#faf2e8)!important;color:#5c3d1e!important;font-weight:800!important}.generation-label:after{content:'⌄';font-size:1.15rem;color:#c49a2a;transition:transform .2s}.generation-block.mfr-open .generation-label:after{transform:rotate(180deg)}.generation-block .members-row{display:none!important;padding:15px 16px 18px!important;gap:14px!important;flex-wrap:wrap!important}.generation-block.mfr-open .members-row{display:flex!important}.generation-block.mfr-open .generation-label{border-bottom:1px solid #eee2d2}.member-card{width:190px!important;min-height:150px!important;padding:14px!important;border-radius:15px!important;background:#fff!important;border:1px solid #e2d6c7!important;box-shadow:0 3px 12px rgba(60,35,10,.06)!important;transition:transform .16s,box-shadow .16s!important}.member-card:hover{transform:translateY(-2px)!important;box-shadow:0 7px 18px rgba(60,35,10,.11)!important}.member-photo-wrap{width:62px!important;height:62px!important}.member-name{font-size:.93rem!important}.card-actions{opacity:1!important}.mfr-empty{padding:18px;color:#8a7866;font-size:.9rem}.mfr-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:0 2px}.mfr-mini{border:1px solid #ddcdb7;background:#fffdf9;color:#5c3d1e;border-radius:999px;padding:7px 11px;font-weight:700;cursor:pointer}.mfr-mini:hover{border-color:#c49a2a}
@media(max-width:700px){.generation-label{padding:13px 14px}.generation-block .members-row{padding:12px}.member-card{width:calc(50% - 7px)!important;min-width:145px!important}.section#tree .section-header h2{font-size:1.45rem!important}}
`;d.head.appendChild(style)}
const blocks=[...d.querySelectorAll('.generation-block')];blocks.forEach((b,i)=>{if(b.dataset.mfrReady)return;b.dataset.mfrReady='1';const label=b.querySelector('.generation-label');if(!label)return;label.addEventListener('click',()=>{b.classList.toggle('mfr-open')});if(i===0)b.classList.add('mfr-open')});say('Tree view ready');}catch(e){say('Please wait for the tree to load')}}
function setAll(open){const d=doc();showTree();d.querySelectorAll('.generation-block').forEach((b,i)=>b.classList.toggle('mfr-open',open||i===0));say(open?'All generations expanded':'Tree simplified — first generation open')}
frame.addEventListener('load',()=>setTimeout(installTreeUX,120));
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;try{if(a==='tree')installTreeUX();if(a==='expand')setAll(true);if(a==='collapse')setAll(false);if(a==='search'){const d=doc(),i=d.getElementById('search-input')||d.querySelector('input[type="search"]');if(i){i.focus();i.scrollIntoView({behavior:'smooth',block:'start'});say('Search ready')}}if(a==='list'){const d=doc(),x=[...d.querySelectorAll('a,button')].find(el=>/list/i.test((el.textContent||'')+' '+(el.getAttribute('onclick')||'')));if(x)x.click();else say('Use the app navigation for List view')}if(a==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}}catch(e){say('Please wait for the family tree to load')}}));
</script>
</body>
</html>
