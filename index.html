<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots — Family Tree</title><style>:root{--ink:#2e1c0a;--brown:#5c3d1e;--deep:#3b2410;--gold:#c49a2a;--gold2:#e2c060;--green:#4a7c59;--paper:#f8f1e7}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink)}.shell{height:100%;display:flex;flex-direction:column}.topbar{z-index:20;display:flex;align-items:center;gap:14px;padding:11px 16px;background:linear-gradient(135deg,var(--deep),var(--brown));color:#fff;box-shadow:0 4px 20px #0003}.brand{font-family:Georgia,serif;font-weight:700;font-size:1.08rem;color:var(--gold2);white-space:nowrap}.brand span{color:#fff;font-weight:400;font-style:italic}.hint{font-size:.75rem;color:#eadfcf;flex:1}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #ffffff30;background:#ffffff10;color:#fff;border-radius:999px;padding:7px 11px;font-size:.76rem;font-weight:700;cursor:pointer}.btn:hover,.btn.active{background:#ffffff20;border-color:var(--gold2);color:#ffe9a1}.btn.primary{background:var(--green);border-color:#6aab7a}.frame{position:relative;flex:1;min-height:0}.frame iframe{border:0;width:100%;height:100%;display:block;background:var(--paper)}.status{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#2b1a0deF;color:#fff;padding:8px 14px;border-radius:999px;font-size:.74rem;box-shadow:0 5px 18px #0003;opacity:0;pointer-events:none;transition:opacity .2s}.status.show{opacity:1}@media(max-width:760px){.hint{display:none}.topbar{padding:8px 9px;gap:8px}.brand{font-size:.96rem}.btn{padding:6px 8px;font-size:.69rem}}</style></head><body><div class="shell"><header class="topbar"><div class="brand">🌳 My Family <span>Roots</span></div><div class="hint">A calm, simple way to explore your family branches</div><div class="controls"><button class="btn primary" data-action="tree">🌳 Tree</button><button class="btn" data-action="expand">＋ Expand</button><button class="btn" data-action="collapse">− Collapse</button><button class="btn" data-action="search">🔍 Search</button><button class="btn" data-action="list">📋 List</button><button class="btn" data-action="fullscreen">⛶</button></div></header><main class="frame"><iframe id="familyFrame" src="family-tree-v2.html" title="My Family Roots family tree"></iframe><div id="status" class="status"></div></main></div><script>const frame=document.getElementById('familyFrame'),status=document.getElementById('status');function say(t){status.textContent=t;status.classList.add('show');clearTimeout(window.__st);window.__st=setTimeout(()=>status.classList.remove('show'),1400)}function doc(){return frame.contentDocument||frame.contentWindow.document}frame.addEventListener('load',()=>say('Family data page ready'));document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action,d=doc();try{if(a==='tree'){d.querySelector('#treeTab')?.click();say('Tree view')}if(a==='list'){d.querySelector('#listTab')?.click();say('List view')}if(a==='expand'){d.querySelector('.top .btn[onclick="expandAll()"]')?.click();say('Expanded')}if(a==='collapse'){d.querySelector('.top .btn[onclick="collapseAll()"]')?.click();say('Collapsed')}if(a==='search'){const i=d.getElementById('search');if(i){i.focus();i.scrollIntoView({behavior:'smooth',block:'start'});say('Search ready')}}if(a==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}}catch(e){say('Please wait for the family page')}}));</script></body></html>
