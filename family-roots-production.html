<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><style>:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:var(--accent)!important;color:#fff!important}.wrap{padding:16px}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:12px}.status{margin-top:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person,.kidcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.tree{overflow:auto;padding:10px 4px 30px}.family{min-width:760px;text-align:center;margin:0 auto 42px}.couple{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.couple .person{min-width:220px}.marry{font-size:18px}.down{width:70%;max-width:900px;margin:auto;height:28px;border:2px solid var(--gold);border-bottom:0}.kids{display:flex;justify-content:center;gap:14px;align-items:flex-start;flex-wrap:wrap}.kid{min-width:190px;max-width:250px;position:relative}.kid:before{content:"";position:absolute;top:-28px;left:50%;height:28px;border-left:2px solid var(--gold)}.kidcard{background:#fffdf9}.spousehint{font-size:11px;color:var(--muted);margin-top:5px}.note{text-align:center;color:var(--muted);margin-bottom:12px}.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:12px}.overlay.open{display:block}.focus{max-width:900px;margin:auto;background:var(--paper);border-radius:20px;padding:18px}.head{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.head h2{margin:0}.close{margin-left:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.rel{display:block;width:100%;text-align:left;background:#faf6ef;border:1px solid #eadfce;border-radius:9px;padding:8px;margin:5px 0;cursor:pointer}@media(max-width:700px){.wrap{padding:10px}.family{min-width:0}.couple .person{min-width:170px}.cols{grid-template-columns:1fr}.tree{overflow:visible}.kids{display:grid;grid-template-columns:repeat(2,minmax(145px,1fr))}.kid{min-width:0}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button id="tb" class="btn active" onclick="setView('tree')">🌳 Tree</button><button id="lb" class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><div><button id="tb2" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="lb2" class="btn" onclick="setView('list')">📋 All People</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="focus"><div class="head"><div><div class="meta">PERSON FOCUS</div><h2 id="title">Family Member</h2></div><button class="btn close" onclick="closeFocus()">✕ Close</button></div><div id="body"></div></div></div><script src="gedcom-relationships.js?v=20260911-1"></script><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8',SK='mfr_session_v1';let people=[],map=new Map(),view='tree',P={},S={};const $=id=>document.getElementById(id),status=$('status');const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase();const m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:(v==null||v===''?[]:String(v).split(/[,;|\s]+/).filter(Boolean));function normalize(d){return d.map(p=>{const gid=p.external_id||p.gedcom_id||'';return {...p,gedcom_id:gid}})}function normalizeRel(g){const out={};Object.entries(g||{}).forEach(([k,v])=>{out[key(k)]=arr(v).map(key)});return out}function rel(p,g){return (g[key(p.gedcom_id)]||[]).map(k=>map.get(k)).filter(Boolean)}function parents(p){return rel(p,P)}function spouses(p){return rel(p,S)}function children(p){const id=key(p.gedcom_id);return people.filter(c=>parents(c).some(x=>key(x.gedcom_id)===id))}function setView(v){view=v;render()}function personCard(p){return '<div class="person" onclick="openFocus(\''+esc(p.gedcom_id)+'\')">👤 <span class="name">'+esc(p.full_name||'Unnamed')+'</span><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+'</div></div>'}function familyUnit(p){const partners=spouses(p).filter(x=>key(x.gedcom_id)!==key(p.gedcom_id));let kids=children(p).slice();partners.forEach(s=>children(s).forEach(c=>{if(!kids.some(x=>key(x.gedcom_id)===key(c.gedcom_id)))kids.push(c)}));let couple=personCard(p);partners.forEach(s=>{couple+='<span class="marry">💍</span>'+personCard(s)});let childHtml=kids.length?'<div class="down"></div><div class="kids">'+kids.map(c=>{const cs=spouses(c);return '<div class="kid"><div class="kidcard" onclick="openFocus(\''+esc(c.gedcom_id)+'\')">👤 <span class="name">'+esc(c.full_name||'Unnamed')+'</span><div class="meta">'+(c.birth_date?'🎂 '+esc(c.birth_date):'')+'</div>'+(cs.length?'<div class="spousehint">💍 Spouse: '+esc(cs.map(x=>x.full_name||'Unnamed').join(', '))+'</div>':'')+'</div></div>'}).join('')+'</div>':'<div class="meta" style="margin-top:10px">No children recorded</div>';return '<section class="family"><div class="couple">'+couple+'</div>'+childHtml+'</section>'}function roots(){const childIds=new Set();people.forEach(p=>{if(parents(p).length)childIds.add(key(p.gedcom_id))});const out=[];for(const p of people){const id=key(p.gedcom_id);if(childIds.has(id))continue;const ps=spouses(p).map(x=>key(x.gedcom_id));if(!out.some(r=>key(r.gedcom_id)===id||ps.includes(key(r.gedcom_id))))out.push(p)}return out}function render(){const q=$('search').value.trim().toLowerCase();$('tb').classList.toggle('active',view==='tree');$('tb2').classList.toggle('active',view==='tree');$('lb').classList.toggle('active',view==='list');$('lb2').classList.toggle('active',view==='list');const a=q?people.filter(p=>[p.full_name,p.place,p.occupation,p.bio,p.gedcom_id].join(' ').toLowerCase().includes(q)):people;if(view==='list'||q)$('content').innerHTML='<div class="card"><div class="grid">'+a.map(personCard).join('')+'</div></div>';else $('content').innerHTML='<div class="card"><div class="note">🔐 Relationship source: GEDCOM ID · database row IDs are never used</div><div class="tree">'+roots().map(familyUnit).join('')+'</div></div>'}function relButtons(items){return items.length?items.map(x=>'<button class="rel" onclick="openFocus(\''+esc(x.gedcom_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</button>').join(''):'<div class="meta">—</div>'}function openFocus(id){const p=map.get(key(id));if(!p)return;$('title').textContent=p.full_name||'Family Member';$('body').innerHTML='<div class="cols"><div class="box"><h3>👤 '+esc(p.full_name||'Unnamed')+'</h3><div class="meta">GEDCOM ID: '+esc(p.gedcom_id||'—')+'</div><p><b>Birth:</b> '+esc(p.birth_date||'—')+'</p><p><b>Place:</b> '+esc(p.place||'—')+'</p><p><b>Occupation:</b> '+esc(p.occupation||'—')+'</p></div><div class="box"><h4>👨‍👩‍👧 Parents</h4>'+relButtons(parents(p))+'<h4>💍 Spouse</h4>'+relButtons(spouses(p))+'<h4>👶 Children</h4>'+relButtons(children(p))+'</div></div>';$('overlay').classList.add('open')}function closeFocus(){$('overlay').classList.remove('open')}async function refreshSession(s){if(!s?.refresh_token)throw Error('Login session missing. Please sign in again.');const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token}),signal:AbortSignal.timeout(12000)});const d=await r.json().catch(()=>null);if(!r.ok||!d?.access_token)throw Error('Session expired. Please sign in again.');localStorage.setItem(SK,JSON.stringify(d));return d}async function load(){status.textContent='🔄 Connecting to family database…';try{let s=JSON.parse(localStorage.getItem(SK)||'null');if(!s?.access_token)throw Error('Login session missing. Please sign in again.');let r=await fetch(U+'/rest/v1/family_members?select=*&order=full_name.asc',{headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json'},signal:AbortSignal.timeout(12000)});if(r.status===401){s=await refreshSession(s);r=await fetch(U+'/rest/v1/family_members?select=*&order=full_name.asc',{headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json'},signal:AbortSignal.timeout(12000)})}const d=await r.json().catch(()=>null);if(!r.ok)throw Error('Database HTTP '+r.status);if(!Array.isArray(d))throw Error('Unexpected database response.');people=normalize(d).filter(p=>p.gedcom_id);map=new Map(people.map(p=>[key(p.gedcom_id),p]));P=normalizeRel(window.GEDCOM_PARENTS);S=normalizeRel(window.GEDCOM_SPOUSES);const missing=d.filter(p=>!(p.external_id||p.gedcom_id)).length;const pl=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+pl+' GEDCOM parent links · '+roots().length+' family roots'+(missing?' · ⚠️ '+missing+' records without GEDCOM ID':'');render()}catch(e){status.innerHTML='<span style="color:#a33;font-weight:700">❌ '+esc(e.message||String(e))+'</span><br><span class="meta">The app stopped safely. Your family data was not changed.</span>'}}function logout(){localStorage.removeItem(SK);location.replace('login.html?v=20260911-3')}$('search').addEventListener('input',render);window.setView=setView;window.openFocus=openFocus;window.closeFocus=closeFocus;window.logout=logout;load()})()</script></body></html>
