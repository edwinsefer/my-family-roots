<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gedcom-relationships.js?v=20260910-1"></script><style>:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active,.primary{background:var(--accent)!important;color:#fff!important}.wrap{padding:16px}.panel,.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:12px}.status,.meta,.hint{margin-top:8px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}.person:hover{box-shadow:0 6px 18px #0001}.name{font-weight:800}.tree{overflow:auto;padding:8px}.family{min-width:700px;text-align:center;margin:0 auto 38px}.couple{display:flex;justify-content:center;align-items:center;gap:8px}.couple .person{width:220px}.children{display:flex;justify-content:center;gap:12px;margin-top:28px}.kid{position:relative}.kid:before{content:"";position:absolute;top:-28px;left:50%;height:28px;border-left:2px solid var(--gold)}.spousehint{font-size:11px;color:var(--muted);margin-top:4px}.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:12px}.overlay.open{display:block}.box{max-width:760px;margin:auto}.head{display:flex;align-items:center}.head h2{margin:0}.close{margin-left:auto}.edit{background:#faf6ef;border:1px solid #eadfce;border-radius:14px;padding:14px;margin-top:12px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}select[multiple]{min-height:180px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:700px){.wrap{padding:10px}.family{min-width:650px}.couple .person{width:195px}.children{gap:7px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button id="t" class="btn active" onclick="setView('tree')">🌳 Tree</button><button id="l" class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><button id="t2" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="l2" class="btn" onclick="setView('list')">📋 All People</button><input id="search" class="search" placeholder="🔍 Search family member…" oninput="render()"><div id="status" class="status">Loading…</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="box"><div class="head"><h2 id="title"></h2><button class="btn close" onclick="closeModal()">✕ Close</button></div><div id="body"></div></div></div><script>(()=>{const URL='https://umbhqintywwsyduzrtai.supabase.co',KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',STORE='mfr_relationship_edits_v1';let db,people=[],by=new Map(),view='tree',open=new Set(),edits={};const GP=window.GEDCOM_PARENTS||{},GS=window.GEDCOM_SPOUSES||{};const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const loadEdits=()=>{try{edits=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch{edits={}}};const saveEdits=()=>localStorage.setItem(STORE,JSON.stringify(edits));const ged=(m,id)=>{let k=key(id);return m[id]||m[k]||m['@'+k+'@']||m['@'+k]||[]};const peopleFor=ids=>ids.map(key).map(k=>by.get(k)).filter(Boolean);function parents(p){let e=edits[key(p.external_id)];return peopleFor(Array.isArray(e?.parents)?e.parents:ged(GP,p.external_id))}function spouses(p){let e=edits[key(p.external_id)];return peopleFor(Array.isArray(e?.spouses)?e.spouses:ged(GS,p.external_id))}function children(p){let k=key(p.external_id);return people.filter(x=>parents(x).some(y=>key(y.external_id)===k))}function roots(){let has=new Set();people.forEach(p=>parents(p).forEach(()=>has.add(key(p.external_id))));let a=people.filter(p=>!has.has(key(p.external_id))),o=[];a.forEach(p=>{let s=spouses(p).map(x=>key(x.external_id));if(!o.some(x=>key(x.external_id)===key(p.external_id)||s.includes(key(x.external_id))))o.push(p)});return o}function card(p){return '<div class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.external_id)+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div>'+(p.place?'<div class="meta">📍 '+esc(p.place)+'</div>':'')+'</div>'}function branch(p,seen=new Set()){let k=key(p.external_id);if(seen.has(k))return'';let n=new Set(seen);n.add(k),s=spouses(p),c=children(p),h='<div class="family"><div class="couple">'+card(p)+(s[0]?'<span>💍</span>'+card(s[0]):'')+'</div>';if(open.has(k)&&c.length)h+='<div class="children">'+c.map(x=>'<div class="kid">'+card(x)+(spouses(x).length?'<div class="spousehint">💍 '+spouses(x).map(y=>esc(y.full_name)).join(', ')+'</div>':'')+'</div>').join('')+'</div>';return h+'</div>'}function render(){let q=search.value.trim().toLowerCase();if(view==='list'||q){let a=people.filter(p=>(p.full_name+' '+p.external_id+' '+(p.place||'')+' '+(p.occupation||'')).toLowerCase().includes(q));content.innerHTML='<div class="grid">'+a.map(card).join('')+'</div>';return}content.innerHTML='<div class="tree"><div class="hint" style="text-align:center">🔐 GEDCOM is the starting relationship source. ✏️ Your saved edits override it.</div>'+roots().map(p=>branch(p)).join('')+'</div>'}function setView(v){view=v;[t,t2].forEach(x=>x.classList.toggle('active',v==='tree'));[l,l2].forEach(x=>x.classList.toggle('active',v==='list'));render()}function expandAll(){people.forEach(p=>open.add(key(p.external_id)));render()}function collapseAll(){open.clear();render()}function opts(sel){return people.map(p=>'<option value="'+esc(p.external_id)+'"'+(sel.includes(key(p.external_id))?' selected':'')+'>'+esc(p.full_name||'Unnamed')+' ['+esc(p.external_id)+']</option>').join('')}function profile(id){let p=by.get(key(id)),ps=parents(p).map(x=>key(x.external_id)),ss=spouses(p).map(x=>key(x.external_id));title.textContent=p.full_name||'Unnamed';body.innerHTML='<div class="meta">ID: '+esc(p.external_id)+'</div><div class="edit"><b>✏️ Edit Relationships</b><div class="hint">Choose the correct parents and spouse(s). Maximum 2 parents. Then press Save Relationships.</div><label>Parents</label><select id="rp" multiple>'+opts(ps)+'</select><label>Spouse(s)</label><select id="rs" multiple>'+opts(ss)+'</select><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRelationships(\''+esc(id)+'\')">💾 Save Relationships</button></div><div id="msg" class="status"></div></div><div class="edit"><b>✏️ Edit Person</b><label>Full name</label><input id="nm" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="bd" value="'+esc(p.birth_date)+'"><label>Place</label><input id="pl" value="'+esc(p.place)+'"><label>Occupation</label><input id="oc" value="'+esc(p.occupation)+'"><div class="actions"><button class="btn primary" onclick="savePerson(\''+esc(id)+'\')">💾 Save Person</button></div></div>';overlay.classList.add('open')}function closeModal(){overlay.classList.remove('open')}async function saveRelationships(id){let k=key(id),ps=[...rp.selectedOptions].map(o=>key(o.value)).filter(Boolean),ss=[...rs.selectedOptions].map(o=>key(o.value)).filter(Boolean).filter(x=>x!==k);if(ps.length>2){alert('Please select no more than 2 parents.');return}edits[k]={parents:ps,spouses:ss};saveEdits();let e=await db.from('family_members').update({parent_ids:ps.map(x=>by.get(x).external_id),spouse_ids:ss.map(x=>by.get(x).external_id)}).eq('external_id',id);if(e.error){msg.textContent='⚠️ Saved on this device, database save failed: '+e.error.message;return}for(const s of ss){let sk=key(s),other=edits[sk]||{parents:ged(GP,by.get(sk).external_id),spouses:ged(GS,by.get(sk).external_id)};if(!other.spouses.map(key).includes(k))other.spouses.push(id);edits[sk]=other;await db.from('family_members').update({spouse_ids:other.spouses.map(x=>by.get(key(x))?.external_id||x)}).eq('external_id',by.get(sk).external_id)}saveEdits();msg.textContent='✅ Saved successfully.';setTimeout(()=>{closeModal();load()},300)}async function savePerson(id){let e=await db.from('family_members').update({full_name:nm.value.trim()||'Unnamed',birth_date:bd.value||null,place:pl.value||null,occupation:oc.value||null}).eq('external_id',id);if(e.error){alert(e.error.message);return}closeModal();load()}async function load(){status.textContent='🔄 Loading family data…';let r=await db.from('family_members').select('*').order('full_name');if(r.error){status.textContent='❌ '+r.error.message;return}people=r.data||[];by=new Map(people.map(p=>[key(p.external_id),p]));loadEdits();people.forEach(p=>open.add(key(p.external_id)));status.textContent='✅ '+people.length+' family members loaded · '+people.reduce((n,p)=>n+parents(p).length,0)+' active parent links · '+roots().length+' family roots · ✏️ Edit & Save enabled';render()}async function logout(){await db.auth.signOut();location.replace('login.html?v=20260910-12')}async function boot(){db=window.supabase.createClient(URL,KEY);let r=await db.auth.getSession();if(!r.data?.session){location.replace('login.html?v=20260910-12');return}await load()}Object.assign(window,{setView,expandAll,collapseAll,profile,closeModal,saveRelationships,savePerson,logout});boot()})();</script></body></html>
