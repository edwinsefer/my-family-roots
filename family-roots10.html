<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><script src="family-members-static.js?v=20260911-1"></script><script src="gedcom-relationships.js?v=20260911-1"></script><script src="photo-gallery.js?v=20260911-1"></script><style>:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active,.primary{background:var(--accent)!important;color:#fff!important}.wrap{padding:16px}.panel,.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:12px}.status,.meta,.hint{margin-top:8px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}.person:hover{box-shadow:0 6px 18px #0001}.name{font-weight:800}.tree{overflow:auto;padding:8px}.family{min-width:700px;text-align:center;margin:0 auto 38px}.couple{display:flex;justify-content:center;align-items:center;gap:8px}.couple .person{width:220px}.children{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap}.kid{position:relative}.kid:before{content:"";position:absolute;top:-28px;left:50%;height:28px;border-left:2px solid var(--gold)}.spousehint{font-size:11px;color:var(--muted);margin-top:4px}.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:12px}.overlay.open{display:block}.box{max-width:760px;margin:auto}.head{display:flex;align-items:center}.head h2{margin:0}.close{margin-left:auto}.edit{background:#faf6ef;border:1px solid #eadfce;border-radius:14px;padding:14px;margin-top:12px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}select[multiple]{min-height:180px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{padding:10px;border-radius:10px;background:#f1eadf;margin-top:10px;font-size:13px}@media(max-width:700px){.wrap{padding:10px}.family{min-width:650px}.couple .person{width:195px}.children{gap:7px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button id="t" class="btn active" onclick="setView('tree')">🌳 Tree</button><button id="l" class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button></div></header><main class="wrap"><section class="panel"><button id="t2" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="l2" class="btn" onclick="setView('list')">📋 All People</button><input id="search" class="search" placeholder="🔍 Search family member…" oninput="render()"><div id="status" class="status"></div><div class="notice">✏️ Edit & Save works on this device now. Database sync will be connected after Login is finalized.</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="box"><div class="head"><h2 id="title"></h2><button class="btn close" onclick="closeModal()">✕ Close</button></div><div id="body"></div></div></div><script>(()=>{const STORE='mfr_relationship_edits_v2',PSTORE='mfr_person_edits_v1';let people=[],by=new Map(),view='tree',open=new Set(),edits={},pedits={};const GP=window.GEDCOM_PARENTS||{},GS=window.GEDCOM_SPOUSES||{};const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ged=(m,id)=>m[id]||m[key(id)]||m['@'+key(id)+'@']||m['@'+key(id)]||[];const peopleFor=ids=>(ids||[]).map(key).map(k=>by.get(k)).filter(Boolean);function loadLocal(){try{edits=JSON.parse(localStorage.getItem(STORE)||'{}')||{};pedits=JSON.parse(localStorage.getItem(PSTORE)||'{}')||{}}catch{edits={};pedits={}}}function saveLocal(){localStorage.setItem(STORE,JSON.stringify(edits));localStorage.setItem(PSTORE,JSON.stringify(pedits))}function person(p){let e=pedits[key(p.external_id)]||{};return Object.assign({},p,e)}function parents(p){let k=key(p.external_id),e=edits[k];if(Array.isArray(e?.parents))return peopleFor(e.parents);return peopleFor(ged(GP,p.external_id))}function spouses(p){let k=key(p.external_id),e=edits[k];if(Array.isArray(e?.spouses))return peopleFor(e.spouses);return peopleFor(ged(GS,p.external_id))}function children(p){let k=key(p.external_id);return people.filter(x=>parents(x).some(y=>key(y.external_id)===k))}function roots(){let has=new Set();people.forEach(p=>parents(p).forEach(()=>has.add(key(p.external_id))));let out=[];people.filter(p=>!has.has(key(p.external_id))).forEach(p=>{let s=spouses(p).map(x=>key(x.external_id));if(!out.some(x=>key(x.external_id)===key(p.external_id)||s.includes(key(x.external_id))))out.push(p)});return out}function card(raw){let p=person(raw);return '<div class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.external_id)+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div>'+(p.place?'<div class="meta">📍 '+esc(p.place)+'</div>':'')+(p.occupation?'<div class="meta">💼 '+esc(p.occupation)+'</div>':'')+'</div>'}function branch(p,seen=new Set()){let k=key(p.external_id);if(seen.has(k))return'';let n=new Set(seen);n.add(k),s=spouses(p),c=children(p),h='<div class="family"><div class="couple">'+card(p)+(s[0]?'<span>💍</span>'+card(s[0]):'')+'</div>';if(open.has(k)&&c.length)h+='<div class="children">'+c.map(x=>'<div class="kid">'+card(x)+(spouses(x).length?'<div class="spousehint">💍 '+spouses(x).map(y=>esc(person(y).full_name)).join(', ')+'</div>':'')+'</div>').join('')+'</div>';return h+'</div>'}function render(){let q=document.getElementById('search').value.trim().toLowerCase();if(view==='list'||q){let a=people.filter(x=>{let p=person(x);return(p.full_name+' '+p.external_id+' '+(p.place||'')+' '+(p.occupation||'')).toLowerCase().includes(q)});document.getElementById('content').innerHTML='<div class="grid">'+a.map(card).join('')+'</div>';return}document.getElementById('content').innerHTML='<div class="tree"><div class="hint" style="text-align:center">GEDCOM relationships are the starting source. Your saved edits override them. No Supabase or Login is required to view the tree.</div>'+roots().map(p=>branch(p)).join('')+'</div>'}function setView(v){view=v;[document.getElementById('t'),document.getElementById('t2')].forEach(x=>x.classList.toggle('active',v==='tree'));[document.getElementById('l'),document.getElementById('l2')].forEach(x=>x.classList.toggle('active',v==='list'));render()}function expandAll(){people.forEach(p=>open.add(key(p.external_id)));render()}function collapseAll(){open.clear();render()}function opts(sel){return people.map(raw=>{let p=person(raw),k=key(p.external_id);return '<option value="'+esc(p.external_id)+'"'+(sel.includes(k)?' selected':'')+'>'+esc(p.full_name||'Unnamed')+' ['+esc(p.external_id)+']</option>'}).join('')}function profile(id){let raw=by.get(key(id));if(!raw)return;let p=person(raw),ps=parents(raw).map(x=>key(x.external_id)),ss=spouses(raw).map(x=>key(x.external_id));document.getElementById('title').textContent=p.full_name||'Unnamed';document.getElementById('body').innerHTML='<div class="meta">ID: '+esc(p.external_id)+'</div><div class="edit"><b>✏️ Edit Relationships</b><div class="hint">Choose up to 2 parents and any spouse(s), then Save.</div><label>Parents</label><select id="rp" multiple>'+opts(ps)+'</select><label>Spouse(s)</label><select id="rs" multiple>'+opts(ss)+'</select><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRelationships(\''+esc(id)+'\')">💾 Save Relationships</button></div></div><div class="edit"><b>✏️ Edit Person</b><label>Full name</label><input id="nm" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="bd" value="'+esc(p.birth_date)+'"><label>Place</label><input id="pl" value="'+esc(p.place)+'"><label>Occupation</label><input id="oc" value="'+esc(p.occupation)+'"><div class="actions"><button class="btn primary" onclick="savePerson(\''+esc(id)+'\')">💾 Save Person</button></div></div><div class="hint">Saved changes are stored locally in this browser. We will connect database Sync after Login is finished.</div>';document.getElementById('overlay').classList.add('open')}function closeModal(){document.getElementById('overlay').classList.remove('open')}function saveRelationships(id){let k=key(id),ps=[...document.getElementById('rp').selectedOptions].map(o=>key(o.value)).filter(Boolean),ss=[...document.getElementById('rs').selectedOptions].map(o=>key(o.value)).filter(Boolean).filter(x=>x!==k);if(ps.length>2){alert('Please select no more than 2 parents.');return}let previous=Array.isArray(edits[k]?.spouses)?edits[k].spouses.slice():ged(GS,by.get(k)?.external_id).map(key);edits[k]={parents:ps,spouses:ss};previous.filter(s=>!ss.includes(key(s))).forEach(s=>{let sk=key(s),old=edits[sk],os=Array.isArray(old?.spouses)?old.spouses.slice():ged(GS,by.get(sk)?.external_id).map(key);os=os.map(key).filter(x=>x!==k);edits[sk]=Object.assign({},old,{spouses:os})});ss.forEach(s=>{let sk=key(s),old=edits[sk];let os=Array.isArray(old?.spouses)?old.spouses.slice():ged(GS,by.get(sk)?.external_id).map(key);if(!os.map(key).includes(k))os.push(k);edits[sk]=Object.assign({},old,{spouses:os})});saveLocal();closeModal();render()}function savePerson(id){let k=key(id);pedits[k]={full_name:document.getElementById('nm').value.trim()||'Unnamed',birth_date:document.getElementById('bd').value.trim(),place:document.getElementById('pl').value.trim(),occupation:document.getElementById('oc').value.trim()};saveLocal();closeModal();render()}function boot(){people=(window.FAMILY_MEMBERS_STATIC||[]).map(a=>({external_id:a[0],full_name:a[1],sex:a[2],birth_date:a[3],place:a[4],occupation:a[5]}));by=new Map(people.map(p=>[key(p.external_id),p]));loadLocal();people.forEach(p=>open.add(key(p.external_id)));document.getElementById('status').textContent='✅ '+people.length+' family members loaded · '+people.reduce((n,p)=>n+parents(p).length,0)+' active parent links · '+roots().length+' family roots · ✏️ Edit & Save ready';render()}Object.assign(window,{setView,expandAll,collapseAll,profile,closeModal,saveRelationships,savePerson,render});boot()})();</script></body></html>
