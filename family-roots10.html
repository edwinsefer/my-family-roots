<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><script src="family-members-static.js?v=20260911-1"></script><script src="gedcom-relationships.js?v=20260911-1"></script><script src="tree-photo-preview.js?v=20260915-1"></script><style>body{margin:0;background:#f7f1e7;color:#2f2418;font:15px system-ui}.top{background:#3d2918;color:#fff;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap}.brand{font-weight:800;margin-right:auto}.btn{padding:9px 12px;border-radius:10px;border:1px solid #dfd2bf;background:#fff}.top .btn{background:#ffffff18;color:#fff}.active{background:#6b4f2f!important;color:#fff}.wrap{padding:16px;max-width:1250px;margin:auto}.panel,.person{background:#fffdf9;border:1px solid #dfd2bf;border-radius:14px;padding:12px}.search{width:100%;padding:12px;border:1px solid #dfd2bf;border-radius:10px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.tree{overflow:auto}.family{min-width:700px;text-align:center;margin-bottom:35px}.couple,.children{display:flex;justify-content:center;gap:8px}.children{margin-top:25px;flex-wrap:wrap}.person{width:195px;cursor:pointer}.name{font-weight:800}.meta{font-size:12px;color:#756a5e;margin-top:4px}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots</div><button id="t" class="btn active" onclick="setView('tree')">🌳 Tree</button><button id="l" class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button></div></header><main class="wrap"><section class="panel"><button id="t2" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="l2" class="btn" onclick="setView('list')">📋 All People</button><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="meta"></div></section><div id="content"></div></main><script>(()=>{const GP=window.GEDCOM_PARENTS||{},GS=window.GEDCOM_SPOUSES||{};let people=[],by=new Map(),view='tree',open=new Set();const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ged=(m,id)=>m[id]||m[key(id)]||m['@'+key(id)+'@']||m['@'+key(id)]||[];const parents=p=>ged(GP,p.external_id).map(key).map(k=>by.get(k)).filter(Boolean);const spouses=p=>ged(GS,p.external_id).map(key).map(k=>by.get(k)).filter(Boolean);const children=p=>people.filter(x=>parents(x).some(y=>key(y.external_id)===key(p.external_id)));const roots=()=>{const c=new Set();people.forEach(p=>parents(p).forEach(x=>c.add(key(x.external_id))));return people.filter(p=>!c.has(key(p.external_id)))};function card(p){return '<div class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.external_id)+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div>'}function branch(p){const k=key(p.external_id),s=spouses(p),c=children(p);return '<div class="family"><div class="couple">'+card(p)+(s[0]?'<span>💍</span>'+card(s[0]):'')+'</div>'+(open.has(k)&&c.length?'<div class="children">'+c.map(card).join('')+'</div>':'')+'</div>'}function render(){const q=document.getElementById('search').value.toLowerCase().trim();if(view==='list'||q){const a=people.filter(p=>(p.full_name+' '+p.external_id).toLowerCase().includes(q));content.innerHTML='<div class="grid">'+a.map(card).join('')+'</div>';return}content.innerHTML='<div class="tree">'+roots().map(branch).join('')+'</div>'}function setView(v){view=v;document.querySelectorAll('#t,#t2').forEach(x=>x.classList.toggle('active',v==='tree'));document.querySelectorAll('#l,#l2').forEach(x=>x.classList.toggle('active',v==='list'));render()}function expandAll(){people.forEach(p=>open.add(key(p.external_id)));render()}function collapseAll(){open.clear();render()}function profile(id){const p=by.get(key(id));if(p)alert((p.full_name||'Unnamed')+'\n'+p.external_id)}function boot(){people=(window.FAMILY_MEMBERS_STATIC||[]).map(a=>({external_id:a[0],full_name:a[1],sex:a[2],birth_date:a[3],place:a[4],occupation:a[5]}));by=new Map(people.map(p=>[key(p.external_id),p]));people.forEach(p=>open.add(key(p.external_id)));status.textContent='✅ '+people.length+' family members loaded';render()}Object.assign(window,{setView,expandAll,collapseAll,profile,render});search.addEventListener('input',render);boot()})();</script></body></html>
