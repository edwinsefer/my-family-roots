rth.value,place:place.value.trim(),occupation:job.value.trim()};redits[k]={...(redits[k]||{}),parents:ps,spouses:ss};localStorage.setItem(PS,JSON.stringify(pedits));localStorage.setItem(RS,JSON.stringify(redits));$('msg').textContent='✅ Saved on this device. Family Tree will use this correction.';showPeople();setTimeout(closeEdit,700)}function goTree(){location.replace('family-roots-gallery.html?v=20260916-2')}Object.assign(window,{openEdit,closeEdit,saveEdit,goTree});load()})()</script></body></html>
