<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><style>:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b;--ok:#3d7c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:var(--accent)!important;color:#fff!important}.save{background:var(--ok)!important;color:#fff;border-color:var(--ok)}.wrap{padding:16px}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:12px}.status{margin-top:10px;color:var(--muted);white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person,.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer}.person:hover,.mini:hover{border-color:var(--gold)}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.tree{overflow:auto;padding:12px 4px 30px}.unit{min-width:760px;text-align:center;margin-bottom:38px}.couple{display:inline-flex;align-items:center;gap:0}.connector{width:32px;border-top:3px solid var(--gold)}.down{width:70%;max-width:760px;margin:auto;height:30px;border:2px solid var(--gold);border-bottom:0}.kids{display:flex;justify-content:center;gap:16px;align-items:flex-start}.kid{min-width:190px;max-width:270px;position:relative}.kid:before{content:"";position:absolute;top:-30px;left:50%;height:30px;border-left:2px solid var(--gold)}.mini{background:#fffdf9}.minirow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:12px}.overlay.open{display:block}.focus{max-width:1050px;margin:auto;background:var(--paper);border-radius:20px;padding:18px;min-height:calc(100vh - 24px)}.head{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.head h2{margin:0}.close{margin-left:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.rel{display:block;width:100%;text-align:left;background:#faf6ef;border:1px solid #eadfce;border-radius:9px;padding:8px;margin:5px 0;cursor:pointer}.edit{margin-top:14px}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field select,.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.field select[multiple]{min-height:140px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:#a33;font-weight:700}@media(max-width:700px){.wrap{padding:10px}.unit{min-width:680px}.cols{grid-template-columns:1fr}.overlay{padding:7px}.focus{padding:12px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><div><button id="tb" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="lb" class="btn" onclick="setView('list')">📋 All People</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="focus"><div class="head"><div><div class="meta">PERSON FOCUS</div><h2 id="title">Family Member</h2></div><button class="btn close" onclick="closeFocus()">✕ Close</button></div><div id="body"></div></div></div><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SK='mfr_session_v1';let people=[],map=new Map(),GP={},GS={},view='tree',focus=null;const $=id=>document.getElementById(id),status=$('status');const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/);return m?m[0]:s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(arr);if(typeof v==='object')return Object.values(v).flatMap(arr);try{const j=JSON.parse(v);if(j!==v)return arr(j)}catch(e){}return String(v).split(/[,;|\s]+/).filter(Boolean)};const sess=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}};async function req(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{...opt,signal:c.signal});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){d=text}if(!r.ok)throw Error('HTTP '+r.status+(d?.message?': '+d.message:''));return d}finally{clearTimeout(t)}}async function api(path,opt={}){const s=sess();if(!s?.access_token)throw Error('Login session missing. Please sign in again.');return req(U+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json',...(opt.headers||{})}})}function rel(p,f,g){const raw=p?.[f];if(raw!==null&&raw!==undefined&&raw!=='')return arr(raw).map(key).map(k=>map.get(k)).filter(Boolean);return arr(g[p.external_id]||g[key(p.external_id)]||g['@'+key(p.external_id)+'@']||[]).map(key).map(k=>map.get(k)).filter(Boolean)}const parents=p=>rel(p,'parent_ids',GP),spouses=p=>rel(p,'spouse_ids',GS),children=p=>people.filter(c=>parents(c).some(x=>key(x.external_id)===key(p.external_id)));function setView(v){view=v;render()}function card(p,mini=false){return '<div class="'+(mini?'mini':'person')+'" onclick="openFocus(\''+esc(p.external_id)+'\')">👤 <span class="name">'+esc(p.full_name||'Unnamed')+'</span><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+(p.place?' · 📍 '+esc(p.place):'')+'</div></div>'}function couple(p,mini=false){const a=[p,...spouses(p).filter(x=>key(x.external_id)!==key(p.external_id))];return '<div class="'+(mini?'minirow':'couple')+'">'+a.map((x,i)=>(i?' <span>💍</span> ':'')+card(x,mini)).join('')+'</div>'}function unit(p){let kids=[];[p,...spouses(p)].forEach(x=>children(x).forEach(c=>{if(!kids.some(y=>key(y.external_id)===key(c.external_id)))kids.push(c)}));return '<div class="unit">'+couple(p)+(kids.length?'<div class="down"></div><div class="kids">'+kids.map(c=>'<div class="kid"><div class="mini">'+couple(c,true)+(children(c).length?'<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:8px">'+children(c).map(g=>'<div class="rel" onclick="openFocus(\''+esc(g.external_id)+'\')">👤 '+esc(g.full_name||'Unnamed')+'</div>').join('')+'</div>':'')+'</div></div>').join('')+'</div>':'')+'</div>'}function roots(){const child=new Set();people.forEach(p=>{if(parents(p).length)child.add(key(p.external_id))});const out=[];people.filter(p=>!child.has(key(p.external_id))).forEach(p=>{const k=key(p.external_id),ss=spouses(p).map(key);if(!out.some(x=>key(x.external_id)===k||ss.includes(key(x.external_id))))out.push(p)});return out}function render(){const q=$('search').value.trim().toLowerCase();$('tb').classList.toggle('active',view==='tree');$('lb').classList.toggle('active',view==='list');let a=q?people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q)):people;if(view==='list'||q){$('content').innerHTML='<div class="card"><div class="grid">'+a.map(p=>card(p)).join('')+'</div></div>'}else{$('content').innerHTML='<div class="card"><div class="meta" style="text-align:center;margin-bottom:14px">Parents together → children below. Click any person for Person Focus.</div><div class="tree">'+roots().map(unit).join('')+'</div></div>'}}function list(items){return items.length?items.map(x=>'<button class="rel" onclick="openFocus(\''+esc(x.external_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</button>').join(''):'<div class="meta">—</div>'}function openFocus(id){const p=map.get(key(id));if(!p)return;focus=p;$('title').textContent=p.full_name||'Family Member';$('body').innerHTML='<div class="cols"><div class="box"><h3>👤 '+esc(p.full_name||'Unnamed')+'</h3><div class="meta">ID: '+esc(p.external_id||'—')+'</div><p><b>Birth:</b> '+esc(p.birth_date||'—')+'</p><p><b>Place:</b> '+esc(p.place||'—')+'</p><p><b>Occupation:</b> '+esc(p.occupation||'—')+'</p><p><b>Generation:</b> '+esc(p.generation||'—')+'</p><button class="btn active" onclick="editRel(\''+esc(p.external_id)+'\')">✏️ Edit Relationships</button></div><div class="box"><h4>👨‍👩‍👧 Parents</h4>'+list(parents(p))+'<h4>💍 Spouse</h4>'+list(spouses(p))+'<h4>👶 Children</h4>'+list(children(p))+'</div></div><div id="editor"></div>';$('overlay').classList.add('open')}function closeFocus(){focus=null;$('overlay').classList.remove('open')}function opts(sel,ex){const s=new Set(sel.map(key));return people.filter(p=>key(p.external_id)!==key(ex)).sort((a,b)=>String(a.full_name).localeCompare(String(b.full_name))).map(p=>'<option value="'+esc(p.external_id)+'" '+(s.has(key(p.external_id))?'selected':'')+'>'+esc(p.full_name||'Unnamed')+' — '+esc(p.external_id)+'</option>').join('')}function editRel(id){const p=map.get(key(id));if(!p)return;$('editor').innerHTML='<div class="box edit"><h3>✏️ Edit Family Relationships</h3><div class="field"><label>Parents (max 2)</label><select id="rp" multiple>'+opts(parents(p).map(x=>x.external_id),p.external_id)+'</select></div><div class="field"><label>Spouse</label><select id="rs" multiple>'+opts(spouses(p).map(x=>x.external_id),p.external_id)+'</select></div><div class="field"><label>Generation</label><input id="rg" type="number" min="1" max="99" value="'+esc(p.generation||1)+'"></div><div class="actions"><button class="btn save" onclick="saveRel(\''+esc(id)+'\')">💾 Save</button><button class="btn" onclick="$(\'editor\').innerHTML=\'\'">Cancel</button></div><div id="es" class="status"></div></div>'}function vals(id){return Array.from($(id).selectedOptions).map(o=>o.value)}async function patch(id,b){return api('/rest/v1/family_members?external_id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(b)})}async function saveRel(id){const p=map.get(key(id)),es=$('es');let ps=vals('rp'),ss=vals('rs');if(ps.length>2){es.textContent='❌ Maximum 2 parents.';return}ps=[...new Set(ps.map(key).map(k=>map.get(k)?.external_id).filter(Boolean))];ss=[...new Set(ss.map(key).map(k=>map.get(k)?.external_id).filter(Boolean))];es.textContent='Saving…';try{await patch(id,{parent_ids:ps,spouse_ids:ss,generation:Math.max(1,Math.min(99,Number($('rg').value||1)))});await load();openFocus(id)}catch(e){es.textContent='❌ '+e.message}}async function load(){status.textContent='🔄 Connecting to family database…';try{const d=await api('/rest/v1/family_members?select=*&order=full_name.asc');if(!Array.isArray(d))throw Error('Unexpected database response.');people=d;map=new Map(people.map(p=>[key(p.external_id),p]));status.textContent='🔄 Loading relationship map…';await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='gedcom-relationships.js?v=20260910-1';s.onload=()=>{GP=window.GEDCOM_PARENTS||{};GS=window.GEDCOM_SPOUSES||{};resolve()};s.onerror=()=>reject(Error('Relationship map failed to load.'));document.head.appendChild(s)});status.textContent='✅ '+people.length+' family members loaded · '+people.reduce((n,p)=>n+parents(p).length,0)+' parent links · '+roots().length+' family roots';render()}catch(e){status.innerHTML='<span class="error">❌ '+esc(e.message||String(e))+'</span><br><span class="meta">The app stopped safely. Your family data was not changed.</span>';console.error(e)}}window.setView=setView;window.openFocus=openFocus;window.closeFocus=closeFocus;window.editRel=editRel;window.saveRel=saveRel;window.logout=()=>{localStorage.removeItem(SK);location.replace('login.html?v=20260910-1')};$('search').addEventListener('input',render);window.addEventListener('error',e=>{status.innerHTML='<span class="error">❌ App error: '+esc(e.message||'JavaScript error')+'</span>'});load()})()</script></body></html>
