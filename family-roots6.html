<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><style>:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:var(--accent)!important;color:#fff!important}.wrap{padding:16px}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:12px}.status{margin-top:10px;color:var(--muted);white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person,.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.tree{overflow:auto;padding:12px 4px 30px}.unit{min-width:760px;text-align:center;margin-bottom:45px}.couple{display:inline-flex;align-items:center}.link{width:34px;border-top:3px solid var(--gold)}.down{width:70%;max-width:760px;margin:auto;height:28px;border:2px solid var(--gold);border-bottom:0}.kids{display:flex;justify-content:center;gap:14px;align-items:flex-start}.kid{min-width:190px;max-width:250px;position:relative}.kid:before{content:"";position:absolute;top:-28px;left:50%;height:28px;border-left:2px solid var(--gold)}.minirow{display:flex;gap:5px;justify-content:center;align-items:center}.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:10px}.overlay.open{display:block}.focus{max-width:900px;margin:auto;background:var(--paper);border-radius:20px;padding:18px;min-height:calc(100vh - 20px)}.head{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.head h2{margin:0}.close{margin-left:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.rel{display:block;width:100%;text-align:left;background:#faf6ef;border:1px solid #eadfce;border-radius:9px;padding:8px;margin:5px 0;cursor:pointer}.error{color:#a33;font-weight:700}@media(max-width:700px){.cols{grid-template-columns:1fr}.unit{min-width:680px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button class="btn active" id="treeBtn" onclick="setView('tree')">🌳 Tree</button><button class="btn" id="listBtn" onclick="setView('list')">📋 List</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><button class="btn active" id="tb" onclick="setView('tree')">🌳 Family Tree</button> <button class="btn" id="lb" onclick="setView('list')">📋 All People</button><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="focus"><div class="head"><div><div class="meta">PERSON FOCUS</div><h2 id="title">Family Member</h2></div><button class="btn close" onclick="closeFocus()">✕ Close</button></div><div id="body"></div></div></div><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SK='mfr_session_v1';let people=[],by=new Map(),GP={},GS={},view='tree';const $=x=>document.getElementById(x),status=$('status');const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/);return m?m[0]:s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(arr);try{let j=JSON.parse(v);if(typeof j!=='string')return arr(j)}catch(e){}return String(v).split(/[,;|\s]+/).filter(Boolean)};const session=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}};async function loadJson(url,opt){let r=await fetch(url,opt);let t=await r.text(),d;try{d=JSON.parse(t)}catch(e){d=t}if(!r.ok)throw Error('HTTP '+r.status+(d?.message?': '+d.message:''));return d}function ged(map,id){const k=key(id);return arr(map[id]??map[k]??map['@'+k+'@']??map['@'+k]??[])}function parents(p){return ged(GP,p.external_id).map(key).map(k=>by.get(k)).filter(Boolean)}function spouses(p){return ged(GS,p.external_id).map(key).map(k=>by.get(k)).filter(Boolean)}function children(p){const k=key(p.external_id);return people.filter(c=>parents(c).some(x=>key(x.external_id)===k))}function setView(v){view=v;render()}function card(p,small=false){return '<div class="'+(small?'mini':'person')+'" onclick="openFocus(\''+esc(p.external_id)+'\')">👤 <span class="name">'+esc(p.full_name||'Unnamed')+'</span>'+(p.birth_date?'<div class="meta">🎂 '+esc(p.birth_date)+'</div>':'')+'</div>'}function couple(p){let ss=spouses(p).filter(x=>key(x.external_id)!==key(p.external_id));return '<div class="couple">'+card(p)+(ss.length?'<span class="link"></span>'+ss.map(card).join(''): '')+'</div>'}function unit(p){let kids=children(p),ss=spouses(p);ss.forEach(s=>children(s).forEach(c=>{if(!kids.some(x=>key(x.external_id)===key(c.external_id)))kids.push(c)}));return '<div class="unit">'+couple(p)+(kids.length?'<div class="down"></div><div class="kids">'+kids.map(c=>'<div class="kid">'+card(c,true)+'</div>').join('')+'</div>':'')+'</div>'}function roots(){let hasParent=new Set();people.forEach(p=>parents(p).forEach(()=>hasParent.add(key(p.external_id))));let out=[];for(const p of people){let k=key(p.external_id);if(hasParent.has(k))continue;let ss=spouses(p).map(key);if(!out.some(x=>key(x.external_id)===k||ss.includes(key(x.external_id))))out.push(p)}return out}function render(){let q=$('search').value.trim().toLowerCase();$('tb').classList.toggle('active',view==='tree');$('lb').classList.toggle('active',view==='list');$('treeBtn').classList.toggle('active',view==='tree');$('listBtn').classList.toggle('active',view==='list');let a=q?people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q)):people;if(view==='list'||q)$('content').innerHTML='<div class="card"><div class="grid">'+a.map(p=>card(p)).join('')+'</div></div>';else $('content').innerHTML='<div class="card"><div class="meta" style="text-align:center">GEDCOM is the only relationship source · spouse is never treated as a child</div><div class="tree">'+roots().map(unit).join('')+'</div></div>'}function list(xs){return xs.length?xs.map(x=>'<button class="rel" onclick="openFocus(\''+esc(x.external_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</button>').join(''):'<div class="meta">—</div>'}function openFocus(id){let p=by.get(key(id));if(!p)return;$('title').textContent=p.full_name||'Family Member';$('body').innerHTML='<div class="cols"><div class="box"><h3>👤 '+esc(p.full_name||'Unnamed')+'</h3><div class="meta">ID: '+esc(p.external_id||'—')+'</div><p><b>Birth:</b> '+esc(p.birth_date||'—')+'</p><p><b>Place:</b> '+esc(p.place||'—')+'</p><p><b>Occupation:</b> '+esc(p.occupation||'—')+'</p></div><div class="box"><h4>👨‍👩‍👧 Parents</h4>'+list(parents(p))+'<h4>💍 Spouse</h4>'+list(spouses(p))+'<h4>👶 Children</h4>'+list(children(p))+'</div></div>';$('overlay').classList.add('open')}function closeFocus(){$('overlay').classList.remove('open')}async function load(){status.textContent='🔄 Connecting to family database…';try{let s=session();if(!s?.access_token)throw Error('Login session missing. Please sign in again.');let d=await loadJson(U+'/rest/v1/family_members?select=*&order=full_name.asc',{headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json'}});if(!Array.isArray(d))throw Error('Unexpected database response.');people=d;by=new Map(people.map(p=>[key(p.external_id),p]));status.textContent='🔄 Loading GEDCOM relationship map…';await new Promise((ok,no)=>{let z=document.createElement('script');z.src='gedcom-relationships.js?v=20260910-2';z.onload=ok;z.onerror=()=>no(Error('GEDCOM relationship map failed to load.'));document.head.appendChild(z)});GP=window.GEDCOM_PARENTS||{};GS=window.GEDCOM_SPOUSES||{};let links=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+links+' GEDCOM parent links · '+roots().length+' family roots';render()}catch(e){status.innerHTML='<span class="error">❌ '+esc(e.message||String(e))+'</span><br><span class="meta">No family data was changed.</span>';console.error(e)}}window.setView=setView;window.openFocus=openFocus;window.closeFocus=closeFocus;window.logout=()=>{localStorage.removeItem(SK);location.replace('login.html?v=20260910-2')};$('search').addEventListener('input',render);window.addEventListener('error',e=>{status.innerHTML='<span class="error">❌ App error: '+esc(e.message||'JavaScript error')+'</span>'});load()})()</script></body></html>
