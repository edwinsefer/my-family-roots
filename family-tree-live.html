<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f8f4ec;--card:#fffdf8;--ink:#2f2418;--muted:#756a5e;--accent:#6b4f2f;--gold:#c99d3b;--line:#e2d7c6;--green:#4d795b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#3d2918,#6b4f2f);color:white;padding:14px 18px;box-shadow:0 4px 18px #0002}.bar{max-width:1200px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{font-size:11px;opacity:.8;display:block}.btn{border:1px solid #ffffff35;background:#ffffff14;color:inherit;border-radius:10px;padding:9px 13px;cursor:pointer}.btn:hover{background:#ffffff25}.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 5px 20px #4d35140b}.login{max-width:520px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.person{border:1px solid var(--line);border-radius:14px;padding:15px;background:white;cursor:pointer;transition:.18s}.person:hover{transform:translateY(-2px);box-shadow:0 7px 18px #00000010}.avatar{width:58px;height:58px;border-radius:50%;background:#eee2cf;display:grid;place-items:center;font-size:24px;margin-bottom:10px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{color:var(--muted);font-size:12px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:white}.tree{display:grid;gap:10px}.row{display:flex;gap:12px;flex-wrap:wrap}.hidden{display:none!important}.status{color:var(--muted);font-size:13px;margin-top:8px}.modal{position:fixed;inset:0;background:#24170b99;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px;position:relative}.x{position:absolute;right:15px;top:10px;border:0;background:none;font-size:25px;cursor:pointer}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.primary{background:var(--accent);color:white}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab.active{background:var(--accent);color:white}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:700px){.wrap{padding:12px}.grid{grid-template-columns:1fr 1fr}.person{padding:12px}.btn{padding:8px 10px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots <span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="signOut()" id="logout" style="display:none">Logout</button></div></header><main class="wrap"><section id="login" class="panel login"><h2>🔐 Family Login</h2><p class="meta">Sign in to access the shared family database.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="actions"><button class="btn primary" onclick="signIn()">🔑 Sign In</button></div><div id="authStatus" class="status"></div></section><section id="app" class="hidden"><div class="panel"><div class="tabs"><button class="btn tab active" id="treeTab" onclick="setView('tree')">🌳 Tree View</button><button class="btn tab" id="listTab" onclick="setView('list')">📋 List View</button></div><input id="search" class="search" placeholder="🔍 Search family member…" oninput="render()"><div id="status" class="status"></div></div><div id="content"></div></section></main><div id="modal" class="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>const URL='https://umbhqintywwsyduzrtai.supabase.co';const KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K';const db=window.supabase.createClient(URL,KEY);let people=[],user=null,view='tree';let expanded=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const r=await db.auth.getSession();user=r.data.session?.user||null;await authUI();db.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;await authUI()})}async function authUI(){document.getElementById('login').classList.toggle('hidden',!!user);document.getElementById('app').classList.toggle('hidden',!user);document.getElementById('logout').style.display=user?'block':'none';if(user)await load()}async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('authStatus').textContent='Signing in…';try{const r=await Promise.race([db.auth.signInWithPassword({email,password}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Login timed out. Please refresh and try again.')),15000))]);if(r.error)document.getElementById('authStatus').textContent='❌ '+r.error.message}catch(e){document.getElementById('authStatus').textContent='❌ '+e.message}}async function signOut(){await db.auth.signOut()}async function load(){const status=document.getElementById('status');status.textContent='🔄 Loading family data…';try{const r=await Promise.race([db.from('family_members').select('*').order('generation').order('full_name'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Database request timed out after 15 seconds.')),15000))]);if(r.error){status.textContent='❌ Database read failed: '+r.error.message;return}people=r.data||[];expanded.clear();people.forEach(p=>expanded.add(p.external_id));status.textContent=`✅ ${people.length} family members loaded from Supabase`;render()}catch(e){status.textContent='❌ '+e.message}}function setView(v){view=v;document.getElementById('treeTab').classList.toggle('active',v==='tree');document.getElementById('listTab').classList.toggle('active',v==='list');render()}function match(p,q){return !q||[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q)}function card(p){let photo=p.photo_url?`<img src="${esc(p.photo_url)}">`:'👤';return `<article class="person" onclick="profile('${esc(p.external_id)}')"><div class="avatar">${photo}</div><div class="name">${esc(p.full_name||'Unnamed')}</div><div class="meta">Generation ${p.generation||''}${p.occupation?' · '+esc(p.occupation):''}</div>${p.birth_date?`<div class="meta">🎂 ${esc(p.birth_date)}</div>`:''}</article>`}function render(){let q=document.getElementById('search').value.trim().toLowerCase(),arr=people.filter(p=>match(p,q));if(view==='list'){document.getElementById('content').innerHTML=arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:`<div class="panel empty">No family member found.</div>`;return}let gens={};arr.forEach(p=>(gens[p.generation||1]??=[]).push(p));let html='';Object.keys(gens).sort((a,b)=>a-b).forEach(g=>{let ids=gens[g].map(p=>p.external_id),open=ids.some(id=>expanded.has(id));html+=`<section class="panel"><div class="name" onclick="toggleGen(${g})">${open?'▾':'▸'} Generation ${g} <span class="meta">(${gens[g].length})</span></div><div class="row ${open?'':'hidden'}" style="margin-top:12px">${gens[g].map(card).join('')}</div></section>`});document.getElementById('content').innerHTML=html||`<div class="panel empty">No family member found.</div>`}function toggleGen(g){let ids=people.filter(p=>(p.generation||1)==g).map(p=>p.external_id),open=ids.some(x=>expanded.has(x));ids.forEach(x=>open?expanded.delete(x):expanded.add(x));render()}function expandAll(){people.forEach(p=>expanded.add(p.external_id));render()}function collapseAll(){expanded.clear();render()}function profile(id){let p=people.find(x=>x.external_id===id);if(!p)return;document.getElementById('modalBody').innerHTML=`<h2>${esc(p.full_name||'Unnamed')}</h2><p class="meta">ID: ${esc(p.external_id)}</p><label>Full name</label><input id="e_name" value="${esc(p.full_name)}"><label>Birth date</label><input id="e_birth" value="${esc(p.birth_date)}"><label>Place</label><input id="e_place" value="${esc(p.place||p.address)}"><label>Occupation</label><input id="e_occ" value="${esc(p.occupation)}"><label>Bio / Notes</label><textarea id="e_bio">${esc(p.bio)}</textarea><div class="actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="save('${esc(id)}')">💾 Save Edit</button></div>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}async function save(id){let patch={full_name:document.getElementById('e_name').value.trim()||'Unnamed',birth_date:document.getElementById('e_birth').value||null,place:document.getElementById('e_place').value||null,occupation:document.getElementById('e_occ').value||null,bio:document.getElementById('e_bio').value||null};let r=await db.from('family_members').update(patch).eq('external_id',id);if(r.error){alert('Save failed: '+r.error.message);return}closeModal();await load()}boot();</script></body></html>
