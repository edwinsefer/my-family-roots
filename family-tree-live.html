<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gedcom-relationships.js"></script><style>:root{--bg:#f7f1e7;--card:#fffdf9;--ink:#2f2418;--muted:#756a5e;--accent:#6b4f2f;--gold:#c99d3b;--line:#e2d7c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:13px 16px}.bar{max-width:1200px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid #ffffff35;background:#ffffff14;color:inherit;border-radius:10px;padding:8px 12px;cursor:pointer}.btn.active,.btn:hover{background:#ffffff25}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.login{max-width:520px;margin:55px auto}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.status{color:var(--muted);font-size:13px;margin-top:8px}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.active{background:var(--accent);color:#fff}.tree{display:grid;gap:12px}.branch{border-left:3px solid var(--gold);padding-left:14px}.branchHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.branchTitle{font-weight:800}.person{display:inline-flex;vertical-align:top;flex-direction:column;gap:5px;width:210px;min-height:115px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;margin:5px}.person:hover{box-shadow:0 7px 18px #0001;transform:translateY(-1px)}.avatar{width:48px;height:48px;border-radius:50%;background:#eee2cf;display:grid;place-items:center;font-size:21px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{color:var(--muted);font-size:12px}.children{margin:4px 0 8px 20px;padding-left:14px;border-left:2px dashed var(--line)}.spouses{font-size:12px;color:var(--muted);margin:3px 0 3px 6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid .person{width:auto;margin:0}.empty{text-align:center;padding:30px;color:var(--muted)}.modal{position:fixed;inset:0;background:#24170b99;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px;position:relative}.x{position:absolute;right:15px;top:10px;border:0;background:none;font-size:25px;cursor:pointer}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.primary{background:var(--accent);color:#fff}@media(max-width:700px){.wrap{padding:10px}.person{width:100%;margin:4px 0}.children{margin-left:8px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots <span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="signOut()" id="logout" style="display:none">Logout</button></div></header><main class="wrap"><section id="login" class="panel login"><h2>🔐 Family Login</h2><p class="meta">Sign in to access the shared family database.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="btn primary" onclick="signIn()">🔑 Sign In</button></div><div id="authStatus" class="status"></div></section><section id="app" class="hidden"><div class="panel"><div class="tabs"><button class="btn tab active" id="treeTab" onclick="setView('tree')">🌳 Tree View</button><button class="btn tab" id="listTab" onclick="setView('list')">📋 List View</button></div><input id="search" class="search" placeholder="🔍 Search family member…" oninput="render()"><div id="status" class="status"></div></div><div id="content"></div></section></main><div id="modal" class="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>(function(){'use strict';const SUPABASE_URL='https://umbhqintywwsyduzrtai.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K';let supabaseClient=null,people=[],user=null,view='tree',expanded=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=s=>String(s??'').trim().replace(/^@|@$/g,'');const gedParents=window.GEDCOM_PARENTS||{},gedSpouses=window.GEDCOM_SPOUSES||{};function gedGet(map,id){const k=key(id);return map[id]||map[k]||map['@'+k+'@']||map['@'+k]||[]}function parseIds(v){if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(parseIds).filter(Boolean);if(typeof v==='object')return Object.values(v).flatMap(parseIds).filter(Boolean);let s=String(v).trim();try{const j=JSON.parse(s);if(j!==s)return parseIds(j)}catch(e){}return s.split(/[,;|]/).map(x=>x.trim().replace(/^[\s"'{}\[\]]+|[\s"'{}\[\]]+$/g,'')).filter(Boolean)}function idsFor(p,field){return parseIds(p[field]).map(key)}function findPerson(id){const k=key(id);return people.find(p=>key(p.external_id)===k||key(p.id)===k)}function parentList(p){const db=idsFor(p,'parent_ids').map(findPerson).filter(Boolean);if(db.length)return db;return gedGet(gedParents,p.external_id).map(findPerson).filter(Boolean)}function childList(p){const k=key(p.external_id);return people.filter(c=>parentList(c).some(x=>key(x.external_id)===k))}function spouseList(p){const db=idsFor(p,'spouse_ids').map(findPerson).filter(Boolean);if(db.length)return db;return gedGet(gedSpouses,p.external_id).map(findPerson).filter(Boolean)}function initClient(){try{if(!window.supabase?.createClient)throw Error('Supabase library did not load.');supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return true}catch(e){document.getElementById('authStatus').textContent='❌ '+e.message;return false}}async function boot(){if(!initClient())return;try{const r=await supabaseClient.auth.getSession();user=r.data?.session?.user||null;await authUI();supabaseClient.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;authUI()})}catch(e){document.getElementById('authStatus').textContent='❌ Connection error: '+e.message}}async function authUI(){document.getElementById('login').classList.toggle('hidden',!!user);document.getElementById('app').classList.toggle('hidden',!user);document.getElementById('logout').style.display=user?'block':'none';if(user)await load()}async function signIn(){if(!supabaseClient)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,s=document.getElementById('authStatus');if(!email||!password){s.textContent='❌ Please enter email and password.';return}s.textContent='Signing in…';try{const r=await Promise.race([supabaseClient.auth.signInWithPassword({email,password}),new Promise((_,rej)=>setTimeout(()=>rej(Error('Login timed out. Please refresh and try again.')),15000))]);s.textContent=r.error?'❌ '+r.error.message:'✅ Signed in.'}catch(e){s.textContent='❌ '+e.message}}async function signOut(){if(supabaseClient)await supabaseClient.auth.signOut()}async function load(){const s=document.getElementById('status');s.textContent='🔄 Loading family data…';try{const r=await Promise.race([supabaseClient.from('family_members').select('*').order('full_name',{ascending:true}),new Promise((_,rej)=>setTimeout(()=>rej(Error('Database request timed out after 15 seconds.')),15000))]);if(r.error){s.textContent='❌ Database read failed: '+r.error.message;return}people=r.data||[];expanded.clear();const links=people.reduce((n,p)=>n+parentList(p).length,0);s.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active';render()}catch(e){s.textContent='❌ '+e.message}}function setView(v){view=v;document.getElementById('treeTab').classList.toggle('active',v==='tree');document.getElementById('listTab').classList.toggle('active',v==='list');render()}function match(p,q){return !q||[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q)}function card(p){const photo=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'👤';return '<article class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div class="avatar">'+photo+'</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></article>'}function roots(){const rs=people.filter(p=>!parentList(p).length),out=[];for(const p of rs){const sid=spouseList(p).map(x=>key(x.external_id));if(!out.some(x=>key(x.external_id)===key(p.external_id)||sid.includes(key(x.external_id))))out.push(p)}return out}function renderBranch(p,seen){const id=key(p.external_id);if(seen.has(id))return '';const next=new Set(seen);next.add(id);const kids=childList(p),sp=spouseList(p),open=expanded.has(id);let h='<div class="branch"><div class="branchHead"><button class="btn" onclick="event.stopPropagation();toggle(\''+esc(p.external_id)+'\')">'+(open?'−':'＋')+'</button><span class="branchTitle">Family branch</span></div><div>'+card(p)+(sp.length?'<div class="spouses">💍 '+sp.map(x=>esc(x.full_name||'Unnamed')).join(' · ')+'</div>':'')+'</div>';if(open&&kids.length)h+='<div class="children">'+kids.map(c=>renderBranch(c,next)).join('')+'</div>';return h+'</div>'}function render(){const q=document.getElementById('search')?.value.trim().toLowerCase()||'';if(view==='list'||q){const arr=people.filter(p=>match(p,q));document.getElementById('content').innerHTML=arr.length?'<div class="grid">'+arr.map(card).join('')+'</div>':'<div class="panel empty">No family member found.</div>';return}const rs=roots();document.getElementById('content').innerHTML=rs.length?'<div class="tree">'+rs.map(p=>renderBranch(p,new Set())).join('')+'</div>':'<div class="panel empty">No relationship roots found.</div>'}function toggle(id){const k=key(id);expanded.has(k)?expanded.delete(k):expanded.add(k);render()}function expandAll(){people.forEach(p=>expanded.add(key(p.external_id)));render()}function collapseAll(){expanded.clear();render()}function profile(id){const p=findPerson(id);if(!p)return;const parents=parentList(p),kids=childList(p),sp=spouseList(p);document.getElementById('modalBody').innerHTML='<h2>'+esc(p.full_name||'Unnamed')+'</h2><p class="meta">ID: '+esc(p.external_id)+'</p><p class="meta">Parents: '+(parents.map(x=>esc(x.full_name||'Unnamed')).join(', ')||'—')+'<br>Spouse: '+(sp.map(x=>esc(x.full_name||'Unnamed')).join(', ')||'—')+'<br>Children: '+(kids.map(x=>esc(x.full_name||'Unnamed')).join(', ')||'—')+'</p><label>Full name</label><input id="e_name" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="e_birth" value="'+esc(p.birth_date)+'"><label>Place</label><input id="e_place" value="'+esc(p.place||p.address)+'"><label>Occupation</label><input id="e_occ" value="'+esc(p.occupation)+'"><label>Bio / Notes</label><textarea id="e_bio">'+esc(p.bio)+'</textarea><div class="actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="save(\''+esc(id)+'\')">💾 Save Edit</button></div>';document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}async function save(id){const patch={full_name:document.getElementById('e_name').value.trim()||'Unnamed',birth_date:document.getElementById('e_birth').value||null,place:document.getElementById('e_place').value||null,occupation:document.getElementById('e_occ').value||null,bio:document.getElementById('e_bio').value||null};const r=await supabaseClient.from('family_members').update(patch).eq('external_id',id);if(r.error){alert('Save failed: '+r.error.message);return}closeModal();await load()}window.setView=setView;window.signIn=signIn;window.signOut=signOut;window.expandAll=expandAll;window.collapseAll=collapseAll;window.toggle=toggle;window.profile=profile;window.closeModal=closeModal;window.save=save;boot()})();</script></body></html>
