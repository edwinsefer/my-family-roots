rder-radius:10px;font:inherit}@media(max-width:650px){.wrap{padding:10px}}</style><script>window.addEventListener('error',function(e){var s=document.getElementById('status');if(s)s.textContent='❌ App error: '+(e.message||'JavaScript error')});</script></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><div><button id="treeBtn" class="btn active" onclick="setView('tree')">🌳 Tree View</button> <button id="listBtn" class="btn" onclick="setView('list')">📋 List View</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="modal" class="modal"><div class="box"><button class="btn" onclick="closeModal()">Close</button><div id="modalBody"></div></div></div><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SK='mfr_session_v1';let people=[],byKey=new Map(),view='tree',open=new Set(),GP={},GS={};const $=id=>document.getElementById(id),status=$('status');const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/);return m?m[0]:s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(arr);if(typeof v==='object')return Object.values(v).flatMap(arr);try{const j=JSON.parse(v);if(j!==v)return arr(j)}catch(e){}return String(v).split(/[,;|\s]+/).filter(Boolean)};const session=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}};async function fetchJSON(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{...opt,signal:c.signal});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){d=text}if(!r.ok)throw Error('HTTP '+r.status+(d&&d.message?': '+d.message:''));return d}finally{clearTimeout(t)}}async function api(path){const s=session();if(!s||!s.access_token)throw Error('No login session. Please sign in again.');return fetchJSON(U+path,{headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json'}})}function rel(p,f,g){const a=arr(p[f]).map(key).map(k=>byKey.get(k)).filter(Boolean);if(a.length)return a;const x=g[p.external_id]||g[key(p.external_id)]||g['@'+key(p.external_id)+'@']||[];return arr(x).map(key).map(k=>byKey.get(k)).filter(Boolean)}const parents=p=>rel(p,'parent_ids',GP),spouses=p=>rel(p,'spouse_ids',GS),children=p=>people.filter(c=>parents(c).some(x=>key(x.external_id)===key(p.external_id)));function roots(){const hasParents=new Set();people.forEach(p=>{if(parents(p).length)hasParents.add(key(p.external_id))});const out=[];people.filter(p=>!hasParents.has(key(p.external_id))).forEach(p=>{const k=key(p.external_id),ss=spouses(p).map(x=>key(x.external_id));if(!out.some(x=>key(x.external_id)===k||ss.includes(key(x.external_id))))out.push(p)});return out}function person(p){return '<div class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div>👤</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div>'}function branch(p,seen=new Set()){const k=key(p.external_id);if(seen.has(k))return'';const n=new Set(seen);n.add(k);const kids=children(p),ss=spouses(p),is=open.has(k);return '<div class="branch"><button class="btn" onclick="event.stopPropagation();toggle(\''+esc(p.external_id)+'\')">'+(is?'−':'＋')+'</button> '+person(p)+(ss.length?'<div class="meta">💍 '+ss.map(x=>esc(x.full_name)).join(' · ')+'</div>':'')+(is&&kids.length?'<div class="children">'+kids.map(x=>branch(x,n)).join('')+'</div>':'')+'</div>'}function render(){const q=$('search').value.trim().toLowerCase(),c=$('content');$('treeBtn').classList.toggle('active',view==='tree');$('listBtn').classList.toggle('active',view==='list');if(view==='list'||q){const a=people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q));c.innerHTML='<div class="card">'+(a.length?'<div class="grid">'+a.map(person).join('')+'</div>':'<div class="empty">No family member found.</div>')+'</div>'}else c.innerHTML='<div class="card">'+roots().map(branch).join('')+'</div>'}function setView(v){view=v;render()}function toggle(id){const k=key(id);open.has(k)?open.delete(k):open.add(k);render()}function expandAll(){people.forEach(p=>open.add(key(p.external_id)));render()}function collapseAll(){open.clear();render()}function profile(id){const p=byKey.get(key(id));if(!p)return;const ps=parents(p).map(x=>esc(x.full_name)).join(', ')||'—',ss=spouses(p).map(x=>esc(x.full_name)).join(', ')||'—',cs=children(p).map(x=>esc(x.full_name)).join(', ')||'—';$('modalBody').innerHTML='<h2>'+esc(p.full_name||'Unnamed')+'</h2><p class="meta">Parents: '+ps+'<br>Spouse: '+ss+'<br>Children: '+cs+'</p><label>Full name</label><input id="en" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="eb" value="'+esc(p.birth_date)+'"><label>Place</label><input id="ep" value="'+esc(p.place)+'"><label>Occupation</label><input id="eo" value="'+esc(p.occupation)+'"><label>Bio</label><textarea id="ex">'+esc(p.bio)+'</textarea><button class="btn active" onclick="saveEdit(\''+esc(id)+'\')">💾 Save Edit</button>';$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}async function load(){try{status.textContent='🔄 Connecting to family database…';const d=await api('/rest/v1/family_members?select=*&order=full_name.asc');if(!Array.isArray(d))throw Error('Unexpected database response.');people=d;byKey=new Map(people.map(p=>[key(p.external_id),p]));people.forEach(p=>open.add(key(p.external_id)));let links=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active · '+roots().length+' family roots';render();const s=document.createElement('script');s.src='gedcom-relationships.js?v=20260909-final4';s.onload=()=>{GP=window.GEDCOM_PARENTS||{};GS=window.GEDCOM_SPOUSES||{};render()};s.onerror=()=>{};document.head.appendChild(s)}catch(e){status.textContent='❌ '+(e.message||String(e));if(/No login session|sign in/i.test(e.message))setTimeout(()=>location.replace('login.html?v=20260909-final4'),1200)}}async function logout(){localStorage.removeItem(SK);location.replace('login.html?v=20260909-final4')}async function saveEdit(id){try{const s=session();const body={full_name:$('en').value,birth_date:$('eb').value||null,place:$('ep').value||null,occupation:$('eo').value||null,bio:$('ex').value||null};const r=await fetchJSON(U+'/rest/v1/family_members?external_id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});closeModal();await load()}catch(e){alert(e.message)}}window.setView=setView;window.toggle=toggle;window.expandAll=expandAll;window.collapseAll=collapseAll;window.profile=profile;window.closeModal=closeModal;window.saveEdit=saveEdit;window.logout=logout;$('search').addEventListener('input',render);load()})()</script></body></html>
