</style><script>window.addEventListener('error',function(e){var s=document.getElementById('status');if(s)s.textContent='❌ App error: '+(e.message||'JavaScript error')});</script></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><div><button id="treeBtn" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="listBtn" class="btn" onclick="setView('list')">📋 All People</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="overlay" class="overlay"><div class="focus"><div class="focus-head"><div><div class="meta">PERSON FOCUS</div><h2 id="focusTitle">Family Member</h2></div><button class="btn close" onclick="closeFocus()">✕ Close</button></div><div id="focusBody"></div></div></div><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SK='mfr_session_v1';let people=[],byKey=new Map,view='tree',GP={},GS={},currentFocus=null;const $=id=>document.getElementById(id),status=$('status');const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/);return m?m[0]:s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(arr);if(typeof v==='object')return Object.values(v).flatMap(arr);try{const j=JSON.parse(v);if(j!==v)return arr(j)}catch(e){}return String(v).split(/[,;|\s]+/).filter(Boolean)};const session=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}};async function fetchJSON(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{...opt,signal:c.signal});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){d=text}if(!r.ok)throw Error('HTTP '+r.status+(d&&d.message?': '+d.message:''));return d}finally{clearTimeout(t)}}async function api(path,opt={}){const s=session();if(!s?.access_token)throw Error('No login session. Please sign in again.');return fetchJSON(U+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json',...(opt.headers||{})}})}function rel(p,f,g){const a=arr(p[f]).map(key).map(k=>byKey.get(k)).filter(Boolean);if(a.length)return a;const x=g[p.external_id]||g[key(p.external_id)]||g['@'+key(p.external_id)+'@']||[];return arr(x).map(key).map(k=>byKey.get(k)).filter(Boolean)}const parents=p=>rel(p,'parent_ids',GP),spouses=p=>rel(p,'spouse_ids',GS),children=p=>people.filter(c=>parents(c).some(x=>key(x.external_id)===key(p.external_id)));function couple(p){return [p,...spouses(p).filter(x=>key(x.external_id)!==key(p.external_id))]}function personCard(p,cls='person-card'){return '<div class="'+cls+'" onclick="openFocus(\''+esc(p.external_id)+'\')"><div>👤</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+(p.place?' · 📍 '+esc(p.place):'')+'</div></div>'}function coupleHtml(p,mini=false){const cs=couple(p);if(mini)return '<div class="mini-couple">'+cs.map(x=>'<div class="mini-person" onclick="openFocus(\''+esc(x.external_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</div>').join('<span>💍</span>')+'</div>';return '<div class="couple">'+personCard(cs[0])+(cs[1]?'<div class="couple-line"></div>'+personCard(cs[1]):'')+'</div>'}function familyUnit(p,seen=new Set){const k=key(p.external_id);if(seen.has(k))return'';const n=new Set(seen);n.add(k);const ss=couple(p).filter(x=>key(x.external_id)!==k),kids=[];children(p).forEach(ch=>{if(!kids.some(x=>key(x.external_id)===key(ch.external_id)))kids.push(ch)});ss.forEach(sp=>children(sp).forEach(ch=>{if(!kids.some(x=>key(x.external_id)===key(ch.external_id)))kids.push(ch)}));return '<div class="family-root">'+coupleHtml(p)+(kids.length?'<div class="family-connector"></div><div class="children-row">'+kids.map(ch=>'<div class="child-family"><div class="mini-family">'+coupleHtml(ch,true)+(children(ch).length?'<div class="mini-children">'+children(ch).map(gc=>'<div class="mini-child" onclick="openFocus(\''+esc(gc.external_id)+'\')">👤 '+esc(gc.full_name||'Unnamed')+(spouses(gc).length?' · 💍':'')+'</div>').join('')+'</div>':'')+'</div></div>').join('')+'</div>':'')+'</div>'}function roots(){const hasParents=new Set();people.forEach(p=>{if(parents(p).length)hasParents.add(key(p.external_id))});const out=[];people.filter(p=>!hasParents.has(key(p.external_id))).forEach(p=>{const k=key(p.external_id),ss=spouses(p).map(x=>key(x.external_id));if(!out.some(x=>key(x.external_id)===k||ss.includes(key(x.external_id))))out.push(p)});return out}function render(){const q=$('search').value.trim().toLowerCase(),c=$('content');$('treeBtn').classList.toggle('active',view==='tree');$('listBtn').classList.toggle('active',view==='list');if(view==='list'||q){const a=people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q));c.innerHTML='<div class="card">'+(a.length?'<div class="grid">'+a.map(p=>'<div class="list-card" onclick="openFocus(\''+esc(p.external_id)+'\')"><div class="name">👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+(p.place?' · 📍 '+esc(p.place):'')+'</div></div>').join('')+'</div>':'<div class="empty">No family member found.</div>')+'</div>'}else c.innerHTML='<div class="card"><div class="tree-note">Parents are shown together, then their children. Click a person for Person Focus.</div><div class="family-tree">'+roots().map(p=>familyUnit(p)).joi function focusPerson(p){return '<div class="focus-person '+(currentFocus&&key(currentFocus.external_id)===key(p.external_id)?'current':'')+'" onclick="openFocus(\''+esc(p.external_id)+'\')"><div class="name">👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+'</div></div>'}function levels(p,mode,max=4){let levels=[],cur=[p],seen=new Set([key(p.external_id)]);for(let i=1;i<=max;i++){const next=[];cur.forEach(x=>(mode==='up'?parents(x):children(x)).forEach(y=>{const k=key(y.external_id);if(!seen.has(k)){seen.add(k);next.push(y)}}));if(!next.length)break;levels.push(next);cur=next}return levels}function relationList(items){return items.length?items.map(x=>'<button class="rel-link" onclick="openFocus(\''+esc(x.external_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</button>').join(''):'<div class="meta">—</div>'}
function openFocus(id){const p=byKey.get(key(id));if(!p)return;currentFocus=p;const anc=levels(p,'up'),des=levels(p,'down'),ss=spouses(p),ps=parents(p),cs=children(p);$('focusTitle').textContent=p.full_name||'Family Member';let h='<div class="details"><div class="profile-main">'+(p.photo_url?'<img class="avatar" src="'+esc(p.photo_url)+'" alt="">':'<div class="avatar" style="display:grid;place-items:center;background:#f3eadc;font-size:42px">👤</div>')+'<h3>'+esc(p.full_name||'Unnamed')+'</h3><div class="detail-row"><b>Birth</b> '+esc(p.birth_date||'—')+'</div><div class="detail-row"><b>Place</b> '+esc(p.place||'—')+'</div><div class="detail-row"><b>Occupation</b> '+esc(p.occupation||'—')+'</div><div class="detail-row"><b>Generation</b> '+esc(p.generation||'—')+'</div><div class="detail-row"><b>About</b> '+esc(p.bio||'—')+'</div><button class="btn active" style="margin-top:12px" onclick="showRelationshipEditor(\''+esc(p.external_id)+'\')">✏️ Edit Relationships</button></div><div><div class="relationship-columns"><div class="relbox"><h4>👨‍👩‍👧 Parents</h4>'+relationList(ps)+'</div><div class="relbox"><h4>💍 Spouse</h4>'+relationList(ss)+'</div><div class="relbox"><h4>👶 Children</h4>'+relationList(cs)+'</div><div class="relbox"><h4>📋 Record</h4><div class="meta">ID: '+esc(p.external_id||'—')+'<br>Generation: '+esc(p.generation||'—')+'</div></div></div></div></div>';if(anc.length)h+='<div class="generation"><h3>⬆️ Previous generations — Ancestors</h3>'+anc.map((lv,i)=>'<div class="meta" style="margin:8px 0 5px">Generation '+(Number(p.generation||1)-i-1)+'</div><div class="gen-row">'+lv.map(focusPerson).join('')+'</div>').join('<div class="relation-arrow">↑</div>')+'</div>';h+='<div class="generation"><h3>⭐ Selected person</h3><div class="gen-row">'+focusPerson(p)+'</div></div>';if(des.length)h+='<div class="generation"><h3>⬇️ Next generations — Descendants</h3>'+des.map((lv,i)=>'<div class="meta" style="margin:8px 0 5px">Generation '+(Number(p.generation||1)+i+1)+'</div><div class="gen-row">'+lv.map(focusPerson).join('')+'</div>').join('<div class="relation-arrow">↓</div>')+'</div>';$('focusBody').innerHTML=h;$('overlay').classList.add('open')}
function closeFocus(){currentFocus=null;$('overlay').classList.remove('open')}function options(selected=[],exclude=''){const s=new Set(selected.map(key));return people.filter(p=>key(p.external_id)!==key(exclude)).sort((a,b)=>String(a.full_name||'').localeCompare(String(b.full_name||''))).map(p=>'<option value="'+esc(p.external_id)+'" '+(s.has(key(p.external_id))?'selected':'')+'>'+esc(p.full_name||'Unnamed')+' — '+esc(p.external_id)+'</option>').join('')}function showRelationshipEditor(id){const p=byKey.get(key(id));if(!p)return;const ps=parents(p),ss=spouses(p),box=document.createElement('div');box.className='edit-panel';box.id='relationshipEditor';box.innerHTML='<h3>✏️ Edit Family Relationships</h3><div class="hint">இந்த நபரின் Parents, Spouse, Generation மட்டும் இங்கே மாற்றலாம். Save செய்ததும் Tree மற்றும் Person Focus புதுப்பிக்கப்படும்.</div><div class="field"><label>👨‍👩‍👧 Parents — maximum 2</label><select id="relParents" multiple>'+options(ps,p.external_id)+'</select></div><div class="field"><label>💍 Spouse</label><select id="relSpouses" multiple>'+options(ss,p.external_id)+'</select></div><div class="field"><label>🔢 Generation</label><input id="relGeneration" type="number" min="1" max="99" value="'+esc(p.generation||'1')+'"></div><div class="edit-actions"><button class="btn save" onclick="saveRelationships(\''+esc(p.external_id)+'\')">💾 Save Relationships</button><button class="btn" onclick="document.getElementById(\'relationshipEditor\')?.remove()">Cancel</button></div><div id="editStatus" class="edit-status"></div>';$('focusBody').appendChild(box);box.scrollIntoView({behavior:'smooth',block:'start'})}function selectedValues(id){return Array.from($(id).selectedOptions).map(o=>o.value).filter(Boolean)}async function patchPerson(id,body){return api('/rest/v1/family_members?external_id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)})}async function saveRelationships(id){const p=byKey.get(key(id));if(!p)return;const st=$('editStatus'),btn=document.querySelector('#relationshipEditor .save');let parentIds=selectedValues('relParents'),spouseIds=selectedValues('relSpouses'),generation=Math.max(1,Math.min(99,Number($('relGeneration').value||1)));if(parentIds.length>2){st.textContent='❌ Maximum 2 parents. Please choose at most two.';return}parentIds=[...new Set(parentIds.map(key).map(k=>byKey.get(k)?.external_id).filter(Boolean))];spouseIds=[...new Set(spouseIds.map(key).map(k=>byKey.get(k)?.external_id).filter(Boolean))];btn.disabled=true;st.textContent='Saving relationships…';try{const oldSpouses=spouses(p).map(x=>x.external_id);await patchPerson(id,{parent_ids:parentIds,spouse_ids:spouseIds,generation});for(const sid of [...new Set([...oldSpouses,...spouseIds])]){if(key(sid)===key(id))continue;const sp=byKey.get(key(sid));if(!sp)continue;let cur=spouses(sp).map(x=>x.external_id).filter(x=>key(x)!==key(id));if(spouseIds.some(x=>key(x)===key(sid)))cur.push(id);cur=[...new Set(cur)];await patchPerson(sp.external_id,{spouse_ids:cur})}st.textContent='✅ Relationships saved. Reloading…';await load();openFocus(id)}catch(e){st.textContent='❌ '+(e.message||String(e))}finally{btn.disabled=false}}
async function load(){try{status.textContent='🔄 Connecting to family database…';const d=await api('/rest/v1/family_members?select=*&order=full_name.asc');if(!Array.isArray(d))throw Error('Unexpected database response.');people=d;byKey=new Map(people.map(p=>[key(p.external_id),p]));let links=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active · '+roots().length+' family roots';render();const s=document.createElement('script');s.src='gedcom-relationships.js?v=20260909-final6';s.onload=()=>{GP=window.GEDCOM_PARENTS||{};GS=window.GEDCOM_SPOUSES||{};render();if(currentFocus)openFocus(currentFocus.external_id)};s.onerror=()=>{};document.head.appendChild(s)}catch(e){status.textContent='❌ '+(e.message||String(e));if(/No login session|sign in/i.test(e.message))setTimeout(()=>location.replace('login.html?v=20260909-final6'),1200)}}async function logout(){localStorage.removeItem(SK);location.replace('login.html?v=20260909-final6')}window.setView=setView;window.openFocus=openFocus;window.closeFocus=closeFocus;window.showRelationshipEditor=showRelationshipEditor;window.saveRelationships=saveRelationships;window.logout=logout;function expandAll(){render()}function collapseAll(){render()}window.expandAll=expandAll;window.collapseAll=collapseAll;$('search').addEventListener('input',render);load()})()</script></body></html>
