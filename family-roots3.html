<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><style>
:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#2f2418;--muted:#756a5e;--line:#dfd2bf;--accent:#6b4f2f;--gold:#c99d3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:14px}.bar,.wrap{max-width:1250px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:var(--accent)!important;color:#fff!important}.wrap{padding:16px}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:12px}.status{margin-top:9px;color:var(--muted);white-space:pre-wrap}.empty{text-align:center;padding:30px;color:var(--muted)}
/* Family-unit tree */.family-tree{overflow:auto;padding:12px 4px 30px}.family-root{min-width:900px;text-align:center}.couple{display:inline-flex;align-items:stretch;justify-content:center;gap:0;position:relative}.person-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:180px;max-width:230px;text-align:left;cursor:pointer;box-shadow:0 2px 8px #4d35140b}.person-card:hover{border-color:var(--gold);transform:translateY(-1px)}.person-card .name{font-weight:800;font-size:15px}.person-card .meta{font-size:12px;color:var(--muted);margin-top:4px}.couple-line{width:30px;border-top:3px solid var(--gold);align-self:center}.family-connector{width:70%;max-width:760px;margin:0 auto;height:30px;border-left:2px solid var(--gold);border-right:2px solid var(--gold);border-top:2px solid var(--gold)}.children-row{display:flex;justify-content:center;gap:22px;position:relative}.child-family{min-width:200px;max-width:280px;position:relative}.child-family:before{content:"";position:absolute;top:-30px;left:50%;height:30px;border-left:2px solid var(--gold)}.child-family .mini-family{background:#fffdf9;border:1px solid var(--line);border-radius:14px;padding:10px}.mini-couple{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.mini-person{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:700}.mini-person:hover{border-color:var(--gold)}.mini-children{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:grid;gap:7px}.mini-child{padding:8px;border-radius:9px;background:#f9f5ee;border:1px solid #eadfce;cursor:pointer;text-align:left}.mini-child:hover{border-color:var(--gold)}.tree-note{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.list-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}.list-card:hover{border-color:var(--gold)}
/* Person focus */.overlay{display:none;position:fixed;inset:0;background:#24170bcc;z-index:20;overflow:auto;padding:18px}.overlay.open{display:block}.focus{max-width:1180px;margin:0 auto;background:var(--paper);border-radius:20px;min-height:calc(100vh - 36px);padding:18px}.focus-head{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.focus-head h2{margin:0;font-size:24px}.focus-head .close{margin-left:auto}.details{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:16px;margin-bottom:18px}.profile-main{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--line);margin-bottom:8px}.detail-row{padding:6px 0;border-bottom:1px dashed #eadfce}.detail-row b{display:inline-block;min-width:105px}.focus-tree{display:grid;grid-template-columns:1fr;gap:14px}.generation{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.generation h3{margin:0 0 10px;font-size:16px}.gen-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.focus-person{min-width:150px;max-width:220px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;cursor:pointer}.focus-person.current{border:2px solid var(--gold);background:#fff8e8}.focus-person .name{font-weight:800}.focus-person .meta{font-size:11px;color:var(--muted)}.relation-arrow{text-align:center;color:var(--gold);font-size:22px}.relationship-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.relbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.relbox h4{margin:0 0 8px}.rel-link{display:block;width:100%;text-align:left;background:#faf6ef;border:1px solid #eadfce;border-radius:9px;padding:8px;margin:5px 0;cursor:pointer}.rel-link:hover{border-color:var(--gold)}
@media(max-width:700px){.top{padding:10px}.wrap{padding:10px}.family-root{min-width:760px}.children-row{gap:12px}.details{grid-template-columns:1fr}.overlay{padding:8px}.focus{padding:12px}.relationship-columns{grid-template-columns:1fr}}

<main class="wrap"><section class="panel"><div><button id="treeBtn" class="btn active" onclick="setView('tree')">🌳 Family Tree</button> <button id="listBtn" class="btn" onclick="setView('list')">📋 All People</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main>

<script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SK='mfr_session_v1';let people=[],byKey=new Map,view='tree',GP={},GS={};const $=id=>document.getElementById(id),status=$('status');const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/);return m?m[0]:s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(arr);if(typeof v==='object')return Object.values(v).flatMap(arr);try{const j=JSON.parse(v);if(j!==v)return arr(j)}catch(e){}return String(v).split(/[,;|\s]+/).filter(Boolean)};const session=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}};async function fetchJSON(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{...opt,signal:c.signal});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){d=text}if(!r.ok)throw Error('HTTP '+r.status+(d&&d.message?': '+d.message:''));return d}finally{clearTimeout(t)}}async function api(path){const s=session();if(!s||!s.access_token)throw Error('No login session. Please sign in again.');return fetchJSON(U+path,{headers:{apikey:K,Authorization:'Bearer '+s.access_token,Accept:'application/json'}})}function rel(p,f,g){const a=arr(p[f]).map(key).map(k=>byKey.get(k)).filter(Boolean);if(a.length)return a;const x=g[p.external_id]||g[key(p.external_id)]||g['@'+key(p.external_id)+'@']||[];return arr(x).map(key).map(k=>byKey.get(k)).filter(Boolean)}const parents=p=>rel(p,'parent_ids',GP),spouses=p=>rel(p,'spouse_ids',GS),children=p=>people.filter(c=>parents(c).some(x=>key(x.external_id)===key(p.external_id)));
function couple(p){const ss=spouses(p);return [p,...ss.filter(x=>key(x.external_id)!==key(p.external_id))]}function personCard(p,cls='person-card'){return '<div class="'+cls+'" onclick="openFocus(\''+esc(p.external_id)+'\')"><div>👤</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+(p.place?' · 📍 '+esc(p.place):'')+'</div></div>'}function coupleHtml(p,mini=false){const cs=couple(p);if(mini)return '<div class="mini-couple">'+cs.map(x=>'<div class="mini-person" onclick="openFocus(\''+esc(x.external_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</div>').join('<span>💍</span>')+'</div>';return '<div class="couple">'+personCard(cs[0])+(cs[1]?'<div class="couple-line"></div>'+personCard(cs[1]):'')+'</div>'}
function familyUnit(p,seen=new Set){const k=key(p.external_id);if(seen.has(k))return'';const n=new Set(seen);n.add(k);const ss=couple(p).filter(x=>key(x.external_id)!==k), kids=[];children(p).forEach(ch=>{if(!kids.some(x=>key(x.external_id)===key(ch.external_id)))kids.push(ch)});ss.forEach(sp=>children(sp).forEach(ch=>{if(!kids.some(x=>key(x.external_id)===key(ch.external_id)))kids.push(ch)}));return '<div class="family-root">'+coupleHtml(p)+(kids.length?'<div class="family-connector"></div><div class="children-row">'+kids.map(ch=>'<div class="child-family"><div class="mini-family">'+coupleHtml(ch,true)+(children(ch).length?'<div class="mini-children">'+children(ch).map(gc=>'<div class="mini-child" onclick="openFocus(\''+esc(gc.external_id)+'\')">👤 '+esc(gc.full_name||'Unnamed')+(spouses(gc).length?' · 💍':'')+'</div>').join('')+'</div>':'')+'</div></div>').join('')+'</div>':'')+'</div>'}
function roots(){const hasParents=new Set();people.forEach(p=>{if(parents(p).length)hasParents.add(key(p.external_id))});const out=[];people.filter(p=>!hasParents.has(key(p.external_id))).forEach(p=>{const k=key(p.external_id),ss=spouses(p).map(x=>key(x.external_id));if(!out.some(x=>key(x.external_id)===k||ss.includes(key(x.external_id))))out.push(p)});return out}
function render(){const q=$('search').value.trim().toLowerCase(),c=$('content');$('treeBtn').classList.toggle('active',view==='tree');$('listBtn').classList.toggle('active',view==='list');if(view==='list'||q){const a=people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q));c.innerHTML='<div class="card">'+(a.length?'<div class="grid">'+a.map(p=>'<div class="list-card" onclick="openFocus(\''+esc(p.external_id)+'\')"><div class="name">👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+(p.place?' · 📍 '+esc(p.place):'')+'</div></div>').join('')+'</div>':'<div class="empty">No family member found.</div>')+'</div>'}else c.innerHTML='<div class="card"><div class="tree-note">Click any person to see their details, parents, ancestors, spouse and children.</div><div class="family-tree">'+roots().map(p=>familyUnit(p)).join('')+'</div></div>'}
function focusPerson(p,depth=0,dir='up',seen=new Set()){if(!p||depth<0)return'';const k=key(p.external_id);if(seen.has(k))return'';const n=new Set(seen);n.add(k);return '<div class="focus-person '+(depth===0?'current':'')+'" onclick="openFocus(\''+esc(p.external_id)+'\')"><div class="name">👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+(p.birth_date?'🎂 '+esc(p.birth_date):'')+'</div></div>'}
function ancestorLevels(p,max=4){let levels=[],cur=[p],seen=new Set([key(p.external_id)]);for(let i=1;i<=max;i++){const next=[];cur.forEach(x=>parents(x).forEach(y=>{const k=key(y.external_id);if(!seen.has(k)){seen.add(k);next.push(y)}}));if(!next.length)break;levels.push(next);cur=next}return levels}
function descendantLevels(p,max=4){let levels=[],cur=[p],seen=new Set([key(p.external_id)]);for(let i=1;i<=max;i++){const next=[];cur.forEach(x=>children(x).forEach(y=>{const k=key(y.external_id);if(!seen.has(k)){seen.add(k);next.push(y)}}));if(!next.length)break;levels.push(next);cur=next}return levels}
function relationList(items){return items.length?items.map(x=>'<button class="rel-link" onclick="openFocus(\''+esc(x.external_id)+'\')">👤 '+esc(x.full_name||'Unnamed')+'</button>').join(''):'<div class="meta">—</div>'}
function openFocus(id){const p=byKey.get(key(id));if(!p)return;const anc=ancestorLevels(p),des=descendantLevels(p),ss=spouses(p),ps=parents(p),cs=children(p);$('focusTitle').textContent=p.full_name||'Unnamed';let photo=p.photo_url?'<img class="avatar" src="'+esc(p.photo_url)+'" alt="">':'<div style="font-size:58px;margin-bottom:8px">👤</div>';$('focusBody').innerHTML='<div class="details"><div class="profile-main">'+photo+'<h3 style="margin:0 0 8px">'+esc(p.full_name||'Unnamed')+'</h3><div class="detail-row"><b>Birth</b> '+esc(p.birth_date||'—')+'</div><div class="detail-row"><b>Place</b> '+esc(p.place||'—')+'</div><div class="detail-row"><b>Occupation</b> '+esc(p.occupation||'—')+'</div>'+(p.bio?'<div class="detail-row"><b>About</b> '+esc(p.bio)+'</div>':'')+'</div><div class="relationship-columns"><div class="relbox"><h4>👨‍👩‍👧 Parents</h4>'+relationList(ps)+'</div><div class="relbox"><h4>💍 Spouse</h4>'+relationList(ss)+'</div><div class="relbox"><h4>👶 Children</h4>'+relationList(cs)+'</div><div class="relbox"><h4>🆔 Record</h4><div class="meta">ID: '+esc(p.external_id||'—')+'<br>Generation: '+esc(p.generation||'—')+'</div></div></div></div><div class="focus-tree">'+(anc.length?'<div class="generation"><h3>⬆️ Previous generations — Ancestors</h3>'+anc.map((lev,i)=>'<div class="meta" style="margin:8px 0">Generation '+(i+1)+'</div><div class="gen-row">'+lev.map(x=>focusPerson(x,i+1,'up')).join('')+'</div>').join('<div class="relation-arrow">↑</div>')+'</div>':'')+'<div class="generation"><h3>⭐ Selected person</h3><div class="gen-row">'+focusPerson(p)+'</div></div>'+(des.length?'<div class="generation"><h3>⬇️ Next generations — Descendants</h3>'+des.map((lev,i)=>'<div class="meta" style="margin:8px 0">Generation '+(i+1)+'</div><div class="gen-row">'+lev.map(x=>focusPerson(x,i+1,'down')).join('')+'</div>').join('<div class="relation-arrow">↓</div>')+'</div>':'')+'</div>';$('overlay').classList.add('open');document.body.style.overflow='hidden'}function closeFocus(){$('overlay').classList.remove('open');document.body.style.overflow=''}function setView(v){view=v;render()}function expandAll(){render()}function collapseAll(){render()}async function load(){try{status.textContent='🔄 Connecting to family database…';const d=await api('/rest/v1/family_members?select=*&order=full_name.asc');if(!Array.isArray(d))throw Error('Unexpected database response.');people=d;byKey=new Map(people.map(p=>[key(p.external_id),p]));status.textContent='✅ '+people.length+' family members loaded · loading relationships…';render();const s=document.createElement('script');s.src='gedcom-relationships.js?v=20260909-final6';s.onload=()=>{GP=window.GEDCOM_PARENTS||{};GS=window.GEDCOM_SPOUSES||{};let links=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active · '+roots().length+' family roots';render()};s.onerror=()=>{status.textContent='⚠️ '+people.length+' family members loaded, but relationship file could not be loaded.'};document.head.appendChild(s)}catch(e){status.textContent='❌ '+(e.message||String(e));if(/No login session|sign in/i.test(e.message))setTimeout(()=>location.replace('login.html?v=20260909-final6'),1200)}}async function logout(){localStorage.removeItem(SK);location.replace('login.html?v=20260909-final6')}window.setView=setView;window.expandAll=expandAll;window.collapseAll=collapseAll;window.openFocus=openFocus;window.closeFocus=closeFocus;$('search').addEventListener('input',render);load()})();</script></body></html>
