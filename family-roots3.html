<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><script src="gedcom-relationships.js"></script><style>body{margin:0;background:#f7f1e7;color:#2f2418;font:15px system-ui}.top{background:#4b321f;color:#fff;padding:14px}.bar,.wrap{max-width:1200px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;margin-right:auto}.btn{border:1px solid #d8ccb9;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.top .btn{background:#ffffff18;color:#fff;border-color:#ffffff35}.active{background:#6b4f2f!important;color:#fff!important}.wrap{padding:16px}.panel,.card{background:#fffdf9;border:1px solid #e2d7c6;border-radius:16px;padding:16px;margin-bottom:14px}.search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8ccb9;border-radius:11px}.status{margin-top:8px;color:#756a5e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person{background:#fff;border:1px solid #e2d7c6;border-radius:14px;padding:12px;cursor:pointer}.name{font-weight:800}.meta{font-size:12px;color:#756a5e}.branch{border-left:3px solid #c99d3b;padding-left:14px;margin:10px 0}.children{margin-left:20px;border-left:2px dashed #e2d7c6;padding-left:12px}.modal{display:none;position:fixed;inset:0;background:#24170b99;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{background:#fffdf9;padding:22px;border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px;border:1px solid #d8ccb9;border-radius:10px;font:inherit}@media(max-width:650px){.person{width:auto}.wrap{padding:10px}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots</div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><div><button id="treeBtn" class="btn active" onclick="setView('tree')">🌳 Tree View</button> <button id="listBtn" class="btn" onclick="setView('list')">📋 List View</button></div><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><div id="modal" class="modal"><div class="box"><button class="btn" onclick="closeModal()">Close</button><div id="modalBody"></div></div></div><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8',SK='mfr_session_v1';let people=[],map=new Map,view='tree',open=new Set();const status=document.getElementById('status'),GP=window.GEDCOM_PARENTS||{},GS=window.GEDCOM_SPOUSES||{};const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(arr);if(typeof v==='object')return Object.values(v).flatMap(arr);try{let j=JSON.parse(v);if(j!==v)return arr(j)}catch{}return String(v).split(/[,;|\s]+/).filter(Boolean)};const session=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}};const saveSession=s=>localStorage.setItem(SK,JSON.stringify(s));async function timedFetch(url,opt={}){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{return await fetch(url,{...opt,signal:ctrl.signal})}finally{clearTimeout(timer)}}async function refresh(){let s=session();if(!s?.refresh_token)throw Error('Login session expired. Please sign in again.');let r=await timedFetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});let d=await r.json().catch(()=>null);if(!r.ok||!d?.access_token)throw Error('Session refresh failed.');saveSession({...s,...d});return d.access_token}async function api(path){let s=session();if(!s?.access_token)throw Error('No login session. Please sign in again.');let token=s.access_token,r=await timedFetch(U+path,{headers:{apikey:K,Authorization:'Bearer '+token}});if(r.status===401){token=await refresh();r=await timedFetch(U+path,{headers:{apikey:K,Authorization:'Bearer '+token}})}let text=await r.text();let d;try{d=JSON.parse(text)}catch{d=null}if(!r.ok)throw Error(d?.message||d?.hint||d?.error_description||('Database request failed: HTTP '+r.status));return d}function rel(p,field,ged){let a=arr(p[field]).map(key).map(k=>map.get(k)).filter(Boolean);if(a.length)return a;let g=ged[p.external_id]||ged[key(p.external_id)]||ged['@'+key(p.external_id)+'@']||[];return arr(g).map(key).map(k=>map.get(k)).filter(Boolean)}const parents=p=>rel(p,'parent_ids',GP),spouses=p=>rel(p,'spouse_ids',GS);const children=p=>people.filter(c=>parents(c).some(x=>key(x.external_id)===key(p.external_id)));function roots(){let child=new Set;people.forEach(p=>parents(p).forEach(()=>child.add(key(p.external_id)));return people.filter(p=>!child.has(key(p.external_id))).filter((p,i,a)=>!a.slice(0,i).some(x=>key(x.external_id)===key(p.external_id)||spouses(x).some(s=>key(s.external_id)===key(p.external_id))))}function person(p){return '<div class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div>👤</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div>'}function branch(p,seen=new Set){let k=key(p.external_id);if(seen.has(k))return'';let n=new Set(seen);n.add(k);let kids=children(p),sp=spouses(p),openNow=open.has(k);return '<div class="branch"><button class="btn" onclick="event.stopPropagation();toggle(\''+esc(p.external_id)+'\')">'+(openNow?'−':'＋')+'</button> '+person(p)+(sp.length?'<div class="meta">💍 '+sp.map(x=>esc(x.full_name)).join(' · ')+'</div>':'')+(openNow&&kids.length?'<div class="children">'+kids.map(x=>branch(x,n)).join('')+'</div>':'')+'</div>'}function render(){let q=document.getElementById('search').value.trim().toLowerCase(),c=document.getElementById('content');document.getElementById('treeBtn').classList.toggle('active',view==='tree');document.getElementById('listBtn').classList.toggle('active',view==='list');if(view==='list'||q){let a=people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q));c.innerHTML='<div class="card">'+(a.length?'<div class="grid">'+a.map(person).join('')+'</div>':'No family member found.')+'</div>'}else c.innerHTML='<div class="card">'+roots().map(branch).join('')+'</div>'}function setView(v){view=v;render()}function toggle(id){let k=key(id);open.has(k)?open.delete(k):open.add(k);render()}function expandAll(){people.forEach(p=>open.add(key(p.external_id)));render()}function collapseAll(){open.clear();render()}async function load(){status.textContent='🔄 Connecting to family database…';try{let d=await api('/rest/v1/family_members?select=*&order=full_name.asc');people=Array.isArray(d)?d:[];map=new Map(people.map(p=>[key(p.external_id),p]));let links=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active · '+roots().length+' family roots';render()}catch(e){status.textContent='❌ '+e.message;if(/login session|sign in/i.test(e.message))setTimeout(()=>location.replace('login.html?v=20260909-final-login'),1200)}}function profile(id){let p=map.get(key(id));if(!p)return;document.getElementById('modalBody').innerHTML='<h2>'+esc(p.full_name||'Unnamed')+'</h2><p class="meta">Parents: '+(parents(p).map(x=>esc(x.full_name)).join(', ')||'—')+'<br>Spouse: '+(spouses(p).map(x=>esc(x.full_name)).join(', ')||'—')+'<br>Children: '+(children(p).map(x=>esc(x.full_name)).join(', ')||'—')+'</p><label>Full name</label><input id="en" value="'+esc(p.full_name)+'"><label>Birth date</label><input id="eb" value="'+esc(p.birth_date)+'"><label>Place</label><input id="ep" value="'+esc(p.place)+'"><label>Occupation</label><input id="eo" value="'+esc(p.occupation)+'"><label>Bio</label><textarea id="ex">'+esc(p.bio)+'</textarea><button class="btn active" onclick="saveEdit(\''+esc(id)+'\')">💾 Save Edit</button>';document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}async function saveEdit(id){try{await api('/rest/v1/family_members?external_id=eq.'+encodeURIComponent(id));let s=session();let r=await timedFetch(U+'/rest/v1/family_members?external_id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({full_name:document.getElementById('en').value,birth_date:document.getElementById('eb').value||null,place:document.getElementById('ep').value||null,occupation:document.getElementById('eo').value||null,bio:document.getElementById('ex').value||null})});if(!r.ok)throw Error('Save failed: HTTP '+r.status);closeModal();load()}catch(e){alert(e.message)}}async function logout(){localStorage.removeItem(SK);location.replace('login.html?v=20260909-final-login')}window.setView=setView;window.toggle=toggle;window.expandAll=expandAll;window.collapseAll=collapseAll;window.profile=profile;window.closeModal=closeModal;window.saveEdit=saveEdit;window.logout=logout;document.getElementById('search').addEventListener('input',render);load()})()</script></body></html>
