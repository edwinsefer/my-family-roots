<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;background:#f7f1e7;color:#2f2418;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}.box{width:min(460px,calc(100% - 32px));background:#fffdf9;border:1px solid #e2d7c6;border-radius:20px;padding:28px;box-shadow:0 12px 40px #4d35141a}h1{margin:0 0 4px;font-size:26px}.sub{color:#756a5e;margin-bottom:22px}label{display:block;font-size:13px;color:#756a5e;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8ccb9;border-radius:11px;font:inherit;background:#fff}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:#6b4f2f;color:#fff;font:700 15px system-ui;cursor:pointer}.status{min-height:22px;margin-top:12px;color:#756a5e;font-size:13px}.brand{font-size:20px;font-weight:800;margin-bottom:3px}</style></head><body><main class="box"><div class="brand">🌳 My Family Roots</div><h1>🔐 Family Login</h1><div class="sub">Keelapavoor Family Heritage</div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="btn" type="button">🔑 Sign In</button><div id="status" class="status"></div></main><script>(()=>{const SUPABASE_URL='https://umbhqintywwsyduzrtai.supabase.co',SUPABASE_KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),go=()=>location.replace('family-tree-final.html?v=20260908-auth2');async function login(){const emailEl=document.getElementById('email'),passEl=document.getElementById('password'),statusEl=document.getElementById('status'),btn=document.getElementById('btn');const email=emailEl.value.trim(),password=passEl.value;if(!email||!password){statusEl.textContent='❌ Please enter email and password.';return}btn.disabled=true;btn.textContent='Signing in…';statusEl.textContent='Connecting to family database…';try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;statusEl.textContent='✅ Login successful. Opening Family Roots…';const check=await supabaseClient.auth.getSession();if(!check.data?.session)throw new Error('Login succeeded but the session could not be restored. Please try again.');await new Promise(r=>setTimeout(r,400));go()}catch(e){statusEl.textContent='❌ '+(e?.message||'Sign in failed.');btn.disabled=false;btn.textContent='🔑 Sign In'}}document.getElementById('btn').addEventListener('click',login);document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});supabaseClient.auth.getSession().then(({data})=>{if(data?.session)go()})})()</script></body></html>
