<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;background:#f7f1e7;color:#2f2418;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}.box{width:min(460px,calc(100% - 32px));background:#fffdf9;border:1px solid #e2d7c6;border-radius:20px;padding:28px;box-shadow:0 12px 40px #4d35141a}h1{margin:0 0 4px;font-size:26px}.sub{color:#756a5e;margin-bottom:22px}label{display:block;font-size:13px;color:#756a5e;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8ccb9;border-radius:11px;font:inherit;background:#fff}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:#6b4f2f;color:#fff;font:700 15px system-ui;cursor:pointer}.status{min-height:22px;margin-top:12px;color:#756a5e;font-size:13px}.brand{font-size:20px;font-weight:800;margin-bottom:3px}</style></head><body><main class="box"><div class="brand">🌳 My Family Roots</div><h1>🔐 Family Login</h1><div class="sub">Keelapavoor Family Heritage</div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="btn" onclick="login()">🔑 Sign In</button><div id="status" class="status"></div></main><script>const URL='https://umbhqintywwsyduzrtai.supabase.co',KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K';const client=window.supabase.createClient(URL,KEY);async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,s=document.getElementById('status'),b=document.getElementById('btn');if(!email||!password){s.textContent='❌ Please enter email and password.';return}b.disabled=true;b.textContent='Signing in…';s.textContent='';try{const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;s.textContent='✅ Signed in. Opening family tree…';location.replace('family-tree-live.html?v=20260908-auth')}catch(e){s.textContent='❌ '+(e.message||'Sign in failed.');b.disabled=false;b.textContent='🔑 Sign In'}}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});client.auth.getSession().then(r=>{if(r.data?.session)location.replace('family-tree-live.html?v=20260908-auth')})</script></body></html>
