<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;background:#f7f1e7;color:#2f2418;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}.box{width:min(460px,calc(100% - 32px));background:#fffdf9;border:1px solid #e2d7c6;border-radius:20px;padding:28px;box-shadow:0 12px 40px #4d35141a}h1{margin:0 0 4px;font-size:26px}.sub{color:#756a5e;margin-bottom:22px}label{display:block;font-size:13px;color:#756a5e;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8ccb9;border-radius:11px;font:inherit;background:#fff}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:#6b4f2f;color:#fff;font:700 15px system-ui;cursor:pointer}.status{min-height:22px;margin-top:12px;color:#756a5e;font-size:13px}.brand{font-size:20px;font-weight:800;margin-bottom:3px}</style></head><body><main class="box"><div class="brand">🌳 My Family Roots</div><h1>🔐 Family Login</h1><div class="sub">Keelapavoor Family Heritage</div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="btn" type="button">🔑 Sign In</button><div id="status" class="status"></div></main><script>(()=>{const SUPABASE_URL='https://umbhqintywwsyduzrtai.supabase.co',SUPABASE_KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K';let supabaseClient;const emailEl=document.getElementById('email'),passEl=document.getElementById('password'),statusEl=document.getElementById('status'),btn=document.getElementById('btn');function go(){location.replace('family-tree-final.html?v=20260908-login5')}function init(){if(!window.supabase||typeof window.supabase.createClient!=='function'){statusEl.textContent='❌ Supabase library did not load. Please refresh the page.';return false}try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return true}catch(e){statusEl.textContent='❌ Login service could not start: '+(e?.message||e);return false}}async function login(){const email=emailEl.value.trim(),password=passEl.value;if(!email||!password){statusEl.textContent='❌ Please enter email and password.';return}if(!supabaseClient&&!init())return;btn.disabled=true;btn.textContent='Signing in…';statusEl.textContent='🔄 Checking your login…';try{const result=await Promise.race([supabaseClient.auth.signInWithPassword({email,password}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Login request timed out. Please check the internet connection.')),15000))]);if(result.error)throw result.error;if(!result.data?.session)throw new Error('No login session was returned.');statusEl.textContent='✅ Signed in. Opening family tree…';go()}catch(e){statusEl.textContent='❌ '+(e?.message||'Sign in failed.');btn.disabled=false;btn.textContent='🔑 Sign In'}}btn.addEventListener('click',login);[emailEl,passEl].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')login()}));init()})()</script></body></html>
