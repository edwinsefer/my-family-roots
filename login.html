<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots — Login</title><style>body{margin:0;min-height:100vh;background:#f7f1e7;color:#2f2418;font:15px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}.box{width:min(460px,calc(100% - 32px));background:#fffdf9;border:1px solid #e2d7c6;border-radius:20px;padding:28px;box-shadow:0 12px 40px #4d35141a}h1{margin:0 0 4px;font-size:26px}.sub{color:#756a5e;margin-bottom:22px}label{display:block;font-size:13px;color:#756a5e;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8ccb9;border-radius:11px;font:inherit;background:#fff}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:#6b4f2f;color:#fff;font:700 15px system-ui;cursor:pointer}.status{min-height:22px;margin-top:12px;color:#756a5e;font-size:13px;white-space:pre-wrap}.brand{font-size:20px;font-weight:800;margin-bottom:3px}</style></head><body><main class="box"><div class="brand">🌳 My Family Roots</div><h1>🔐 Family Login</h1><div class="sub">Keelapavoor Family Heritage</div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="btn" type="button">🔑 Sign In</button><div id="status" class="status">Ready.</div></main><script>(()=>{const SUPABASE_URL='https://umbhqintywwsyduzrtai.supabase.co',SUPABASE_KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8K',SESSION_KEY='mfr_session_v1',statusEl=document.getElementById('status'),btn=document.getElementById('btn');const go=()=>location.replace('family-roots.html?v=20260908-stable1');const saved=()=>{try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}};const show=s=>statusEl.textContent=s;async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){show('❌ Please enter email and password.');return}btn.disabled=true;btn.textContent='Signing in…';show('Connecting to family database…');try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.error_description||data?.msg||data?.message||'Sign in failed.');if(!data?.access_token||!data?.refresh_token)throw new Error('Login succeeded but no session was returned.');localStorage.setItem(SESSION_KEY,JSON.stringify({access_token:data.access_token,refresh_token:data.refresh_token,expires_in:data.expires_in||3600,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600),user:data.user||null}));show('✅ Login successful. Opening Family Roots…');setTimeout(go,250)}catch(e){show('❌ '+(e?.message||'Unable to sign in.'));btn.disabled=false;btn.textContent='🔑 Sign In'}}const s=saved();if(s?.access_token){show('Session found. Opening Family Roots…');setTimeout(go,150)}btn.addEventListener('click',login);document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)login()})})()</script></body></html>
