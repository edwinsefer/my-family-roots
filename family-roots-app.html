<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><style>body{margin:0;background:#f7f1e7;color:#2f2418;font:15px system-ui}.top{background:#6b4f2f;color:#fff;padding:18px;font-size:22px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:16px}.panel{background:#fffdf9;border:1px solid #dfd2bf;border-radius:18px;padding:18px;margin-bottom:14px}.input,.search{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #d8ccb9;border-radius:11px;font:inherit}.btn{padding:11px 15px;border:0;border-radius:10px;background:#6b4f2f;color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;background:#efe6d8;color:#5c4934}.tab.active{background:#6b4f2f;color:#fff}.status{margin:10px 0;color:#756a5e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person{background:#fff;border:1px solid #dfd2bf;border-radius:14px;padding:12px;cursor:pointer}.person:hover{box-shadow:0 4px 14px #0001}.name{font-weight:800}.meta{font-size:12px;color:#756a5e;margin-top:4px}.family{text-align:center;margin:0 auto 40px}.couple{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}.couple .person{min-width:190px}.kids{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.kid{min-width:170px}.hidden{display:none}.profileHead{display:flex;gap:14px;align-items:center}.avatar{width:84px;height:84px;border-radius:50%;background:#eadfce;display:grid;place-items:center;font-size:34px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.sectionTitle{font-weight:800;margin:18px 0 8px}.relgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.back{background:#efe6d8;color:#5c4934;margin-bottom:12px}.empty{text-align:center;padding:30px;color:#756a5e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.editbox{background:#f4ecdf;border-radius:14px;padding:14px}.editbox label{display:block;font-weight:700;margin-top:8px}.photoPreview{width:110px;height:110px;border-radius:14px;object-fit:cover;background:#eadfce;display:block;margin:8px 0}</style></head><body><div class="top">🌳 My Family Roots <small style="font-size:12px;display:block">Keelapavoor Family Heritage</small></div><main class="wrap"><section id="login" class="panel"><h2>🔐 Family Login</h2><input id="email" class="input" type="email" placeholder="Email" autocomplete="username"><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="signin">🔑 Sign In</button><div id="loginStatus" class="status">Ready.</div></section><section id="app" class="hidden"><section class="panel"><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status"></div><div class="tabs"><button class="btn tab active" id="treeTab">🌳 Tree</button><button class="btn tab" id="listTab">📋 List</button></div></section><div id="content"></div></section></main><script src="gedcom-relationships.js?v=20260911-1"></script><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8';let people=[],map=new Map(),P={},S={},view='tree',token='';const $=id=>document.getElementById(id),key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s},arr=v=>Array.isArray(v)?v:(v==null||v===''?[]:String(v).split(/[,;|\s]+/).filter(Boolean)),normRel=g=>{let o={};Object.entries(g||{}).forEach(([k,v])=>o[key(k)]=arr(v).map(key));return o},parents=p=>(P[key(p.gedcom_id)]||[]).map(id=>map.get(id)).filter(Boolean),spouses=p=>(S[key(p.gedcom_id)]||[]).map(id=>map.get(id)).filter(Boolean),children=p=>people.filter(c=>parents(c).some(x=>key(x.gedcom_id)===key(p.gedcom_id)));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(p,small=false){let pic=p.photo_url?'<img src="'+esc(p.photo_url)+'" style="width:42px;height:42px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:7px">':'';return '<div class="person '+(small?'kid':'')+'" data-id="'+esc(p.gedcom_id)+'"><div class="name">'+pic+'👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.gedcom_id||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div>'}function roots(){let childIds=new Set();people.forEach(p=>{if(parents(p).length)childIds.add(key(p.gedcom_id))});let out=[];for(let p of people){let id=key(p.gedcom_id);if(childIds.has(id))continue;let ss=spouses(p).map(x=>key(x.gedcom_id));if(!out.some(r=>key(r.gedcom_id)===id||ss.includes(key(r.gedcom_id))))out.push(p)}return out}function unit(p){let ps=spouses(p),ks=children(p).slice();ps.forEach(s=>children(s).forEach(c=>{if(!ks.some(x=>key(x.gedcom_id)===key(c.gedcom_id)))ks.push(c)}));return '<section class="family"><div class="couple">'+card(p)+ps.map(s=>'<span>💍</span>'+card(s)).join('')+'</div>'+(ks.length?'<div class="kids">'+ks.map(x=>card(x,true)).join('')+'</div>':'')+'</section>'}function profile(p){let ps=spouses(p),pa=parents(p),ch=children(p),photo=p.photo_url?'<img src="'+esc(p.photo_url)+'">':'👤';$('content').innerHTML='<section class="panel"><button class="btn back" id="back">← Back</button><div class="profileHead"><div class="avatar">'+photo+'</div><div><h2 style="margin:0">'+esc(p.full_name||'Unnamed')+'</h2><div class="status">'+esc(p.gedcom_id||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div></div><div class="actions"><button class="btn" id="editBtn">✏️ Edit Profile</button></div><div id="editArea"></div><div class="sectionTitle">👨‍👩‍👧 Parents</div><div class="relgrid">'+(pa.length?pa.map(x=>card(x,true)).join(''):'<div class="empty">No parent relationship recorded.</div>')+'</div><div class="sectionTitle">💍 Spouse</div><div class="relgrid">'+(ps.length?ps.map(x=>card(x,true)).join(''):'<div class="empty">No spouse relationship recorded.</div>')+'</div><div class="sectionTitle">👶 Children</div><div class="relgrid">'+(ch.length?ch.map(x=>card(x,true)).join(''):'<div class="empty">No children recorded.</div>')+'</div></section>';bindCards();$('back').onclick=()=>render();$('editBtn').onclick=()=>editForm(p)}function editForm(p){let area=$('editArea');area.innerHTML='<div class="editbox"><h3 style="margin-top:0">✏️ Edit Profile</h3><label>Name</label><input id="eName" class="input" value="'+esc(p.full_name||'')+'"><label>Birth date</label><input id="eBirth" class="input" value="'+esc(p.birth_date||'')+'"><label>Death date</label><input id="eDeath" class="input" value="'+esc(p.death_date||'')+'"><label>Bio</label><textarea id="eBio" class="input" rows="4">'+esc(p.bio||'')+'</textarea><label>Photo URL</label><input id="ePhoto" class="input" placeholder="https://…" value="'+esc(p.photo_url||'')+'"><img id="photoPreview" class="photoPreview" src="'+esc(p.photo_url||'')+'" onerror="this.style.display=\'none\'" '+(p.photo_url?'':'style="display:none"')+'><div class="actions"><button class="btn" id="saveBtn">💾 Save Changes</button><button class="btn back" id="cancelBtn">Cancel</button><button class="btn back" id="removePhotoBtn">🗑️ Remove Photo</button></div><div id="saveStatus" class="status"></div></div>';$('ePhoto').oninput=()=>{let u=$('ePhoto').value.trim(),im=$('photoPreview');im.src=u;im.style.display=u?'block':'none'};$('cancelBtn').onclick=()=>profile(p);$('removePhotoBtn').onclick=()=>{$('ePhoto').value='';$('photoPreview').style.display='none'};$('saveBtn').onclick=()=>saveProfile(p)}async function saveProfile(p){let payload={full_name:$('eName').value.trim(),birth_date:$('eBirth').value.trim()||null,death_date:$('eDeath').value.trim()||null,bio:$('eBio').value.trim()||null,photo_url:$('ePhoto').value.trim()||null};$('saveBtn').disabled=true;$('saveStatus').textContent='Saving…';try{let r=await fetch(U+'/rest/v1/family_members?external_id=eq.'+encodeURIComponent(p.gedcom_id),{method:'PATCH',headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(payload)}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Database update failed');let updated=(d&&d[0])?{...d[0],gedcom_id:d[0].external_id||d[0].gedcom_id}:null;if(updated){let i=people.findIndex(x=>key(x.gedcom_id)===key(p.gedcom_id));if(i>=0)people[i]=updated;map.set(key(updated.gedcom_id),updated);p=updated}profile(p)}catch(e){$('saveStatus').textContent='❌ '+e.message;$('saveBtn').disabled=false}}function list(){let q=$('search').value.trim().toLowerCase(),a=q?people.filter(p=>(String(p.full_name)+' '+String(p.gedcom_id)).toLowerCase().includes(q)):people;return '<section class="panel"><div class="status">'+a.length+' member'+(a.length===1?'':'s')+(q?' found':'')+'</div><div class="grid">'+a.map(card).join('')+'</div></section>'}function render(){let q=$('search').value.trim().toLowerCase();$('treeTab').classList.toggle('active',view==='tree');$('listTab').classList.toggle('active',view==='list');if(view==='list'){$('content').innerHTML=list();bindCards();return}let r=roots();if(q){let a=people.filter(p=>(String(p.full_name)+' '+String(p.gedcom_id)).toLowerCase().includes(q));$('content').innerHTML='<section class="panel"><div class="status">'+a.length+' matching member'+(a.length===1?'':'s')+'</div><div class="grid">'+a.map(card).join('')+'</div></section>';bindCards();return}$('content').innerHTML='<section class="panel"><div class="status">✅ '+people.length+' family members loaded · '+people.reduce((n,p)=>n+parents(p).length,0)+' GEDCOM parent links · '+r.length+' family roots</div>'+r.map(unit).join('')+'</section>';bindCards()}function bindCards(){document.querySelectorAll('.person').forEach(el=>el.onclick=()=>{let p=map.get(key(el.dataset.id));if(p)profile(p)})}async function loadWithToken(t){token=t;let r=await fetch(U+'/rest/v1/family_members?select=*&order=full_name.asc',{headers:{apikey:K,Authorization:'Bearer '+token,Accept:'application/json'}});let d=await r.json().catch(()=>null);if(!r.ok)throw Error('Database HTTP '+r.status+(d?.message?': '+d.message:''));people=d.map(p=>({...p,gedcom_id:p.external_id||p.gedcom_id})).filter(p=>p.gedcom_id);map=new Map(people.map(p=>[key(p.gedcom_id),p]));P=normRel(window.GEDCOM_PARENTS);S=normRel(window.GEDCOM_SPOUSES);$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}async function login(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginStatus').textContent='❌ Enter email and password.';return}$('signin').disabled=true;$('loginStatus').textContent='Connecting…';try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json().catch(()=>null);if(!r.ok||!d?.access_token)throw Error(d?.error_description||d?.msg||'Sign in failed');await loadWithToken(d.access_token);$('loginStatus').textContent=''}catch(e){$('loginStatus').textContent='❌ '+(e.message||e);$('signin').disabled=false}}$('signin').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('search').oninput=render;$('treeTab').onclick=()=>{view='tree';render()};$('listTab').onclick=()=>{view='list';render()}})()</script></body></html>
