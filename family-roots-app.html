<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><style>
:root{--bg:#f7f1e7;--paper:#fffdf9;--ink:#30251b;--muted:#756a5e;--line:#dfd2bf;--brand:#6b4f2f;--soft:#efe6d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:var(--brand);color:#fff;padding:18px 16px;box-shadow:0 2px 10px #0002}.top strong{font-size:24px;display:block}.top small{font-size:12px;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}.toolbar{position:sticky;top:0;z-index:5}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.tabs{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--brand);color:#fff;font:inherit;font-weight:750;cursor:pointer}.tab{flex:1;background:var(--soft);color:#5c4934}.tab.active{background:var(--brand);color:#fff}.status{color:var(--muted);margin-top:10px}.tree{padding:4px}.branch{margin:0 0 20px}.branchHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.branchTitle{font-weight:800;font-size:16px}.line{height:1px;background:var(--line);flex:1}.couple{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer;min-width:180px;max-width:300px}.person:hover{box-shadow:0 4px 14px #0001}.personMain{display:flex;align-items:center;gap:9px}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.avatar{width:42px;height:42px;border-radius:50%;background:#eadfce;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.kids{margin:12px 0 0;padding:12px 8px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.kid .person{min-width:0;max-width:none}.toggle{background:var(--soft);color:#5c4934;padding:5px 9px;border-radius:9px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.empty{text-align:center;padding:30px;color:var(--muted)}.profileHead{display:flex;gap:14px;align-items:center}.bigAvatar{width:92px;height:92px;border-radius:50%;background:#eadfce;display:grid;place-items:center;font-size:38px;overflow:hidden;flex:0 0 auto}.bigAvatar img{width:100%;height:100%;object-fit:cover}.back{background:var(--soft);color:#5c4934;margin-bottom:12px}.sectionTitle{font-weight:850;margin:20px 0 8px}.relgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.notice{background:#f4ecdf;border-radius:12px;padding:11px;color:#5c4934}.footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 24px}@media(max-width:600px){.top strong{font-size:21px}.wrap{padding:10px}.panel{padding:13px}.person{min-width:0;width:100%}.couple{align-items:stretch}.couple .person{max-width:none}.kids{grid-template-columns:1fr}.profileHead{align-items:flex-start}.bigAvatar{width:78px;height:78px}}
</style></head><body><header class="top"><strong>🌳 My Family Roots</strong><small>Keelapavoor Family Heritage</small></header><main class="wrap"><section class="panel toolbar"><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Loading family tree…</div><div class="tabs"><button class="btn tab active" id="treeTab">🌳 Tree</button><button class="btn tab" id="listTab">📋 List</button></div></section><div id="content"></div><div class="footer">Family view · Relationship source: GEDCOM</div></main><script src="gedcom-relationships.js?v=20260911-2"></script><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8';let people=[],map=new Map(),P={},S={},view='tree',expanded=new Set();const $=id=>document.getElementById(id);const key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const arr=v=>Array.isArray(v)?v:(v==null||v===''?[]:String(v).split(/[,;|\s]+/).filter(Boolean));const normRel=g=>{let o={};Object.entries(g||{}).forEach(([k,v])=>o[key(k)]=arr(v).map(key));return o};const parents=p=>(P[key(p.gedcom_id)]||[]).map(id=>map.get(id)).filter(Boolean);const spouses=p=>(S[key(p.gedcom_id)]||[]).map(id=>map.get(id)).filter(Boolean);const children=p=>people.filter(c=>parents(c).some(x=>key(x.gedcom_id)===key(p.gedcom_id)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(p,small=false){let photo=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'👤';return '<div class="person '+(small?'kid':'')+'" data-id="'+esc(p.gedcom_id)+'"><div class="personMain"><div class="avatar">'+photo+'</div><div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.gedcom_id||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div></div></div>'}function rootPeople(){let childIds=new Set();people.forEach(p=>{if(parents(p).length)childIds.add(key(p.gedcom_id))});let out=[];people.forEach(p=>{let id=key(p.gedcom_id),ss=spouses(p).map(x=>key(x.gedcom_id));if(!childIds.has(id)&&!out.some(r=>key(r.gedcom_id)===id||ss.includes(key(r.gedcom_id))))out.push(p)});return out}function branch(p,depth=0,seen=new Set()){let id=key(p.gedcom_id);if(seen.has(id))return '';let local=new Set(seen);local.add(id);let ps=spouses(p),ks=[];children(p).forEach(c=>{if(!ks.some(x=>key(x.gedcom_id)===key(c.gedcom_id)))ks.push(c)});ps.forEach(s=>children(s).forEach(c=>{if(!ks.some(x=>key(x.gedcom_id)===key(c.gedcom_id)))ks.push(c)}));let open=expanded.has(id),more=ks.length?' <button class="btn toggle" data-toggle="'+esc(id)+'">'+(open?'−':'+')+' '+ks.length+'</button>':'';let html='<section class="branch"><div class="branchHead"><span class="branchTitle">Generation '+(depth+1)+'</span><span class="line"></span>'+more+'</div><div class="couple">'+card(p)+ps.map(s=>'<span>💍</span>'+card(s)).join('')+'</div>';if(open&&ks.length)html+='<div class="kids">'+ks.map(c=>branch(c,depth+1,local)).join('')+'</div>';return html+'</section>'}function renderTree(){let q=$('search').value.trim().toLowerCase(),roots=rootPeople();if(q){let a=people.filter(p=>(String(p.full_name)+' '+String(p.gedcom_id)).toLowerCase().includes(q));$('content').innerHTML='<section class="panel"><div class="status">'+a.length+' matching member'+(a.length===1?'':'s')+'</div><div class="grid">'+a.map(card).join('')+'</div></section>';bindCards();return}let html='<section class="panel tree"><div class="notice">🌳 Start with a family root. Tap a person for profile. Use <b>+</b> to expand the next generation.</div>';roots.forEach(r=>html+=branch(r));$('content').innerHTML=html+'</section>';bindCards();document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=key(b.dataset.toggle);expanded.has(id)?expanded.delete(id):expanded.add(id);renderTree()})}function renderList(){let q=$('search').value.trim().toLowerCase(),a=q?people.filter(p=>(String(p.full_name)+' '+String(p.gedcom_id)).toLowerCase().includes(q)):people;$('content').innerHTML='<section class="panel"><div class="status">'+a.length+' member'+(a.length===1?'':'s')+(q?' found':'')+'</div><div class="grid">'+a.map(card).join('')+'</div></section>';bindCards()}function profile(p){let pa=parents(p),ps=spouses(p),ch=children(p),photo=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'👤';$('content').innerHTML='<section class="panel"><button class="btn back" id="back">← Back</button><div class="profileHead"><div class="bigAvatar">'+photo+'</div><div><h2 style="margin:0">'+esc(p.full_name||'Unnamed')+'</h2><div class="status">'+esc(p.gedcom_id||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+(p.death_date?' · ✝ '+esc(p.death_date):'')+'</div></div></div><div class="sectionTitle">👨‍👩‍👧 Parents</div><div class="relgrid">'+(pa.length?pa.map(x=>card(x,true)).join(''):'<div class="empty">No parent relationship recorded.</div>')+'</div><div class="sectionTitle">💍 Spouse</div><div class="relgrid">'+(ps.length?ps.map(x=>card(x,true)).join(''):'<div class="empty">No spouse relationship recorded.</div>')+'</div><div class="sectionTitle">👶 Children</div><div class="relgrid">'+(ch.length?ch.map(x=>card(x,true)).join(''):'<div class="empty">No children recorded.</div>')+'</div></section>';bindCards();$('back').onclick=()=>render()}function bindCards(){document.querySelectorAll('.person').forEach(el=>el.onclick=()=>{let p=map.get(key(el.dataset.id));if(p)profile(p)})}function render(){if(view==='list')renderList();else renderTree();$('treeTab').classList.toggle('active',view==='tree');$('listTab').classList.toggle('active',view==='list')}async function load(){try{let r=await fetch(U+'/rest/v1/family_members?select=*&order=full_name.asc',{headers:{apikey:K,Accept:'application/json'}}),d=await r.json().catch(()=>null);if(!r.ok)throw Error('Database HTTP '+r.status+(d?.message?': '+d.message:''));people=(d||[]).map(p=>({...p,gedcom_id:p.external_id||p.gedcom_id})).filter(p=>p.gedcom_id);map=new Map(people.map(p=>[key(p.gedcom_id),p]));P=normRel(window.GEDCOM_PARENTS);S=normRel(window.GEDCOM_SPOUSES);$('status').textContent='✅ '+people.length+' family members loaded · '+people.reduce((n,p)=>n+parents(p).length,0)+' GEDCOM parent links · '+rootPeople().length+' family roots';render()}catch(e){$('status').innerHTML='❌ '+esc(e.message);$('content').innerHTML='<section class="panel"><div class="empty">Family data could not be loaded. No data was changed.</div></section>'}}$('search').oninput=render;$('treeTab').onclick=()=>{view='tree';render()};$('listTab').onclick=()=>{view='list';render()};load()})()</script></body></html>
