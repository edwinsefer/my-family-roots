<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Roots</title><style>body{margin:0;background:#f7f1e7;color:#2f2418;font:15px system-ui}.top{background:#6b4f2f;color:#fff;padding:18px;font-size:22px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:16px}.panel{background:#fffdf9;border:1px solid #dfd2bf;border-radius:18px;padding:18px;margin-bottom:14px}.input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #d8ccb9;border-radius:11px;font:inherit}.btn{padding:11px 15px;border:0;border-radius:10px;background:#6b4f2f;color:#fff;font:inherit;font-weight:700}.status{margin:10px 0;color:#756a5e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.person{background:#fff;border:1px solid #dfd2bf;border-radius:14px;padding:12px}.name{font-weight:800}.meta{font-size:12px;color:#756a5e}.family{text-align:center;margin:0 auto 40px}.couple{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}.couple .person{min-width:190px}.kids{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.kid{min-width:170px}.search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfd2bf;border-radius:11px;font:inherit}.hidden{display:none}</style></head><body><div class="top">🌳 My Family Roots <small style="font-size:12px;display:block">Keelapavoor Family Heritage</small></div><main class="wrap"><section id="login" class="panel"><h2>🔐 Family Login</h2><input id="email" class="input" type="email" placeholder="Email" autocomplete="username"><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="signin">🔑 Sign In</button><div id="loginStatus" class="status">Ready.</div></section><section id="app" class="hidden"><section class="panel"><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status"></div></section><div id="content"></div></section></main><script src="gedcom-relationships.js?v=20260911-1"></script><script>(()=>{const U='https://umbhqintywwsyduzrtai.supabase.co',K='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8';let people=[],map=new Map(),P={},S={};const $=id=>document.getElementById(id),key=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase();let m=s.match(/i\d+/i);return m?m[0].toLowerCase():s},arr=v=>Array.isArray(v)?v:(v==null||v===''?[]:String(v).split(/[,;|\s]+/).filter(Boolean)),normRel=g=>{let o={};Object.entries(g||{}).forEach(([k,v])=>o[key(k)]=arr(v).map(key));return o},parents=p=>(P[key(p.gedcom_id)]||[]).map(id=>map.get(id)).filter(Boolean),spouses=p=>(S[key(p.gedcom_id)]||[]).map(id=>map.get(id)).filter(Boolean),children=p=>people.filter(c=>parents(c).some(x=>key(x.gedcom_id)===key(p.gedcom_id)));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(p){return '<div class="person"><div class="name">👤 '+esc(p.full_name||'Unnamed')+'</div><div class="meta">'+esc(p.gedcom_id||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></div>'}function roots(){let childIds=new Set();people.forEach(p=>{if(parents(p).length)childIds.add(key(p.gedcom_id))});let out=[];for(let p of people){let id=key(p.gedcom_id);if(childIds.has(id))continue;let ss=spouses(p).map(x=>key(x.gedcom_id));if(!out.some(r=>key(r.gedcom_id)===id||ss.includes(key(r.gedcom_id))))out.push(p)}return out}function unit(p){let ps=spouses(p),ks=children(p).slice();ps.forEach(s=>children(s).forEach(c=>{if(!ks.some(x=>key(x.gedcom_id)===key(c.gedcom_id)))ks.push(c)}));return '<section class="family"><div class="couple">'+card(p)+ps.map(s=>'<span>💍</span>'+card(s)).join('')+'</div>'+(ks.length?'<div class="kids">'+ks.map(card).join('')+'</div>':'')+'</section>'}function render(){let q=$('search').value.trim().toLowerCase(),a=q?people.filter(p=>(p.full_name+' '+p.gedcom_id).toLowerCase().includes(q)):null;$('content').innerHTML='<div class="panel"><div class="status">✅ '+people.length+' family members loaded · '+people.reduce((n,p)=>n+parents(p).length,0)+' GEDCOM parent links · '+roots().length+' family roots</div>'+(q?'<div class="grid">'+a.map(card).join('')+'</div>':'<div>'+roots().map(unit).join('')+'</div>')+'</div>'}async function loadWithToken(token){let r=await fetch(U+'/rest/v1/family_members?select=*&order=full_name.asc',{headers:{apikey:K,Authorization:'Bearer '+token,Accept:'application/json'}});let d=await r.json().catch(()=>null);if(!r.ok)throw Error('Database HTTP '+r.status+(d?.message?': '+d.message:''));people=d.map(p=>({...p,gedcom_id:p.external_id||p.gedcom_id})).filter(p=>p.gedcom_id);map=new Map(people.map(p=>[key(p.gedcom_id),p]));P=normRel(window.GEDCOM_PARENTS);S=normRel(window.GEDCOM_SPOUSES);$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}async function login(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginStatus').textContent='❌ Enter email and password.';return}$('signin').disabled=true;$('loginStatus').textContent='Connecting…';try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json().catch(()=>null);if(!r.ok||!d?.access_token)throw Error(d?.error_description||d?.msg||'Sign in failed');await loadWithToken(d.access_token);$('loginStatus').textContent='';}catch(e){$('loginStatus').textContent='❌ '+(e.message||e);$('signin').disabled=false}}$('signin').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('search').oninput=render})()</script></body></html>
