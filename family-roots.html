<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Family Roots</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gedcom-relationships.js"></script><style>body{margin:0;background:#f7f1e7;color:#2f2418;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(135deg,#3d2918,#6b4f2f);color:#fff;padding:16px}.bar{max-width:1200px;margin:auto;display:flex;gap:8px;align-items:center}.brand{font-size:20px;font-weight:800;margin-right:auto}.sub{display:block;font-size:11px;opacity:.8}.btn{border:1px solid #ffffff44;background:#ffffff18;color:inherit;border-radius:10px;padding:9px 12px;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:16px}.panel{background:#fffdf9;border:1px solid #e2d7c6;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #4d35140b}.search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e2d7c6;border-radius:12px;font:inherit}.status{margin-top:9px;color:#756a5e;white-space:pre-wrap}.tree{display:grid;gap:12px}.branch{border-left:3px solid #c99d3b;padding-left:14px}.person{display:inline-flex;flex-direction:column;gap:5px;width:220px;min-height:100px;border:1px solid #e2d7c6;border-radius:14px;padding:12px;background:#fff;cursor:pointer;margin:4px}.name{font-weight:800}.meta{color:#756a5e;font-size:12px}.children{margin:6px 0 8px 18px;padding:8px 0 0 14px;border-left:2px dashed #e2d7c6;display:grid;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid .person{width:auto;margin:0}.empty{text-align:center;padding:30px;color:#756a5e}@media(max-width:700px){.person{width:100%;margin:3px 0}.bar{flex-wrap:wrap}}</style></head><body><header class="top"><div class="bar"><div class="brand">🌳 My Family Roots<span class="sub">Keelapavoor Family Heritage</span></div><button class="btn" onclick="setView('tree')">🌳 Tree</button><button class="btn" onclick="setView('list')">📋 List</button><button class="btn" onclick="expandAll()">＋ Expand</button><button class="btn" onclick="collapseAll()">− Collapse</button><button class="btn" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="panel"><input id="search" class="search" placeholder="🔍 Search family member…"><div id="status" class="status">Starting Family Roots…</div></section><div id="content"></div></main><script>(function(){'use strict';const URL='https://umbhqintywwsyduzrtai.supabase.co',KEY='sb_publishable_AYrzuQeyD0z1dC4hQntqnQ_kY2KEt8',SK='mfr_session_v1';let people=[],view='tree',open=new Set(),byKey=new Map();const GP=window.GEDCOM_PARENTS||{},GS=window.GEDCOM_SPOUSES||{};const status=document.getElementById('status');const canon=v=>{let s=String(v??'').trim().replace(/^@|@$/g,'').toLowerCase(),m=s.match(/i\d+/i);return m?m[0].toLowerCase():s};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const vals=v=>{if(v==null||v==='')return[];if(Array.isArray(v))return v.flatMap(vals);let s=String(v);try{let j=JSON.parse(s);if(j!==s)return vals(j)}catch{}return s.split(/[,;|\s]+/).filter(Boolean)};const sess=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}};function headers(){let s=sess();return{apikey:KEY,Authorization:'Bearer '+(s?.access_token||''),Accept:'application/json'}}async function request(path){let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{let r=await fetch(URL+path,{headers:headers(),signal:ctl.signal});let text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error('HTTP '+r.status+(data?.message?': '+data.message:''));return data}catch(e){if(e.name==='AbortError')throw new Error('Supabase request timed out after 10 seconds.');throw e}finally{clearTimeout(timer)}}function map(){byKey=new Map(people.map(p=>[canon(p.external_id),p]))}function ged(m,id){let k=canon(id);return m[id]||m[k]||m['@'+k+'@']||m['@'+k]||[]}function rel(p,f,m){let a=vals(p[f]).map(canon).map(k=>byKey.get(k)).filter(Boolean);return a.length?a:ged(m,p.external_id).map(canon).map(k=>byKey.get(k)).filter(Boolean)}function parents(p){return rel(p,'parent_ids',GP)}function spouses(p){return rel(p,'spouse_ids',GS)}function children(p){let k=canon(p.external_id);return people.filter(c=>parents(c).some(x=>canon(x.external_id)===k))}function roots(){let child=new Set();people.forEach(p=>parents(p).forEach(()=>child.add(canon(p.external_id))));let rs=people.filter(p=>!child.has(canon(p.external_id))),out=[];rs.forEach(p=>{let s=spouses(p).map(x=>canon(x.external_id));if(!out.some(x=>canon(x.external_id)===canon(p.external_id)||s.includes(canon(x.external_id))))out.push(p)});return out}function card(p){return '<article class="person" onclick="profile(\''+esc(p.external_id)+'\')"><div>👤</div><div class="name">'+esc(p.full_name||'Unnamed')+'</div><div class="meta">Gen '+esc(p.generation||'')+(p.birth_date?' · 🎂 '+esc(p.birth_date):'')+'</div></article>'}function branch(p,seen=new Set()){let k=canon(p.external_id);if(seen.has(k))return'';let n=new Set(seen);n.add(k),sp=spouses(p),kids=children(p),is=open.has(k),h='<div class="branch"><div><button class="btn" style="color:#2f2418;background:#fff" onclick="event.stopPropagation();toggle(\''+esc(p.external_id)+'\')">'+(is?'−':'＋')+'</button> <b>Family branch</b></div>'+card(p);if(sp.length)h+='<div class="meta">💍 '+sp.map(x=>esc(x.full_name)).join(' · ')+'</div>';if(is&&kids.length)h+='<div class="children">'+kids.map(x=>branch(x,n)).join('')+'</div>';return h+'</div>'}function render(){let q=document.getElementById('search').value.trim().toLowerCase(),c=document.getElementById('content');if(view==='list'||q){let a=people.filter(p=>[p.full_name,p.place,p.occupation,p.bio].join(' ').toLowerCase().includes(q));c.innerHTML=a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<div class="panel empty">No family member found.</div>';return}c.innerHTML='<div class="tree">'+roots().map(p=>branch(p)).join('')+'</div>'}function toggle(id){let k=canon(id);open.has(k)?open.delete(k):open.add(k);render()}function expandAll(){people.forEach(p=>open.add(canon(p.external_id)));render()}function collapseAll(){open.clear();render()}function setView(v){view=v;render()}async function load(){try{let s=sess();if(!s?.access_token){status.textContent='❌ No saved session. Returning to Login…';setTimeout(()=>location.replace('login.html?v=20260909-login'),700);return}status.textContent='🔄 Connecting to Supabase…';people=await request('/rest/v1/family_members?select=*&order=full_name.asc');if(!Array.isArray(people))throw new Error('Unexpected database response.');map();people.forEach(p=>open.add(canon(p.external_id)));let links=people.reduce((n,p)=>n+parents(p).length,0);status.textContent='✅ '+people.length+' family members loaded · '+links+' relationship links active · '+roots().length+' family roots';render()}catch(e){status.textContent='❌ '+(e.message||String(e));document.getElementById('content').innerHTML='<div class="panel empty">Family data could not be loaded. The exact error is shown above.</div>'}}async function logout(){localStorage.removeItem(SK);location.replace('login.html?v=20260909-login')}function profile(id){let p=byKey.get(canon(id));if(p)alert((p.full_name||'Unnamed')+'\n\nParents: '+(parents(p).map(x=>x.full_name).join(', ')||'—')+'\nSpouse: '+(spouses(p).map(x=>x.full_name).join(', ')||'—')+'\nChildren: '+(children(p).map(x=>x.full_name).join(', ')||'—'))}document.getElementById('search').addEventListener('input',render);window.setView=setView;window.expandAll=expandAll;window.collapseAll=collapseAll;window.toggle=toggle;window.logout=logout;window.profile=profile;load()})();</script></body></html>
